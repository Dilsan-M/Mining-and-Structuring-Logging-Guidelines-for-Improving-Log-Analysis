 {"id": "CG-0884", "guideline": "Single point of analysis Consistent formatting Scalable storage Automated processing Cost efficiency.", "dimension": "Where to log", "theme": "Logging scope", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0885", "guideline": "Store audit records with tenant, actor, action, resource, change, metadata, and timestamp fields; redact PII in change data, avoid storing raw IP addresses, use a truncated hash for forensic IP correlation, and truncate user-agent metadata.", "dimension": "Where to log", "theme": "Logging scope", "theme_basis": "Inductive", "original_count": "1", "examples": [{"reason": "```typescript\nexport const auditLogs = pgTable('audit_log', {  // canonical name TBD in Phase 1 — see doc-17 §7.3\n  id: uuid('id').primaryKey().defaultRandom(),\n  tenantId: uuid('tenant_id').notNull().references(() => tenants.id),\n  actorId: uuid('actor_id'),\n  actorType: text('actor_type').notNull(), // 'user' | 'system' | 'api_key'\n  action: text('action').notNull(),        // 'contact.created', 'auth.login_failed'\n  resourceType: text('resource_type').notNull(),\n  resourceId: uuid('resource_id'),\n  changes: jsonb('changes'),               // { before: {...}, after: {...} } — REDACTED PII\n  metadata: jsonb('metadata'),             // { ipHash: 'sha256-truncated', correlationId, userAgent: 'truncated' }\n  // Raw IP is never stored in audit_logs. Use SHA-256 truncated hash for forensics without GDPR exposure.\n  createdAt: timestamp('created_at').defaultNow().notNull(),\n});\n```", "repository": "purposestack/givernance", "url": "https://github.com/purposestack/givernance/blob/5950cbce7ee516a3a869816ccfc6efc7906f3065/.claude/agents/log-analyst.md?plain=1", "original_guideline": "Store audit records with tenant, actor, action, resource, change, metadata, and timestamp fields; redact PII in change data, avoid storing raw IP addresses, use a truncated hash for forensic IP correlation, and truncate user-agent metadata."}]}, {"id": "CG-0886", "guideline": "Test each debug category flag to verify correct filtering.", "dimension": "Where to log", "theme": "Logging scope", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0887", "guideline": "The logging configuration is defined in `Warp.WebApp/CodeGeneration/log-events.json`.", "dimension": "Where to log", "theme": "Logging scope", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0888", "guideline": "The problem is neither the `divide` or `calculate` functions should really be logging anything regarding errors. Error logging should be as centralized as possible in order to avoid cluttering logs with duplicate information. This often means logging errors at the outer-most areas of a program.", "dimension": "Where to log", "theme": "Logging scope", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0889", "guideline": "These logs will be forwarded to slog drains.", "dimension": "Where to log", "theme": "Logging scope", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0890", "guideline": "These techniques should only be used in very rare cases such as badly chosen logging defaults in libraries. Add a config option to disable those if you use them.", "dimension": "Where to log", "theme": "Logging scope", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0891", "guideline": "This error is then returned all the way to the main function where it is logged via the structured logging framework Logrus.", "dimension": "Where to log", "theme": "Logging scope", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0892", "guideline": "This is the primary way components create their tagged loggers.", "dimension": "Where to log", "theme": "Logging scope", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0893", "guideline": "This keeps the pattern append-only for regular authenticated users. Server-only service-role code can still write operational logs when needed.", "dimension": "Where to log", "theme": "Logging scope", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0894", "guideline": "Time and Context Requirements: Synchronized time across all systems (NTP) Time zone awareness (preferably UTC) Unique transaction IDs for correlation Session identifiers for user tracking Request context for web applications.", "dimension": "Where to log", "theme": "Logging scope", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0895", "guideline": "To select the appropriate logs for security incident response, you should start with the common cloud application stack, which consists of the components and layers of your application deployed on AWS.", "dimension": "Where to log", "theme": "Logging scope", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0896", "guideline": "Update category mappings as new modules are added.", "dimension": "Where to log", "theme": "Logging scope", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0897", "guideline": "Use rotating file handler to avoid infinite log growth.", "dimension": "Where to log", "theme": "Logging scope", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0898", "guideline": "Use Server-Sent Events so the frontend can show which agent is running, complete, etc., including which model each agent uses. This is critical for the demo — judges see different AI models activating one by one.", "dimension": "Where to log", "theme": "Logging scope", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0899", "guideline": "Use structured logging and include fields `scrape_configs`, `static_configs`, `labels`, `job`, `env`, `app`, `component`, `pipeline_stages`, `expressions`, `level`, `timestamp`, `message`, and 4 more.", "dimension": "Where to log", "theme": "Logging scope", "theme_basis": "Inductive", "original_count": "1", "examples": [{"reason": "```yaml\n# Promtail config example\nscrape_configs:\n  - job_name: application_logs\n    static_configs:\n      - targets:\n          - localhost\n        labels:\n          job: application\n          env: production\n          app: user_service\n          component: api\n    pipeline_stages:\n      - json:\n          expressions:\n            level: level\n            timestamp: timestamp\n            message: message\n            userID: userID\n            requestID: requestID\n      - labels:\n          level:\n          component:\n      - timestamp:\n          source: timestamp\n          format: RFC3339\n      - output:\n          source: message\n```", "repository": "Compile-N-Run/Compile-N-Run", "url": "https://github.com/Compile-N-Run/Compile-N-Run/blob/f0fe327e13fe8f6a553e835512d3a25f12a155b3/docs/observability/loki/17-best-practices/0-logging-standards.mdx", "original_guideline": "Use structured logging and include fields `scrape_configs`, `static_configs`, `labels`, `job`, `env`, `app`, `component`, `pipeline_stages`, `expressions`, `level`, `timestamp`, `message`, and 4 more."}]}, {"id": "CG-0900", "guideline": "Use the following logging configuration: `k8s.namespace`: string, K8s namespace, k8sattributes processor; `k8s.pod`: string, Pod name, k8sattributes processor; `k8s.node`: string, Node name, k8sattributes processor; `k8s.container`: string, Container name, k8sattributes processor; `k8s.deployment`: string, Deployment name, k8sattributes processor; `host.name`: string, Hostname (legacy), Resource detection.", "dimension": "Where to log", "theme": "Logging scope", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0901", "guideline": "Verify schedule time tracking logs.", "dimension": "Where to log", "theme": "Logging scope", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0902", "guideline": "When the feature is enabled (`minidletime > 0`), `IdleController` logs a one-shot summary at startup using the standard `log_step` utility with prefix `[IDLE]`.", "dimension": "Where to log", "theme": "Logging scope", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0903", "guideline": "When you do: * `\"my_app\"` is just the logger name. It’s a string you choose to group related logs. In practice, it’s common to use: `\"my_app\"` → application-wide logger (main entry point) `name` → module-specific logger So `\"my_app\"` in the earlier example meant: *all logs from this application are tagged under this name*.", "dimension": "Where to log", "theme": "Logging scope", "theme_basis": "Inductive", "original_count": "1", "examples": [{"reason": "When you do:\n\n```python\nlogger = logging.getLogger(\"my_app\")\n```\n\n* `\"my_app\"` is just the **logger name**.\n* It’s a string you choose to group related logs.\n* In practice, it’s common to use:\n\n  * `\"my_app\"` → **application-wide logger** (main entry point)\n  * `__name__` → **module-specific logger**\n\nSo `\"my_app\"` in the earlier example meant: *all logs from this application are tagged under this name*.", "repository": "pandey-g/various_notes", "url": "https://github.com/pandey-g/various_notes/blob/7b2514cd235f6af69599f34b57c750dca0c9d9f3/JWT.md?plain=1", "original_guideline": "When you do: * `\"my_app\"` is just the logger name. It’s a string you choose to group related logs. In practice, it’s common to use: `\"my_app\"` → application-wide logger (main entry point) `name` → module-specific logger So `\"my_app\"` in the earlier example meant: *all logs from this application are tagged under this name*."}]}, {"id": "CG-0904", "guideline": "WithLogger creates a new logger and attaches it to the Context. func WithLogger(ctx context.Context, w io.Writer, fields Fields) context.Context { l := NewLogger(w, fields) return context.WithValue(ctx, loggerKey, l) }.", "dimension": "Where to log", "theme": "Logging scope", "theme_basis": "Inductive", "original_count": "1", "examples": [{"reason": "// WithLogger creates a new logger and attaches it to the Context.\nfunc WithLogger(ctx context.Context, w io.Writer, fields Fields) context.Context {\n\tl := NewLogger(w, fields)\n\n\treturn context.WithValue(ctx, loggerKey, l)\n}", "repository": "fiskaly/golog", "url": "https://github.com/fiskaly/golog/blob/8f9568c0d5c6e53372eed3e9f7ef13ea48b24329/golog.go", "original_guideline": "WithLogger creates a new logger and attaches it to the Context. func WithLogger(ctx context.Context, w io.Writer, fields Fields) context.Context { l := NewLogger(w, fields) return context.WithValue(ctx, loggerKey, l) }."}]}, {"id": "CG-0905", "guideline": "Write guide for configuring logging in production environments.", "dimension": "Where to log", "theme": "Logging scope", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0906", "guideline": "You can attach this policy in the following locations: ![](images/flow_policy_message_77b24fe.png).", "dimension": "Where to log", "theme": "Logging scope", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0907", "guideline": "| `LoggingInterceptor` | `enable_logging=True` | Logs RPC method, duration, and status |.", "dimension": "Where to log", "theme": "Logging scope", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0908", "guideline": "::: danger Separate Your Audit Logs From Application Logs Audit logs must be stored in a system that the application cannot modify. If an attacker compromises your application, they should not be able to erase their tracks. Store audit logs in a separate account, use write-once storage, and restrict access to the security team only. ::.", "dimension": "Where to log", "theme": "Logic-branch logging", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0909", "guideline": "] [ ] Persist Slim UI diagnostics to file (Priority: P1, Effort: S): Add UI log file output under `%LOCALAPPDATA%\\\\AIUsageTracker\\\\logs\\\\ui_YYYY-MM-DD.log` with render-path checkpoints (`raw count`, `post-filter count`, empty-state branch, render exceptions) for post-incident debugging.[.", "dimension": "Where to log", "theme": "Logic-branch logging", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0910", "guideline": "A typical way to run qpsmtpd is as a supervised process with daemontools. If daemontools is already set up, setting up qpsmtpd may be as simple as.", "dimension": "Where to log", "theme": "Logic-branch logging", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0911", "guideline": "Create log directory if specified.", "dimension": "Where to log", "theme": "Logic-branch logging", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0912", "guideline": "Generally is a good idea to log the places where the program makes a decision (adding the information that lead to the program flow selection). I.e.: \"User <id> not deleted (not found in the data store)\".", "dimension": "Where to log", "theme": "Logic-branch logging", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0913", "guideline": "If applications log to stdout under systemd, the journal becomes the collection point.", "dimension": "Where to log", "theme": "Logic-branch logging", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0914", "guideline": "If handler is nil, logging is effectively disabled.", "dimension": "Where to log", "theme": "Logic-branch logging", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0915", "guideline": "If svcscan is running, the symlink will be detected and tcpserver will run the 'run' files in the ./ and ./log directories. Any log entries emitted will get handled per the instructions in log/run. The default location specified in log/run is log/main/current.", "dimension": "Where to log", "theme": "Logic-branch logging", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0916", "guideline": "If you pipe your logs into a centralized observability platform like Datadog, Splunk, or ELK, structured logging changes how you operate:.", "dimension": "Where to log", "theme": "Logic-branch logging", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0917", "guideline": "If you want to send syslog to one of those services, follow the service documentation of the concerned service to obtain the host, port, and protocol, then set the <Syslog\\> element on this policy accordingly.", "dimension": "Where to log", "theme": "Logic-branch logging", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0918", "guideline": "In this case the Plugin Supervisor SHALL assume responsibility for all log lifecycle management.", "dimension": "Where to log", "theme": "Logic-branch logging", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0919", "guideline": "Requirements: Operators must be able to see startup/validation/dispatch failures without attaching a debugger. Implementations may write to one or more sinks. If a configured log sink fails, the service should continue running when possible and emit an operator-visible warning through any remaining sink.", "dimension": "Where to log", "theme": "Logic-branch logging", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0920", "guideline": "Add the LAST command or file executed at the end of ai.log.", "dimension": "Where to log", "theme": "Observing-point logging", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0921", "guideline": "Include examples of maintaining logging context across package boundaries.", "dimension": "Where to log", "theme": "Observing-point logging", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0922", "guideline": "Initialize the logging middleware in the routes setup after the preceding middleware has been added.", "dimension": "Where to log", "theme": "Observing-point logging", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0923", "guideline": "Log at boundaries. Entry and exit points of functions, API handlers, and external calls are the highest-value places to log.", "dimension": "Where to log", "theme": "Observing-point logging", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0924", "guideline": "The block appears during `MainWindow` construction, near the `[TRAY]` block (it currently logs just before `[TRAY]` because the controller is instantiated before the taskbar icon).", "dimension": "Where to log", "theme": "Observing-point logging", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0925", "guideline": "You can store access logs in S3 buckets for long-term storage for compliance purposes and to run analyses during and after an event.", "dimension": "Where to log", "theme": "Observing-point logging", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0926", "guideline": "If some condition leads to default return values, it is a good place to put a logging statement to add more information about it. I.e.: HTTP Request timeout (<relevant call information>), returning empty array.", "dimension": "Where to log", "theme": "Return-value-check logging", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0927", "guideline": "\"Synchronous file write blocks event loop. Use async logging.\".", "dimension": "How to log", "theme": "Log lifecycle management", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0928", "guideline": "30 days covers the typical incident investigation window (most P1 post-mortems reference logs from the last 2–4 weeks). Beyond 30 days, application logs are rarely accessed and the storage cost isn't justified. Critical events in application logs are typically captured by audit logs with longer retention.", "dimension": "How to log", "theme": "Log lifecycle management", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0929", "guideline": "`LOG_MAX_BYTES`: Maximum log file size before rotation.", "dimension": "How to log", "theme": "Log lifecycle management", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0930", "guideline": "A multi-service application generates logs across several CloudWatch Log Groups. The company has a compliance requirement to retain security and audit logs for 1 year, operational logs for 30 days, and debug logs for 7 days. Currently all log groups have no retention policy set (infinite retention), costing $340/month in CloudWatch storage.", "dimension": "How to log", "theme": "Log lifecycle management", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0931", "guideline": "Async logging: `QueueHandler` for non-blocking logging.", "dimension": "How to log", "theme": "Log lifecycle management", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0932", "guideline": "Automatic log rotation to prevent disk space issues.", "dimension": "How to log", "theme": "Log lifecycle management", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0933", "guideline": "Basic log rotation.", "dimension": "How to log", "theme": "Log lifecycle management", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0934", "guideline": "Best Practices: Never log sensitive data (passwords, PII) Use structured, consistent formats Implement real-time monitoring Test your logging implementation Maintain appropriate retention policies.", "dimension": "How to log", "theme": "Log lifecycle management", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0935", "guideline": "Buffer security log events and flush them asynchronously so logging does not block request processing; flush when the buffer reaches its configured size and on the configured interval.", "dimension": "How to log", "theme": "Log lifecycle management", "theme_basis": "Inductive", "original_count": "1", "examples": [{"reason": "### **Optimization Strategies:**\n\n```python\n# Asynchronous logging to prevent blocking\nimport asyncio\nimport logging\nfrom concurrent.futures import ThreadPoolExecutor\n\nclass HighPerformanceSecurityLogger:\n    def __init__(self, buffer_size=1000, flush_interval=5):\n        self.buffer = []\n        self.buffer_size = buffer_size\n        self.flush_interval = flush_interval\n        self.executor = ThreadPoolExecutor(max_workers=4)\n        \n    async def log_security_event(self, event):\n        \"\"\"Non-blocking security event logging\"\"\"\n        self.buffer.append(event)\n        \n        if len(self.buffer) >= self.buffer_size:\n            await self.flush_buffer()\n    \n    async def flush_buffer(self):\n        \"\"\"Flush buffer to persistent storage\"\"\"\n        if not self.buffer:\n            return\n            \n        batch = self.buffer.copy()\n        self.buffer.clear()\n        \n        # Process batch asynchronously\n        loop = asyncio.get_event_loop()\n        await loop.run_in_executor(self.executor, self.write_batch, batch)\n    \n    def write_batch(self, events):\n        \"\"\"Write events to storage (runs in thread)\"\"\"\n        try:\n            # Bulk write to reduce I/O overhead\n            for event in events:\n                # Write to centralized log system\n                self.send_to_log_server(event)\n        except Exception as e:\n            # Fallback to local logging\n            local_logger.error(f\"Failed to send logs: {e}\")\n```", "repository": "chuckmccullough85/UMBCWebsec", "url": "https://github.com/chuckmccullough85/UMBCWebsec/blob/eeca670d060e8676713677a1e18006ad3290f47e/chapter9/chapter9_event_logging_slides.md?plain=1", "original_guideline": "Buffer security log events and flush them asynchronously so logging does not block request processing; flush when the buffer reaches its configured size and on the configured interval."}]}, {"id": "CG-0936", "guideline": "CloudTrail trail — For longer retention and visibility of data events, you need to create a CloudTrail trail and associate it with an S3 bucket and optionally with an Amazon CloudWatch log group.", "dimension": "How to log", "theme": "Log lifecycle management", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0937", "guideline": "Configurable backup count (default: 5 backups).", "dimension": "How to log", "theme": "Log lifecycle management", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0938", "guideline": "Configurable size and backup count.", "dimension": "How to log", "theme": "Log lifecycle management", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0939", "guideline": "Consider log drains - External services for long-term retention.", "dimension": "How to log", "theme": "Log lifecycle management", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0940", "guideline": "Control service log destinations with the space-separated `LOG_TYPES` setting: use `file` for plain-file logging (with external rotation and Web UI compatibility), `stderr` for container-standard error output, and `syslog` for a syslog server when `LOG_SYSLOG_ADDRESS` is configured.", "dimension": "How to log", "theme": "Log lifecycle management", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0941", "guideline": "Correct architecture. S3 destination + Firehose streaming + cross-account IAM roles + GZIP compression is the AWS Well-Architected pattern for multi-account log centralization.", "dimension": "How to log", "theme": "Log lifecycle management", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0942", "guideline": "File rotation and retention.", "dimension": "How to log", "theme": "Log lifecycle management", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0943", "guideline": "Flush pending Sentry events before shutdown using a 2 * time.Second timeout.", "dimension": "How to log", "theme": "Log lifecycle management", "theme_basis": "Inductive", "original_count": "1", "examples": [{"reason": "// Flush Sentry events\n\tsentry.Flush(2 * time.Second)", "repository": "philjestin/Daedalus", "url": "https://github.com/philjestin/Daedalus/blob/af954176f91c463860c7f1012ac6ced4059f4145/app.go", "original_guideline": "Flush pending Sentry events before shutdown using a 2 * time.Second timeout."}]}, {"id": "CG-0944", "guideline": "GZIP compression typically reduces JSON log size by 70–80%. For a compliance archive storing years of security logs, this directly translates to 70–80% S3 cost reduction. Parquet is better for analytics workloads but adds complexity for raw log storage.", "dimension": "How to log", "theme": "Log lifecycle management", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0945", "guideline": "If you implement your own reverse proxy for load balancing needs, make sure that you capture the reverse proxy access logs. You can use the unified CloudWatch agent to forward the logs to CloudWatch. As with OS logs, you can export CloudWatch logs to an S3 bucket for long-term retention and analysis.", "dimension": "How to log", "theme": "Log lifecycle management", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0946", "guideline": "Infinite retention on all log groups is expensive and unnecessary. Apply retention based on the purpose of each log group: compliance requirements drive audit log retention, operational utility drives application log retention.", "dimension": "How to log", "theme": "Log lifecycle management", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0947", "guideline": "Keep the logger guard alive for the logger lifetime so telemetry providers are flushed and shut down automatically when the guard is dropped.", "dimension": "How to log", "theme": "Log lifecycle management", "theme_basis": "Inductive", "original_count": "1", "examples": [{"reason": "```rust\nlet _guard = Logger::new(\"service\").init()?;\n// Providers are automatically flushed and shut down when _guard is dropped\n```", "repository": "nivek-ph/tracing-otel-extra", "url": "https://github.com/nivek-ph/tracing-otel-extra/blob/b9a926d44cb056a4f70658e0553638018d69cdb7/AGENTS.md?plain=1", "original_guideline": "Keep the logger guard alive for the logger lifetime so telemetry providers are flushed and shut down automatically when the guard is dropped."}]}, {"id": "CG-0948", "guideline": "Limit each session to 1,000 log entries; when the limit is reached, archive the oldest 500 and keep the newest 500, then export the full log when the session ends.", "dimension": "How to log", "theme": "Log lifecycle management", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0949", "guideline": "Log Graceful shutdown with proper resource cleanup.", "dimension": "How to log", "theme": "Log lifecycle management", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0950", "guideline": "Log Retention Strategy.", "dimension": "How to log", "theme": "Log lifecycle management", "theme_basis": "Inductive", "original_count": "1", "examples": [{"reason": "### **Log Retention Strategy:**\n\n```python\nclass LogRetentionManager:\n    def __init__(self):\n        self.retention_policies = {\n            \"security_events\": {\n                \"hot_storage\": 90,    # days - immediate access\n                \"warm_storage\": 365,  # days - quick retrieval  \n                \"cold_storage\": 2555, # days - 7 years archive\n                \"compliance\": \"SOX, PCI-DSS\"\n            },\n            \"audit_logs\": {\n                \"hot_storage\": 30,\n                \"warm_storage\": 180,\n                \"cold_storage\": 2555,\n                \"compliance\": \"SOX\"\n            },\n            \"access_logs\": {\n                \"hot_storage\": 30,\n                \"warm_storage\": 90,\n                \"cold_storage\": 365,\n                \"compliance\": \"Internal policy\"\n            }\n        }\n    \n    def archive_logs(self, log_type, age_days):\n        \"\"\"Move logs to appropriate storage tier\"\"\"\n        policy = self.retention_policies[log_type]\n        \n        if age_days > policy[\"cold_storage\"]:\n            return self.delete_logs(log_type, age_days)\n        elif age_days > policy[\"warm_storage\"]:\n            return self.move_to_cold_storage(log_type, age_days)\n        elif age_days > policy[\"hot_storage\"]:\n            return self.move_to_warm_storage(log_type, age_days)\n```", "repository": "chuckmccullough85/UMBCWebsec", "url": "https://github.com/chuckmccullough85/UMBCWebsec/blob/eeca670d060e8676713677a1e18006ad3290f47e/chapter9/chapter9_event_logging_slides.md?plain=1", "original_guideline": "Log Retention Strategy."}]}, {"id": "CG-0951", "guideline": "Log rotation configuration.", "dimension": "How to log", "theme": "Log lifecycle management", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0952", "guideline": "Log rotation monitoring.", "dimension": "How to log", "theme": "Log lifecycle management", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0953", "guideline": "Log rotation with date-based files.", "dimension": "How to log", "theme": "Log lifecycle management", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0954", "guideline": "Log rotation.", "dimension": "How to log", "theme": "Log lifecycle management", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0955", "guideline": "Logging architecture is a surprisingly deep skill that separates reactive engineers from proactive ones. Engineers who design logging systems with structured output, appropriate retention, and real-time centralization give their teams the tools to investigate incidents in minutes rather than hours.", "dimension": "How to log", "theme": "Log lifecycle management", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0956", "guideline": "Performance Considerations: Use asynchronous logging, implement sampling for high-volume events.", "dimension": "How to log", "theme": "Log lifecycle management", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0957", "guideline": "Protect logs from tampering Review logs regularly Plan retention and compliance.", "dimension": "How to log", "theme": "Log lifecycle management", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0958", "guideline": "Purpose: Maximum log file size before rotation.", "dimension": "How to log", "theme": "Log lifecycle management", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0959", "guideline": "Retain security and audit logs for 12 months to support security investigations and compliance audits, rather than keeping them indefinitely when longer retention is not required.", "dimension": "How to log", "theme": "Log lifecycle management", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0960", "guideline": "Rotate `/var/log/myapp/*.log` daily, retain 14 rotations, compress rotated files, skip missing or empty logs, and use copy-truncate rotation.", "dimension": "How to log", "theme": "Log lifecycle management", "theme_basis": "Inductive", "original_count": "1", "examples": [{"reason": "```conf\n/var/log/myapp/*.log {\n    daily\n    rotate 14\n    compress\n    missingok\n    notifempty\n    copytruncate\n}\n```", "repository": "ShasidharReddy/Shasi-Linux", "url": "https://github.com/ShasidharReddy/Shasi-Linux/blob/6aaa3b72b7d2b75b7a55df73b8abcfd6e15adca1/11-DevOps/07-log-aggregation.md?plain=1", "original_guideline": "Rotate `/var/log/myapp/*.log` daily, retain 14 rotations, compress rotated files, skip missing or empty logs, and use copy-truncate rotation."}]}, {"id": "CG-0961", "guideline": "Rotate and archive logs regularly.", "dimension": "How to log", "theme": "Log lifecycle management", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0962", "guideline": "Set log retention periods by category: debug logs need only days, application logs need 30 days, compliance audit logs need 1 year.", "dimension": "How to log", "theme": "Log lifecycle management", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0963", "guideline": "Size-based rotation (configurable via `LOG_MAX_BYTES`).", "dimension": "How to log", "theme": "Log lifecycle management", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0964", "guideline": "Size-based rotation (default: 10MB per file).", "dimension": "How to log", "theme": "Log lifecycle management", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0965", "guideline": "Some retention periods are correct but review the debug and audit logs. Debug logs should be very short (7 days), audit logs must meet compliance minimums (1 year).", "dimension": "How to log", "theme": "Log lifecycle management", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0966", "guideline": "Stop a timer by its label; if no label is supplied, stop the most recently created unlabeled timer, and retain the returned timer label and elapsed span.", "dimension": "How to log", "theme": "Log lifecycle management", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0967", "guideline": "Storage Considerations: Encryption at rest for sensitive logs Compression for long-term storage Indexing for searchability Backup and recovery procedures Geographic distribution for disaster recovery.", "dimension": "How to log", "theme": "Log lifecycle management", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0968", "guideline": "Structured Security Logger with event categorization Real-time Alert System with configurable thresholds Log Retention Manager with compliance features SIEM Integration capability Basic Threat Hunting queries.", "dimension": "How to log", "theme": "Log lifecycle management", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0969", "guideline": "The default logging policy for services (process that are supposed to keep running) is to rotate the logs once they reach 3M in size. This can be configured via the `logrotate_max_size` option (takes a number followed by a `k`/`M`/`G` suffix).", "dimension": "How to log", "theme": "Log lifecycle management", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0970", "guideline": "Treat the resulting log stream as the same sensitivity class as the database itself; rotate and access-control it accordingly.", "dimension": "How to log", "theme": "Log lifecycle management", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0971", "guideline": "Use `RotatingFileHandler` for automatic log rotation.", "dimension": "How to log", "theme": "Log lifecycle management", "theme_basis": "Inductive", "original_count": "2", "examples": []}, {"id": "CG-0972", "guideline": "Use categorized DEBUG logging for runtime diagnostics: `airpods` for `Battery event: 10% drop detected, device: {}, from {}% to {}%, elapsed: {} min`; `airpods` for `Depletion rate buffer updated: {} samples, median rate: {:.2} min/10%`; `airpods` for `Prediction: {}% remaining, estimated time-to-empty: {} min, confidence: {}`; `system` for `Battery intelligence model error: {}`.", "dimension": "How to log", "theme": "Log lifecycle management", "theme_basis": "Inductive", "original_count": "1", "examples": [{"reason": "```rust\ncrate::debug_log!(\"airpods\", \"Battery event: 10% drop detected, device: {}, from {}% to {}%, elapsed: {} min\", device_id, prev_level, curr_level, elapsed_min);\ncrate::debug_log!(\"airpods\", \"Depletion rate buffer updated: {} samples, median rate: {:.2} min/10%\", buffer_len, median_rate);\ncrate::debug_log!(\"airpods\", \"Prediction: {}% remaining, estimated time-to-empty: {} min, confidence: {}\", est_level, time_to_empty, confidence);\ncrate::debug_log!(\"system\", \"Battery intelligence model error: {}\", error_msg);\n```", "repository": "Jay1/RustPods", "url": "https://github.com/Jay1/RustPods/blob/9bd9c17976b2409b4624bf1b958d3cc113223948/docs/index.md?plain=1", "original_guideline": "Use categorized DEBUG logging for runtime diagnostics: `airpods` for `Battery event: 10% drop detected, device: {}, from {}% to {}%, elapsed: {} min`; `airpods` for `Depletion rate buffer updated: {} samples, median rate: {:.2} min/10%`; `airpods` for `Prediction: {}% remaining, estimated time-to-empty: {} min, confidence: {}`; `system` for `Battery intelligence model error: {}`."}]}, {"id": "CG-0973", "guideline": "Validate retention — confirm log rotation/TTL matches the retention policy.", "dimension": "How to log", "theme": "Log lifecycle management", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0974", "guideline": "Well configured. Tiered retention by log category matches business need against cost — debug logs expire quickly, audit logs meet compliance, operational logs cover the investigation window.", "dimension": "How to log", "theme": "Log lifecycle management", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0975", "guideline": "When you need to reconfigure basicConfig, use logging.basicConfig(force=True) or prefer dictConfig with disable_existing_loggers=False to avoid silent no-ops.", "dimension": "How to log", "theme": "Log lifecycle management", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0976", "guideline": "With AWS CloudTrail , you can log, continuously monitor, and retain account activity related to actions across supported AWS services .", "dimension": "How to log", "theme": "Log lifecycle management", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0977", "guideline": "With the unified CloudWatch agent , you can collect metrics and logs from EC2 instances and on-premises servers. The CloudWatch agent aggregates log data into CloudWatch logs , which can then be exported to Amazon S3 for long-term retention and analyzed with a SIEM tool of your choice or Amazon Athena , in Figure 1.", "dimension": "How to log", "theme": "Log lifecycle management", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0978", "guideline": "You can forward flow logs to Amazon CloudWatch Logs to create CloudWatch alarms based on metric filters. You can also forward flow logs to an S3 bucket for long-term retention and further analysis.", "dimension": "How to log", "theme": "Log lifecycle management", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0979", "guideline": "\"Add timestamp to logger format\".", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0980", "guideline": "./fly-deploy.sh logs # View logs.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "./fly-deploy.sh logs    # View logs", "repository": "Guztaver/regulacao", "url": "https://github.com/Guztaver/regulacao/blob/980704276d9f067b5bc08f8a32aa3630c875bddc/FLY.md?plain=1", "original_guideline": "./fly-deploy.sh logs # View logs."}]}, {"id": "CG-0981", "guideline": "5.1.3 Source code, comments, documentation, and log messages MUST be in English throughout.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0982", "guideline": "7.3.4 Logs are written in English.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0983", "guideline": "<fail, tolerated: tests run, msg failed, reject disabled.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0984", "guideline": "<fail: tests were run and the message failed.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0985", "guideline": "<info: additional info, not to be used for plugin summary.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0986", "guideline": "<pass: tests were run and the message passed.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0987", "guideline": "<skip: tests were not run.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0988", "guideline": "] [x] Handle bind race at runtime (Priority: P1, Effort: M): Wrap startup bind in retry logic for `AddressInUseException`; on collision, select a new port and retry with bounded attempts and structured logs.[.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0989", "guideline": "`cloudwatch.put_metric_data()` calls.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0990", "guideline": "`println!(\"something happened\")` without request/workspace context.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0991", "guideline": "Add dependencies.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "Add dependencies:\n   ```xml\n   <dependency>\n       <groupId>org.slf4j<\/groupId>\n       <artifactId>slf4j-api<\/artifactId>\n       <version>2.0.16<\/version>\n   <\/dependency>\n   <dependency>\n       <groupId>ch.qos.logback<\/groupId>\n       <artifactId>logback-classic<\/artifactId>\n       <version>1.5.12<\/version>\n   <\/dependency>\n   ```", "repository": "athenaeum-brew/einfuehrung", "url": "https://github.com/athenaeum-brew/einfuehrung/blob/b52d5c1f20861fa0fd02ac96c5e9bd5b5b94e2db/17.md?plain=1", "original_guideline": "Add dependencies."}]}, {"id": "CG-0992", "guideline": "Add indexes only for query patterns the app actually uses.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0993", "guideline": "Add Logging - As a system operator or developer, I want structured logging and metrics so that I can monitor performance and diagnose issues.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0994", "guideline": "Add structured logging and recovery middleware when a logger is available, and add metrics middleware when application metrics are available.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples" w to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1000", "guideline": "All team members must acknowledge the project’s aggressive logging policy before access is granted.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1001", "guideline": "Almost all server process _can_ be user configured to create text output relating to the ongoing life of the process in such a way that it does not alter the function of the process.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1002", "guideline": "Also, scoped loggers can have their own independent configuration, overriding the one inherited by the parent instance or `package.json`.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1003", "guideline": "Always capture the return value of bind() (or use context managers/contextvars) so the bound context is present on subsequent log calls.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1004", "guideline": "Always implement proper error handling and logging.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "2", "examples": []}, {"id": "CG-1005", "guideline": "Always override toString() to give a good representation of the object.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1006", "guideline": "Always use structured logging for easier analysis.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1007", "guideline": "Amazon OpenSearch Ser ins/config entry $self->{_args}{loglevel}. A simple and recommended example is as follows.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1015", "guideline": "Automatic cleanup of old logs and deleted messages.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1016", "guideline": "Avoid common anti-patterns.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1017", "guideline": "Avoid excessive debug output in tight loops.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1018", "guideline": "Avoid excessive per-request logging; record only selective, meaningful events such as security-relevant operations and slow responses instead of logging every request detail and intermediate result.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "```python\n# ❌ BAD: Excessive logging\ndef process_request(request):\n    logger.info(f\"Processing request: {request}\")\n    logger.debug(f\"Request headers: {request.headers}\")\n    logger.debug(f\"Request body: {request.body}\")\n    logger.info(f\"User agent: {request.headers.get('User-Agent')}\")\n    logger.info(f\"IP address: {request.remote_addr}\")\n    \n    result = business_logic(request)\n    \n    logger.info(f\"Business logic result: {result}\")\n    logger.debug(f\"Database queries executed: {db.query_count}\")\n    logger.info(f\"Response time: {time.time() - start_time}\")\n    \n    return result\n\n# ✅ GOOD: Selective, meaningful logging\ndef process_request(request):\n    start_time = time.time()\n    \n    # Log only security-relevant events\n    if is_sensitive_operation(request):\n        security_logger.info({\n            \"event\": \"sensitive_operation\",\n            \"user_id\": request.user.id,\n            \"operation\": request.path,\n            \"source_ip\": request.remote_addr\n        })\n    \n    result = business_logic(request)\n    \n    # Log performance issues\n    response_time = time.time() - start_time\n    if response_time > 2.0:\n        performance_logger.warning({\n            \"event\": \"slow_response\",\n            \"endpoint\": request.path,\n            \"response_time\": response_time\n        })\n    \n    return result\n```", "repository": "chuckmccullough85/UMBCWebsec", "url": "https://github.com/chuckmccullough85/UMBCWebsec/blob/eeca670d060e8676713677a1e18006ad3290f47e/chapter9/chapter9_event_logging_slides.md?plain=1", "original_guideline": "Avoid excessive per-request logging; record only selective, meaningful events such as security-relevant operations and slow responses instead of logging every request detail and intermediate result."}]}, {"id": "CG-1019", "guideline": "Avoid logging configuration directly impacts incident investigation capability. DEBUG in production and sampled errors means you'll be flying blind during incidents — exactly when you need logs most.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1020", "guideline": "Avoid logging in critical performance areas executed frequently.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1021", "guideline": "Avoid multi-line log messages.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1022", "guideline": "Avoid the log and throw practice. As this results in multiple log messages for a single problem in the code. Either log the exception, or throw it, but never do both. e.g.", "dimen ", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "level.Info(logger).Log(\"err\", err)", "repository": "mroject/freeswitch_exporter", "url": "https://github.com/mroject/freeswitch_exporter/blob/82b4980c060b0afa190f7743c455fa12b070b346/main.go", "original_guideline": "Level.Info(logger).Log(\"err\", err)."}]}, {"id": "CG-1130", "guideline": "LineEnding: config.LineEnding, EncodeLevel: encodeLevel(), EncodeTime: config.EncodeTime, EncodeDuration: config.EncodeDuration, EncodeCaller: config.EncodeCaller,.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "LineEnding:     config.LineEnding,\n\t\tEncodeLevel:    encodeLevel(),\n\t\tEncodeTime:     config.EncodeTime,\n\t\tEncodeDuration: config.EncodeDuration,\n\t\tEncodeCaller:   config.EncodeCaller,", "repository": "FelixKahle/gclzap", "url": "https://github.com/FelixKahle/gclzap/blob/42a1dc369b6e931ca51a3849d09aef543438cac1/encoder.go", "original_guideline": "LineEnding: config.LineEnding, EncodeLevel: encodeLevel(), EncodeTime: config.EncodeTime, EncodeDuration: config.EncodeDuration, EncodeCaller: config.EncodeCaller,."}]}, {"id": "CG-1131", "guideline": "Lint rules for prohibited logging patterns.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1132", "guideline": "LiteRun ships with `AgentLogger`, a utility designed specifically to emit highly structured, machine-readable logs.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1133", "guideline": "Log \"Swallowing\" errors (empty `catch` block) making debugging impossible.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1134", "guideline": "Log `[INFO] [%s] %s` using formatted logging.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "// Structured logging helpers\ntype LogEntry struct {\n\tTimestamp string\n\tRequestID string\n\tLevel     string\n\tMessage   string\n\tError     string\n}\n\nfunc logInfo(requestID, message string) {\n\tlog.Printf(\"[INFO] [%s] %s\", requestID, message)\n}\n\nfunc logError(requestID, message string, err error) {\n\tif err != nil {\n\t\tlog.Printf(\"[ERROR] [%s] %s: %v\", requestID, message, err)\n\t} else {\n\t\tlog.Printf(\"[ERROR] [%s] %s\", requestID, message)\n\t}\n}\n\nfunc logWarn(requestID, message string) {\n\tlog.Printf(\"[WARN] [%s] %s\", requestID, message)\n}", "repository": "emaktel/fs-api", "url": "https://github.com/emaktel/fs-api/blob/2f0f6dad3c6c4cc463c4d044a7ebb199f9b06642/utils.go", "original_guideline": "Log `[INFO] [%s] %s` using formatted logging."}]}, {"id": "CG-1135", "guideline": "Log aggregation: ELK Stack (Elasticsearch + Logstash + Kibana), Graylog, Datadog.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1136", "guideline": "Log Analysis Patterns.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "### **Log Analysis Patterns:**\n\n```bash\n# Find failed login attempts from specific IP\ngrep \"authentication.*failed\" security.log | grep \"192.168.1.100\" | wc -l\n\n# Extract unique user agents from access logs\ncat access.log | jq -r '.user_agent' | sort | uniq -c | sort -nr\n\n# Analyze login patterns by hour\ncat security.log | jq -r 'select(.event_type==\"login\") | .timestamp' | \n  cut -c12-13 | sort | uniq -c\n\n# Find privilege escalation events\ngrep -E \"(sudo|su|admin|root)\" security.log | \n  jq 'select(.severity==\"HIGH\" or .severity==\"CRITICAL\")'\n```", "repository": "chuckmccullough85/UMBCWebsec", "url": "https://github.com/chuckmccullough85/UMBCWebsec/blob/eeca670d060e8676713677a1e18006ad3290f47e/chapter9/chapter9_event_logging_slides.md?plain=1", "original_guideline": "Log Analysis Patterns."}]}, {"id": "CG-1137", "guideline": "Log Analysis Queries for Threat Hunting.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "### **Log Analysis Queries for Threat Hunting:**\n\n```sql\n-- Hunt for potential lateral movement\nSELECT \n    user_id, \n    source_ip, \n    COUNT(DISTINCT target_system) as systems_accessed,\n    MIN(timestamp) as first_access,\n    MAX(timestamp) as last_access\nFROM authentication_logs \nWHERE timestamp > NOW() - INTERVAL 24 HOUR\n    AND event_type = 'login_success'\nGROUP BY user_id, source_ip\nHAVING systems_accessed > 5\nORDER BY systems_accessed DESC;\n\n-- Hunt for data exfiltration patterns\nSELECT \n    user_id,\n    source_ip,\n    SUM(data_size) as total_downloaded,\n    COUNT(*) as download_events,\n    MAX(timestamp) as last_download\nFROM data_access_logs\nWHERE timestamp > NOW() - INTERVAL 7 DAY\n    AND action = 'download'\nGROUP BY user_id, source_ip\nHAVING total_downloaded > 1000000000  -- 1GB threshold\nORDER BY total_downloaded DESC;\n\n-- Hunt for unusual administrative activity\nSELECT \n    admin_user,\n    action_type,\n    COUNT(*) as action_count,\n    STRING_AGG(DISTINCT target_user, ', ') as affected_users\nFROM admin_action_logs\nWHERE timestamp > NOW() - INTERVAL 24 HOUR\n    AND action_type IN ('user_created', 'permission_granted', 'password_reset')\nGROUP BY admin_user, action_type\nHAVING action_count > 10\nORDER BY action_count DESC;\n```", "repository": "chuckmccullough85/UMBCWebsec", "url": "https://github.com/chuckmccullough85/UMBCWebsec/blob/eeca670d060e8676713677a1e18006ad3290f47e/chapter9/chapter9_event_logging_slides.md?plain=1", "original_guideline": "Log Analysis Queries for Threat Hunting."}]}, {"id": "CG-1138", "guideline": "Log and throw exception: Double logging.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1139", "guideline": "Log Automated Threat Hunting:.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "### **Automated Threat Hunting:**\n\n```python\nclass ThreatHunter:\n    def __init__(self, log_database):\n        self.db = log_database\n        self.hunting_rules = self.load_hunting_rules()\n    \n    def hunt_lateral_movement(self, time_window_hours=24):\n        \"\"\"Hunt for lateral movement patterns\"\"\"\n        query = \"\"\"\n        SELECT user_id, source_ip, COUNT(DISTINCT target_host) as host_count\n        FROM network_logs \n        WHERE timestamp > NOW() - INTERVAL %s HOUR\n        GROUP BY user_id, source_ip\n        HAVING host_count > 5\n        \"\"\"\n        \n        results = self.db.execute(query, [time_window_hours])\n        \n        for result in results:\n            if result['host_count'] > 10:\n                self.create_hunting_alert(\n                    \"POTENTIAL_LATERAL_MOVEMENT\",\n                    f\"User {result['user_id']} accessed {result['host_count']} systems\",\n                    result\n                )\n```", "repository": "chuckmccullough85/UMBCWebsec", "url": "https://github.com/chuckmccullough85/UMBCWebsec/blob/eeca670d060e8676713677a1e18006ad3290f47e/chapter9/chapter9_event_logging_slides.md?plain=1", "original_guideline": "Log Automated Threat Hunting:."}]}, {"id": "CG-1140", "guideline": "Log Consistent error handling and logging.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1141", "guideline": "Log DEBUG for `health_check` with `status`, `extra`.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": ),\n    });\n\n    orderLogger.log('Starting order processing');\n\n    try {\n      await this.validateOrder(orderLogger, orderData);\n      await this.processPayment(orderLogger, orderData);\n      await this.fulfillOrder(orderLogger, orderData);\n\n      orderLogger.log('Order processing completed');\n    } catch (error) {\n      orderLogger.error({\n        message: 'Order processing failed',\n        error: error.message,\n        stack: error.stack,\n      });\n      throw error;\n    }\n  }\n\n  private async validateOrder(logger: LoggerService, orderData: OrderDto): Promise<void> {\n    // Child logger automatically includes parent context\n    logger.debug('Validating order data');\n    // ... validation logic\n  }\n}\n```", "repository": "Paystack-MFB/nestjs-observability", "url": "https://github.com/Paystack-MFB/nestjs-observability/blob/87b280d79048785cb4cbf35ea3cb87b91d1b2f81/docs/best-practices.md?plain=1", "original_guideline": "Log DEBUG for `Validating order data`."}]}, {"id": "CG-1144", "guideline": "Log Document conditional logging for performance-sensitive operations.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1145", "guideline": "Log Empty Catch Blocks: Code that catches errors and does nothing.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1146", "guideline": "Log entry + optional notification.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1147", "guideline": "Log ERROR for `database`.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "//\tlogger.Error(\"database\", \"Connection failed\")", "repository": "MhunterDev/log4", "url": "https://github.com/MhunterDev/log4/blob/064737ba44e9dbf6ad2bfa s": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1156", "guideline": "Log INFO for `myapp`.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "//\tlogger.Info(\"myapp\", \"Application started\")", "repository": "MhunterDev/log4", "url": "https://github.com/MhunterDev/log4/blob/064737ba44e9dbf6ad2bfaa8d53b65a921d268c0/log4.go", "original_guideline": "Log INFO for `myapp`."}]}, {"id": "CG-1157", "guideline": "Log INFO for `Processing order `.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1158", "guideline": "Log INFO for `request` with `extra`.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "```python\nimport logging\nimport time\nfrom flask import Flask, request, g\n\napp = Flask(__name__)\nlogger = logging.getLogger(__name__)\n\n@app.before_request\ndef before_request():\n    g.start_time = time.time()\n    g.request_id = request.headers.get('X-Request-ID', str(uuid.uuid4()))\n\n@app.after_request\ndef after_request(response):\n    duration = time.time() - g.start_time\n    logger.info(\"request\", extra={\n        \"request_id\": g.request_id,\n        \"method\": request.method,\n        \"path\": request.path,\n        \"status\": response.status_code,\n        \"duration_ms\": round(duration * 1000, 2),\n        \"remote_addr\": request.headers.get('X-Forwarded-For', request.remote_addr)\n    })\n    return response\n```", "repository": "adhocteam/cloud-gov-instructions", "url": "https://github.com/adhocteam/cloud-gov-instructions/blob/64a6f40c7c07c5832faa4c9c9379df92b9ab311e/README.md?plain=1", "original_guideline": "Log INFO for `request` with `extra`."}]}, {"id": "CG-1159", "guideline": "Log INFO for `Task is running`.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "```python\nimport logging\nlogger = logging.getLogger(__name__)\n\ndef run_task():\n    logger.info(\"Task is running\")\n```", "repository": "pandey-g/various_notes", "url": "https://github.com/pandey-g/various_notes/blob/7b2514cd235f6af69599f34b57c750dca0c9d9f3/JWT.md?plain=1", "original_guideline": "Log INFO for `Task is running`."}]}, {"id": "CG-1160", "guideline": "Log INFO for `user_action` with `extra`.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "```python\nimport hashlib\n\ndef anonymize_user_id(user_id):\n    \"\"\"Create a consistent but anonymous user identifier for logs\"\"\"\n    return hashlib.sha256(f\"{user_id}-{SALT}\".encode()).hexdigest()[:16]\n\nlogger.info(\"user_action\", extra={\n    \"anonymous_user\": anonymize_user_id(user.id),\n    \"action\": \"profile_update\"\n})\n```", "repository": "adhocteam/cloud-gov-instructions", "url": "https://github.com/adhocteam/cloud-gov-instructions/blob/64a6f40c7c07c5832faa4c9c9379df92b9ab311e/README.md?plain=1", "original_guideline": "Log INFO for `user_action` with `extra`."}]}, {"id": "CG-1161", "guideline": "Log InitFromEnv initializes logger settings from environment variables.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1162", "guideline": "Log Interrupt conditions with the message \"User-requested interrupt\" even though R does not deliver a message. (incl. user-defined and interrupt).", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1163", "guideline": "Log Logged but not handled: Errors logged then ignored.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1164", "guideline": "Log messages MUST have the following format: MUST begin with a capital letter (with the exception of identifiers that conventionally begin with a lowercase) The ending period is MUST be omitted.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1165", "guideline": "Log Monitoring & Logging — Tracking model performance and identifying drift.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1166", "guideline": "Log No Manual Timestamps: Timestamps are automatically added by Node.js/Docker runtime.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1167", "guideline": "Log Once: Log errors only where they are handled (typically in cmd package), not where they are created.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1168", "guideline": "Log security-relevant errors.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1169", "guideline": "Log Statistical Analysis for Anomaly Detection:.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "### **Statistical Analysis for Anomaly Detection:**\n\n```python\nimport pandas as pd\nimport numpy as np\nfrom scipy import stats\n\nclass LogAnomalyDetector:\n    def __init__(self, baseline_days=30):\n        self.baseline_days = baseline_days\n        \n    def detect_login_anomalies(self, login_events):\n        \"\"\"Detect unusual login patterns\"\"\"\n        df = pd.DataFrame(login_events)\n        df['timestamp'] = pd.to_datetime(df['timestamp'])\n        df['hour'] = df['timestamp'].dt.hour\n        \n        # Analyze hourly login patterns\n        hourly_counts = df.groupby(['user_id', 'hour']).size().reset_index(name='count')\n        \n        # Calculate z-scores for each user's hourly patterns\n        user_stats = hourly_counts.groupby('user_id')['count'].agg(['mean', 'std'])\n        \n        anomalies = []\n        for _, row in hourly_counts.iterrows():\n            user_mean = user_stats.loc[row['user_id'], 'mean']\n            user_std = user_stats.loc[row['user_id'], 'std']\n            \n            if user_std > 0:\n                z_score = (row['count'] - user_mean) / user_std\n                if abs(z_score) > 3:  # 3-sigma rule\n                    anomalies.append({\n                        'user_id': row['user_id'],\n                        'hour': row['hour'],\n                        'count': row['count'],\n                        'z_score': z_score,\n                        'anomaly_type': 'unusual_login_time'\n                    })\n        \n        return anomalies\n```", "repository": "chuckmccullough85/UMBCWebsec", "url": "https://github.com/chuckmccullough85/UMBCWebsec/blob/eeca670d060e8676713677a1e18006ad3290f47e/chapter9/chapter9_event_logging_slides.md?plain=1", "original_guideline": "Log Statistical Analysis for Anomaly Detection:."}]}, {"id": "CG-1170", "guideline": "Log streaming interface.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1171", "guideline": "Log the issue to your workspace.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1172", "guideline": "Log tool usage for debugging and monitoring.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1173", "guideline": "Log Tracing spans can be connected to metrics systems.", "dimension": "How to log", "theme": "Logging approach", to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1206", "guideline": "Never use a normal string where an error is appropriate!", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1207", "guideline": "No. When you call: * Python’s logging system checks: “Do I already have a logger with the name `'my_app'`?” If yes → it returns the existing logger (same object). If no → it creates a new Logger object, registers it in a global dictionary, and returns it. So `\"my_app\"` is just a name string you invented, not prebuilt.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "👉 **No.**\nWhen you call:\n\n```python\nlogger = logging.getLogger(\"my_app\")\n```\n\n* Python’s logging system checks:\n\n  > “Do I already have a logger with the name `'my_app'`?”\n\n  * If **yes** → it returns the existing logger (same object).\n  * If **no** → it **creates a new Logger object**, registers it in a global dictionary, and returns it.\n\nSo `\"my_app\"` is just a **name string you invented**, not prebuilt.", "repository": "pandey-g/various_notes", "url": "https://github.com/pandey-g/various_notes/blob/7b2514cd235f6af69599f34b57c750dca0c9d9f3/JWT.md?plain=1", "original_guideline": "No. When you call: * Python’s logging system checks: “Do I already have a logger with the name `'my_app'`?” If yes → it returns the existing logger (same object). If no → it creates a new Logger object, registers it in a global dictionary, and returns it. So `\"my_app\"` is just a name string you invented, not prebuilt."}]}, {"id": "CG-1208", "guideline": "Notify Orchestrator via `sessions_send`.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1209", "guideline": "Override: Set `RUST_LOG` en \n\n```python\ndef detect_se1_modifying_session_token(self, request):\n    \"\"\"SE1: Modifying existing cookie\"\"\"\n    if self.session_token_modified_externally(request):\n        return self.create_detection_event('SE1', request)\n\ndef detect_se2_adding_session_token(self, request):\n    \"\"\"SE2: Adding new cookie\"\"\"\n    if self.unexpected_cookie_added(request):\n        return self.create_detection_event('SE2', request)\n```", "repository": "chuckmccullough85/UMBCWebsec", "url": "https://github.com/chuckmccullough85/UMBCWebsec/blob/eeca670d060e8676713677a1e18006ad3290f47e/chapter9/chapter9_event_logging_slides.md?plain=1", "original_guideline": "Session Management (SE) Detection Points:."}]}, {"id": "CG-1236", "guideline": "Set the default before anything else runs.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1237", "guideline": "Set your factory property to the actual log implementation you wish to use.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "2", "examples": []}, {"id": "CG-1238", "guideline": "Sets a timers and accepts an optional label. If none provided the timer will receive a unique label automatically. Returns a string corresponding to the timer label.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1239", "guideline": "Sets the configuration of an instance overriding any existing global or local configuration.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1240", "guideline": "So we can implement a default String() method on our struct. If we do so, then the Go compiler will use that method when printing.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1241", "guideline": "Some libraries use bad logging practices such as logging on too high a level. In these cases, you have three choices.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1242", "guideline": "Store keys in local `.env` files and strip them from shared logs.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1243", "guideline": "Store or transmit structured log data as GZIP-compressed JSON.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1244", "guideline": "Store production audit logs in immutable, versioned storage with compliance-mode object locking for 365 days, encryption at rest, blocked public access, and a write policy restricted to the audit service.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "```hcl\n# Terraform: Immutable audit log storage\nresource \"aws_s3_bucket\" \"audit_logs\" {\n  bucket = \"company-audit-logs-production\"\n\n  tags = {\n    Purpose    = \"audit-logging\"\n    Compliance = \"soc2,pci-dss,gdpr\"\n    Immutable  = \"true\"\n  }\n}\n\n# Enable versioning (required for Object Lock)\nresource \"aws_s3_bucket_versioning\" \"audit_logs\" {\n  bucket = aws_s3_bucket.audit_logs.id\n  versioning_configuration {\n    status = \"Enabled\"\n  }\n}\n\n# Object Lock — COMPLIANCE mode prevents even root from deleting\nresource \"aws_s3_bucket_object_lock_configuration\" \"audit_logs\" {\n  bucket = aws_s3_bucket.audit_logs.id\n\n  rule {\n    default_retention {\n      mode = \"COMPLIANCE\"  # Cannot be overridden by any user, including root\n      days = 365           # PCI DSS requires 1 year retention\n    }\n  }\n}\n\n# Encrypt at rest\nresource \"aws_s3_bucket_server_side_encryption_configuration\" \"audit_logs\" {\n  bucket = aws_s3_bucket.audit_logs.id\n\n  rule {\n    apply_server_side_encryption_by_default {\n      sse_algorithm     = \"aws:kms\"\n      kms_master_key_id = aws_kms_key.audit_logs.arn\n    }\n  }\n}\n\n# Block public access\nresource \"aws_s3_bucket_public_access_block\" \"audit_logs\" {\n  bucket = aws_s3_bucket.audit_logs.id\n\n  block_public_acls       = true\n  block_public_policy     = true\n  ignore_public_acls      = true\n  restrict_public_buckets = true\n}\n\n# Cross-account access policy — only the audit service can write\nresource \"aws_s3_bucket_policy\" \"audit_logs\" {\n  bucket = aws_s3_bucket.audit_logs.id\n\n  policy = jsonencode({\n    Version = \"2012-10-17\"\n    Statement = [\n      {\n        Sid       = \"AuditServiceWriteOnly\"\n        Effect    = \"Allow\"\n        Principal = { AWS = \"arn:aws:iam::role/audit-service\" }\n        Action    = [\"s3:PutObject\"]\n        Resource  = \"${aws_s3_bucket.audit_logs.arn}/*\"\n      },\n      {\n        Sid       = \"SecurityTeamReadOnly\"\n        Effect    = \"Allow\"\n        Principal = { AWS = \"arn:aws:iam::role/security-analyst\" }\n        Action    = [\"s3:GetObject\", \"s3:ListBucket\"]\n        Resource  = [\n          aws_s3_bucket.audit_logs.arn,\n          \"${aws_s3_bucket.audit_logs.arn}/*\"\n        ]\n      },\n      {\n        Sid       = \"DenyDeletion\"\n        Effect    = \"Deny\"\n        Principal = \"*\"\n        Action    = [\"s3:DeleteObject\", \"s3:DeleteObjectVersion\"]\n        Resource  = \"${aws_s3_bucket.audit_logs.arn}/*\"\n      }\n    ]\n  })\n}\n```", "repository": "ayush-jadaun/knowledge-vault", "url": "https://github.com/ayush-jadaun/knowledge-vault/blob/0131f844f9b77aba044bc84bb1103bd096bf8601/docs/security/compliance/audit-logging.md?plain=1", "original_guideline": "Store production audit logs in immutable, versioned storage with compliance-mode object locking for 365 days, encryption at rest, blocked public access, and a write policy restricted to the audit service."}]}, {"id": "CG-1245", "guideline": "Structure application logs for efficient querying and alerting.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1246", "guideline": "Structured JSON logging with configurable levels: `debug`: Detailed debugging information `info`: General operational information `warn`: Warning conditions `error`: Error conditions.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1247", "guideline": "Structured JSON logs are easier to parse and analyze:.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1248", "guideline": "Structured logging via LEAN `Log`.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1249", "guideline": "Structured Output: Log messages should be clear and descriptive.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1250", "guideline": "Support incident investigation with structured log queries and trace correlation.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1251", "guideline": "Switches all loggers belonging to the created instance into the interactive mode.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1252", "guideline": "TestHooks.configure({ screenshotOnFailure: true, logConsoleErrors: true, recordPerformanceMetrics: true, });.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_coun nd why. Adopting these logging principles will be invaluable when it comes to real-life production debugging.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1264", "guideline": "This is preferred in real apps because:.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1265", "guideline": "This is the current SMTP transaction (defined as everything that happens between HELO/EHLO and QUIT/RSET). If you want to defer outputting certain log lines, you can store them in the transaction object, but you will need to bind the C<reset_transaction> hook in order to retrieve that information before it is discarded when the transaction is closed (see the L<logging/adaptive> plugin for an example of doing this).", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1266", "guideline": "This is the hook that is currently being executed. If log() is called by any core code (i.e. not as part of a hook), this term will be C<undef>.", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1267", "guideline": "This is the plugin name that executed the log(). Like C<$hook>, if part of the core code calls log(), this wil be C<undef>. See L<logging/warn> for a way to prevent logging your own plugin's log entries from within that plugin (the system will not infinitely recurse in any case).", "dimension": "How to log", "theme": "Logging approach", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1268", "guideline": "This sample query can help you identify whether certain IAM principals have a significant amount of unauthorized API calls, which can indicate that an IAM principal is compromised.", "dimension": "How to log", "the
