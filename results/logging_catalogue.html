<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logging Guideline Catalogue</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f5f7fb;
    --panel: #ffffff;
    --text: #172033;
    --muted: #667085;
    --line: #e4e7ec;
    --accent: #3157c8;
    --accent-soft: #eef2ff;
    --tag: #f2f4f7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--text);
    background: var(--bg);
  }
  .wrap { width: min(1180px, calc(100% - 32px)); margin: 38px auto 64px; }
  h1 { margin: 0 0 6px; font-size: clamp(27px, 4vw, 40px); letter-spacing: -0.03em; }
  .subtitle { margin: 0 0 24px; color: var(--muted); font-size: 14px; }
  .filters {
    display: grid;
    grid-template-columns: minmax(160px, .8fr) minmax(200px, 1fr) minmax(260px, 2fr);
    gap: 12px;
    padding: 16px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    position: sticky;
    top: 12px;
    z-index: 10;
    box-shadow: 0 6px 24px rgba(16, 24, 40, .06);
  }
  label { display: block; margin: 0 0 6px; font-size: 12px; font-weight: 700; color: #475467; }
  select, input {
    width: 100%;
    min-height: 42px;
    border: 1px solid #d0d5dd;
    border-radius: 9px;
    padding: 9px 11px;
    background: #fff;
    color: var(--text);
    font: inherit;
    outline: none;
  }
  select:focus, input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(49, 87, 200, .12); }
  .count { margin: 16px 2px 10px; color: var(--muted); font-size: 14px; }
  .results { display: grid; gap: 11px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 17px 18px; }
  .meta { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .id { color: var(--muted); font-size: 12px; font-weight: 700; margin-right: 2px; }
  .pill { display: inline-flex; padding: 4px 8px; border-radius: 999px; background: var(--tag); font-size: 12px; color: #475467; }
  .pill.dimension { color: var(--accent); background: var(--accent-soft); }
  .guideline { font-size: 16px; line-height: 1.55; }
  details { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  summary { cursor: pointer; color: #475467; font-size: 13px; font-weight: 700; }
  .example { margin-top: 10px; padding: 11px 12px; border-left: 3px solid #c7d2fe; background: #fafbff; border-radius: 0 8px 8px 0; }
  .example-reason { white-space: pre-wrap; line-height: 1.5; font-size: 13px; }
  .example-meta { margin-top: 6px; font-size: 12px; color: var(--muted); }
  .example-meta a { color: var(--accent); text-decoration: none; }
  .empty { background: var(--panel); border: 1px dashed #cbd5e1; border-radius: 12px; padding: 32px; text-align: center; color: var(--muted); }
  mark { background: #fff1a8; padding: 0; }
  @media (max-width: 760px) {
    .wrap { width: min(100% - 20px, 1180px); margin-top: 20px; }
    .filters { grid-template-columns: 1fr; position: static; }
  }
</style>
</head>
<body>
<main class="wrap">
  <h1>Logging Guideline Catalogue</h1>
  <p class="subtitle">Local catalogue generated from <strong>5.logging_guidelines_consolidated_with_codebook.xlsx</strong>. No data leaves your computer.</p>

  <section class="filters" aria-label="Catalogue filters">
    <div>
      <label for="dimensionFilter">Dimension</label>
      <select id="dimensionFilter"><option value="">All dimensions</option></select>
    </div>
    <div>
      <label for="themeFilter">Theme</label>
      <select id="themeFilter"><option value="">All themes</option></select>
    </div>
    <div>
      <label for="searchInput">Word search</label>
      <input id="searchInput" type="search" placeholder="Search guideline text or examples…" autocomplete="off">
    </div>
  </section>

  <div class="count" id="resultCount"></div>
  <section class="results" id="results"></section>
</main>

nsion": "What to log", "theme": "Event reporting", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "```\nINFO Starting client streaming RPC\nINFO sending stock symbol=MSFT\nINFO sending stock symbol=MSFT\nINFO sending stock symbol=MSFT\nINFO upload summary message=\"Upload Complete\" count=3\n```", "repository": "samueltuoyo15/Live-Stock-Grpc", "url": "https://github.com/samueltuoyo15/Live-Stock-Grpc/blob/17a97ba1610519b3ac4ab6be5e0de0f6e5417590/README.md?plain=1", "original_guideline": "For client-streaming RPCs, log stream start, each item sent, and the final upload summary or count at INFO level."}]}, {"id": "CG-0073", "guideline": "For each audit event, log the event identifier and timestamp, actor, action, target resource, result, relevant execution context, and change details when applicable.", "dimension": "What to log", "theme": "Event reporting", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "```typescript\ninterface AuditEvent {\n  // Identity\n  eventId: string;           // Globally unique event ID (UUID v7)\n  timestamp: string;         // ISO 8601 with timezone (UTC)\n  version: string;           // Schema version (e.g., \"1.0\")\n\n  // Actor\n  actor: {\n    id: string;              // User ID, service account ID, or \"system\"\n    type: \"user\" | \"service\" | \"system\" | \"anonymous\";\n    email?: string;          // For user actors\n    ipAddress?: string;      // Source IP\n    userAgent?: string;      // Browser/client info\n    sessionId?: string;      // Session identifier\n    mfaVerified?: boolean;   // Was MFA used for this session?\n  };\n\n  // Action\n  action: {\n    type: string;            // \"create\" | \"read\" | \"update\" | \"delete\" | \"login\" | \"export\" | ...\n    category: string;        // \"authentication\" | \"data_access\" | \"admin\" | ...\n    description: string;     // Human-readable description\n  };\n\n  // Target\n  target: {\n    type: string;            // \"user\" | \"order\" | \"payment\" | \"config\" | ...\n    id: string;              // Resource identifier\n    name?: string;           // Human-readable resource name\n    attributes?: Record<string, unknown>; // Additional context\n  };\n\n  // Result\n  result: {\n    status: \"success\" | \"failure\" | \"denied\";\n    reason?: string;         // Why it failed or was denied\n    statusCode?: number;     // HTTP status code if applicable\n  };\n\n  // Context\n  context: {\n    service: string;         // Which service generated this event\n    environment: string;     // \"production\" | \"staging\"\n    requestId?: string;      // Correlation ID for distributed tracing\n    clientId?: string;       // OAuth client ID\n  };\n\n  // Change details (for modification events)\n  changes?: {\n    before?: Record<string, unknown>;\n    after?: Record<string, unknown>;\n    fields?: string[];       // Which fields changed\n  };\n}\n```", "repository": "ayush-jadaun/knowledge-vault", "url": "https://github.com/ayush-jadaun/knowledge-vault/blob/0131f844f9b77aba044bc84bb1103bd096bf8601/docs/security/compliance/audit-logging.md?plain=1", "original_guideline": "For each audit event, log the event identifier and timestamp, actor, action, target resource, result, relevant execution context, and change details when applicable."}]}, {"id": "CG-0074", "guideline": "For logging, telemetry, and observability-only contexts, a 5-field subset is recognized: `v`, `id`, `type`, `from`, `intent`.", "dimension": "What to log", "theme": "Event reporting", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0075", "guideline": "For NoSQL databases, tracking atomic interactions is useful. You can find logs for managed NoSQL databases like Amazon DynamoDB in CloudTrail.", "dimension": "What to log", "theme": "Event reporting", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0076", "guideline": "For scheduled executions, log whi sis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0294", "guideline": "Use logging levels as follows: INFO: service_started; DEBUG: request_received; ERROR: db_query_failed.", "dimension": "What to log", "theme": "Event reporting", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0295", "guideline": "Use logging levels as follows: INFO: service_started; INFO: db_connected; INFO: rabbitmq_connected; DEBUG: order_received; DEBUG: order_published; ERROR: validation_failed; ERROR: db_transaction_failed; ERROR: rabbitmq_publish_failed.", "dimension": "What to log", "theme": "Event reporting", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0296", "guideline": "Use logging levels as follows: INFO: worker_registered; DEBUG: order_processing_started; DEBUG: order_completed; DEBUG: heartbeat_sent; INFO: graceful_shutdown; ERROR: worker_registration_failed; ERROR: message_processing_failed; ERROR: db_connection_failed.", "dimension": "What to log", "theme": "Event reporting", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0297", "guideline": "Use OpenTelemetry semantic-convention attribute names for common structured fields, including HTTP, file, database, and error attributes, to keep logs interoperable and consistently queryable.", "dimension": "What to log", "theme": "Event reporting", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "### Follow OpenTelemetry Semantic Conventions\n\nUse [OTel semantic conventions](https://opentelemetry.io/docs/specs/semconv/) for common attributes if needed.\nThis enables standardization and interoperability.\n\n```rust,ignore\nevent!(\n    name: \"file.write.success\",\n    Level::INFO,\n    file.path = path.display(),         // Standard OTel name\n    file.size = bytes_written,          // Standard OTel name\n    file.directory = dir_path,          // Standard OTel name\n    file.extension = extension,         // Standard OTel name\n    file.operation = \"write\",           // Custom name\n    \"{{file.operation}} {{file.size}} bytes to {{file.path}} in {{file.directory}} extension={{file.extension}}\",\n);\n```\n\nCommon conventions:\n\n- HTTP: `http.request.method`, `http.response.status_code`, `url.scheme`, `url.path`, `server.address`\n- File: `file.path`, `file.directory`, `file.name`, `file.extension`, `file.size`\n- Database: `db.system.name`, `db.namespace`, `db.operation.name`, `db.query.text`\n- Errors: `error.type`, `error.message`, `exception.type`, `exception.stacktrace`", "repository": "dwalleck/rivets", "url": "https://github.com/dwalleck/rivets/blob/5630deebcfd3f91723389dfe0dbd2faa04e51392/all.txt", "original_guideline": "Use OpenTelemetry semantic-convention attribute names for common structured fields, including HTTP, file, database, and error attributes, to keep logs interoperable and consistently queryable."}]}, {"id": "CG-0298", "guideline": "Use Payment Event: -requestId -userId -service -instance -version", "dimension": "What to log", "theme": "Event reporting", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "```go\n// Go example\nlogger.WithFields(log.Fields{\n    \"requestId\": \"abc-123-xyz\",\n    \"userId\": user.ID,\n    \"service\": \"payment-processor\",\n    \"instance\": os.Getenv(\"HOSTNAME\"),\n    \"version\": \"v1.2.3\",\n}).Info(\"Payment processed successfully\")\n```", "repository": "Compile-N-Run/Compile-N-Run", "url": "https://github.com/Compile-N-Run/Compile-N-Run/blob/f0fe327e13fe8f6a553e835512d3a25f12a155b3/docs/observability/loki/17-best-practices/0-logging-standards.mdx", "original_guideline": "Use Payment Event: -requestId -userId -service -instance -version"}]}, {"id": "CG-0299", "guideline": "Use severity-specific logging: INFO for `message`; DEBUG for `message`; WARN for `message`; ERROR for `message`; INFO for `message`; INFO for `message`.", "dimension": "What to log", "theme": "Event reporting", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "```ruby\nlogger.info(\"message\")\nlogger.debug(\"message\")\nlogger.warn(\"message\")\nlogger.error(\"message\")\nlogger.fatal(\"message\")\nRails.logger.info(\"message\")\n@logger.info(\"message\")\n```", "repository": "rossme/diffdash", "url": "https://github.com/rossme/diffdash/blob/cdc89a3381495a786d3ac8afe0a3fb4c0bdb7beb/DOCS.md?plain=1", "original_guideline": "Use severity-specific logging: INFO for `message`; DEBUG for `message`; WARN for `message`; ERROR for `message`; INFO for `message`; INFO for `message`."}]}, {"id": "CG-0300", "guideline": "Use structured error payloads containing exception type, human-readable message, stable error code, retryability, rich contextual fields, and underlying cause type/message so failures can be diagnosed and handled consistently.", "dimension": "What to log", "theme": "Event reporting", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0301", "guideline": "Use structured logging, preferably in JSON format.", "dimension": "What to log", "theme": "Event reporting", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0302", "guideline": "Use structured logging.", "dimension": "What to log", "theme": "Event reporting", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0303", "guideline": "User Action: Provide actionable next steps.", "dimension": "What to log", "theme": "Event reporting", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0304", "guideline": "Vague Errors: Error messages like \"Something went wrong\" without technical details.", "dimension": "What to log", "theme": "Event reporting", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0305", "guideline": "Verify trace completeness in the logging and tracing pipeline.", "dimension": "What to log", "theme": "Event reporting", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0306", "guideline": "We do not keep user activity details of any kind, and maintain the minimum amount of data required to authenticate users and process payments.", "dimension": "What to log", "theme": "Event reporting", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0307", "guideline": "We never log any of the following information: User traffic DNS requests Connection statistics IP addresses.", "dimension": "What to log", "theme": "Event reporting", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0308", "guideline": "What NOT to Log: API keys or credentials Full order details with sensitive info Personal account information Raw API responses with sensitive data.", "dimension": "What to log", "theme": "Event reporting", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0309", "guideline": "What NOT to Log: Passwords or credentials Personal information (PII) Credit card numbers Session tokens or API keys.", "dimension": "What to log", "theme": "Event reporting", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0310", "guideline": "When a plugin uses a nonstandard logging approach, clearly document its logging configuration flags or variables with working examples, default log destinations, and ownership/guidance for size limits, rate limits, rotation, archiving, and deletion.", "dimension": "What to log", "theme": "Event reporting", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0311", "guideline": "You can adopt cloud-native approaches to capture this type of data using Amazon Route 53 DNS query logs and Amazon VPC Flow Logs .", "dimension": "What to log", "theme": "Event reporting", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0312", "guideline": "✔ Model Documentation — Maintain audit logs of hyperparameters, training runs, and results.", "dimension": "What to log", "theme": "Event reporting", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0313", "guideline": "🔍 Default Protected Patterns The library automatically protects these common patterns: `password`, `passwd`, `pwd` `token`, `auth`, `authorization` `secret`, `key`, `apikey` `credit`, `card`, `payment` `ssn`, `social`, `address` And more common sensitive terms.", "dimension": "What to log", "theme": "Event reporting", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0314", "guideline": "Always log: operation start/complete with duration, external API calls, authentication events, configuration changes. Never log: passwords, tokens, PII, full request/response bodies in production, high-frequency loop iterations.", "dimension": "What to log", "theme": "Execution tracing", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0315", "guideline": "Context propagation: Node.js AsyncLocalStorage | Request context (correlationId, tenantId) across async boundaries.", "dimension": "What to log", "theme": "Execution tracing", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0316", "guideline": "Emit one canonical wide event per request/operation boundary in `finally`/defer path. Build context throughout execution, emit once on completion/failure. Sub-step debug traces are optional internal diagnostics; canonical event is mandatory.", "dimension": "What to log", "theme": "Execution tracing", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0317", "guideline": "Every log entry must include: Optional context fields: `namespace`, `compute_mechanism`, `resource_id`, `provider`, `anomaly_type`, `confidence_score`: `event`: Human-readable event description; `level`: Log level (DEBUG, INFO, WARNING, ERROR, CRITICAL); `timestamp`: ISO 8601 UTC timestamp; `service`: Affected service name (if applicable); `component`: Emitting component (e.g., `anomaly_detector`, `prometheus_adapter`); `trace_id`: Distributed trace ID for correlation (if available).", "dimension": "What to log", "theme": "Execution tracing", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0318", "guideline": "Format each log entry with the severity and message followed by structured `key=value` fields.", "dimension": "What to log", "theme": "Execution tracing", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "func (l *DefaultLogger) formatMessage(level, msg string, fields []Field) string {\n\tvar parts []string\n\tparts = append(parts, fmt.Sprintf(\"[%s] %s\", level, msg))\n\n\tfor _, field := range fields {\n\t\tparts = append(parts, fmt.Sprintf(\"%s=%v\", field.Key, field.Value))\n\t}\n\n\treturn strings.Join(parts, \" \")\n}", "repository": "noelukwa/localbase", "url": "https://github.com/noelukwa/localbase/blob/566f3289289ba87abd9864d831f63bd82217814e/util.go", "original_guideline": "Format each log entry with the severity and message followed by structured `key=value` fields."}]}, {"id": "CG-0319", "guideline": "Include the correlation ID in every log entry.", "dimension": "What to log", "theme": "Execution tracing", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0320", "guideline": "Log at entry and exit points: Log at the beginning and end of important methods to track execution flow.", "dimension": "What to log", "theme": "Execution tracing", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0321", "guideline": "Log function entry when execution tracing is required.", "dimension": "What to log", "theme": "Execution tracing", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0322", "guideline": "Log Request tracing: Follow a request across its lifecycle using `requestId`.", "dimension": "What to log", "theme": "Execution tracing", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0323", "guideline": "Logging Log protocol events Track message flow Monitor performance Record errors.", "dimension": "What to log", "theme": "Execution tracing", "theme_basis": "Deductive", "original_count": "3", "examples": []}, {"id": "CG-0324", "guideline": "PII exposure — Passwords, tokens, personal data in logs Unstructured logs — String concatenation without correlation Missing trace IDs — No request correlation Blocking log I/O — Synchronous writes on critical path.", "dimension": "What to log", "theme": "Execution tracing", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0325", "guideline": "Propagate the correlation ID to downstream requests using the `X-Correlation-Id` header.", "dimension": "What to log", "theme": "Execution tracing", "theme_basis": "Deductive", "original_count": "3", "examples": [{"reason": "```python\nimport uuid\nfrom flask import Flask, request, g\n\napp = Flask(__name__)\n\n@app.before_request\ndef set_correlation_id():\n    # cloud.gov/CF sets X-Vcap-Request-Id automatically\n    g.correlation_id = request.headers.get(\n        'X-Vcap-Request-Id',\n        request.headers.get('X-Request-ID', str(uuid.uuid4()))\n    )\n\n@app.after_request\ndef add_correlation_header(response):\n    response.headers['X-Correlation-Id'] = g.correlation_id\n    return response\n```", "repository": "adhocteam/cloud-gov-instructions", "url": "https://github.com/adhocteam/cloud-gov-instructions/blob/64a6f40c7c07c5832faa4c9c9379df92b9ab311e/README.md?plain=1", "original_guideline": "Propagate the correlation ID to downstream requests using the `X-Correlation-Id` header."}, {"reason": "```javascript\napp.use((req, res, next) => {\n  // cloud.gov/CF sets x-vcap-request-id automatically\n  req.correlationId = req.headers['x-vcap-request-id']\n    || req.headers['x-request-id']\n    || uuid.v4();\n  res.setHeader('X-Correlation-Id', req.correlationId);\n  next();\n});\n```", "repository": "adhocteam/cloud-gov-instructions", "url": "https://github.com/adhocteam/cloud-gov-instructions/blob/64a6f40c7c07c5832faa4c9c9379df92b9ab311e/README.md?plain=1", "original_guideline": "Propagate the correlation ID to downstream requests using the `X-Correlation-Id` header."}, {"reason": "```python\nimport requests\n\ndef call_downstream_service(url, correlation_id):\n    return requests.get(url, headers={\n        'X-Correlation-Id': correlation_id\n    })\n```", "repository": "adhocteam/cloud-gov-instructions", "url": "https://github.com/adhocteam/cloud-gov-instructions/blob/64a6f40c7c07c5832faa4c9c9379df92b9ab311e/README.md?plain=1", "original_guideline": "Propagate the correlation ID to downstream requests using the `X-Correlation-Id` header."}]}, {"id": "CG-0326", "guideline": "Request ID generated at command boundary if absent. Accept upstream `x-request-id` when present and valid; otherwise generate. Propagate request ID through provider calls and all emitted events/logs.", "dimension": "What to log", "theme": "Execution tracing", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0327", "guideline": "Service/Manager Methods (Public): Log entry with parameters Log exit with result Log errors with full context.", "dimension": "What to log", "theme": "Execution tracing", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0328", "guideline": "The app automatically includes trace IDs in all logs and API responses. See docs/tracing.md for architecture details.", "dimension": "What to log", "theme": "Execution tracing", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0329", "guideline": "The Lambda implements comprehensive error handling and structured JSON logging with correlation IDs for traceability across the pipeline.", "dimension": "What to log", "theme": "Execution tracing", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0330", "guideline": "Use the `trace_id` to reconstruct an operation across agent runs, agent logs, and vector-memory records.", "dimension": "What to log", "theme": "Execution tracing", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "```python\n# Reconstruct full operation from trace_id\nasync def get_operation_trace(trace_id: str) -> dict:\n    async with get_async_session() as session:\n        # Get agent runs\n        agent_runs = await session.execute(\n            select(AgentRun).where(AgentRun.trace_id == trace_id)\n        )\n        \n        # Get agent logs\n        agent_logs = await session.execute(\n            select(AgentLog).where(AgentLog.trace_id == trace_id)\n        )\n        \n        # Get vector memory entries\n        vector_entries = await session.execute(\n            select(VectorMemory).where(VectorMemory.metadata_[\"trace_id\"].as_string() == trace_id)\n        )\n        \n        return {\n            \"agent_runs\": [run.__dict__ for run in agent_runs.scalars().all()],\n            \"agent_logs\": [log.__dict__ for log in agent_logs.scalars().all()],\n            \"vector_memory\": [vec.__dict__ for vec in vector_entries.scalars().all()]\n        }\n```", "repository": "SamuelMatthew95/trading-control", "url": "https://github.com/SamuelMatthew95/trading-control/blob/23f31d9205555629194fde09c11c7c87e34dcd6e/.claude/rules/memory-logging.md?plain=1", "original_guideline": "Use the `trace_id` to reconstruct an operation across agent runs, agent logs, and vector-memory records."}]}, {"id": "CG-0331", "guideline": "Use the following logging configuration: Log: Understanding individual events, debugging specific requests, logging / structlog, \"User X uploaded file Y, took 3.2s\"; Metric: Tracking aggregates over time, alerting on thresholds, prometheus, statsd, \"Upload count: 1,423/hour, p99 latency: 2.1s\"; Trace: Following a request across multiple services, opentelemetry, \"Request AB ctive", "original_count": "5", "examples": []}, {"id": "CG-0340", "guideline": "Do not log sensitive data.", "dimension": "What to log", "theme": "Sensitive-data exclusion", "theme_basis": "Inductive", "original_count": "2", "examples": []}, {"id": "CG-0341", "guideline": "Don't log sensitive data.", "dimension": "What to log", "theme": "Sensitive-data exclusion", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0342", "guideline": "DON'T: Log Sensitive Information.", "dimension": "What to log", "theme": "Sensitive-data exclusion", "theme_basis": "Inductive", "original_count": "1", "examples": [{"reason": "#### ❌ **DON'T: Log Sensitive Information**\n\n```typescript\n// Bad - logging sensitive data\nthis.logger.info({\n  message: 'User login',\n  email: userData.email,\n  password: userData.password, // Never log passwords\n  creditCard: userData.creditCard, // Never log credit cards\n  ssn: userData.ssn, // Never log SSNs\n  apiKey: userData.apiKey, // Never log API keys\n});\n\n// Bad - tracing sensitive data\naddSpanAttributes({\n  'user.password': userData.password,\n  'payment.credit_card': paymentData.creditCard,\n  'auth.token': authToken,\n});\n```", "repository": "Paystack-MFB/nestjs-observability", "url": "https://github.com/Paystack-MFB/nestjs-observability/blob/87b280d79048785cb4cbf35ea3cb87b91d1b2f81/docs/best-practices.md?plain=1", "original_guideline": "DON'T: Log Sensitive Information."}]}, {"id": "CG-0343", "guideline": "Log No sensitive data is.", "dimension": "What to log", "theme": "Sensitive-data exclusion", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0344", "guideline": "Never expose sensitive data in logs.", "dimension": "What to log", "theme": "Sensitive-data exclusion", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0345", "guideline": "Never log secrets. Passwords, tokens, and PII must be scrubbed before they reach any log handler.", "dimension": "What to log", "theme": "Sensitive-data exclusion", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0346", "guideline": "Never log sensitive data (PII, credentials, tokens).", "dimension": "What to log", "theme": "Sensitive-data exclusion", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0347", "guideline": "Never log sensitive data - Mask PII, credentials, tokens.", "dimension": "What to log", "theme": "Sensitive-data exclusion", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0348", "guideline": "Never log sensitive data like card numbers, CVV, etc.", "dimension": "What to log", "theme": "Sensitive-data exclusion", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0349", "guideline": "Never log sensitive data, like user credentials.", "dimension": "What to log", "theme": "Sensitive-data exclusion", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0350", "guideline": "NEVER log sensitive information (passwords, tokens, PII, financial data).", "dimension": "What to log", "theme": "Sensitive-data exclusion", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0351", "guideline": "Never log sensitive information.", "dimension": "What to log", "theme": "Sensitive-data exclusion", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0352", "guideline": "No token logging in debug output.", "dimension": "What to log", "theme": "Sensitive-data exclusion", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0353", "guideline": "Plugins SHOULD NOT write potentially sensitive data to logs (e.g. secrets).", "dimension": "What to log", "theme": "Sensitive-data exclusion", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0354", "guideline": "Redact Sensitive Data Do not log plain sensitive data as this might lead to privacy and security incidents. Sensitive data includes email addresses, file paths revealing user identity, filenames containing secrets or tokens, file contents with PII, temporary file paths with session IDs and more. Consider using the `data_privacy` crate for consistent redaction.", "dimension": "What to log", "theme": "Sensitive-data exclusion", "theme_basis": "Inductive", "original_count": "1", "examples": [{"reason": "### Redact Sensitive Data\n\nDo not log plain sensitive data as this might lead to privacy and security incidents.\n\n```rust,ignore\n// Bad: Logs potentially sensitive data\nevent!(\n    name: \"file.operation.started\",\n    Level::INFO,\n    user.email = user.email,  // Sensitive data\n    file.name = \"license.txt\",\n    \"reading file {{file.name}} for user {{user.email}}\",\n);\n\n// Good: Redact sensitive parts\nevent!(\n    name: \"file.operation.started\",\n    Level::INFO,\n    user.email.redacted = redact_email(user.email),\n    file.name = \"license.txt\",\n    \"reading file {{file.name}} for user {{user.email.redacted}}\",\n);\n```\n\nSensitive data includes email addresses, file paths revealing user identity, filenames containing secrets or tokens,\nfile contents with PII, temporary file paths with session IDs and more. Consider using the [`data_privacy`](https://crates.io/crates/data_privacy) crate for consistent redaction.", "repository": "dwalleck/rivets", "url": "https://github.com/dwalleck/rivets/blob/5630deebcfd3f91723389dfe0dbd2faa04e51392/all.txt", "original_guideline": "Redact Sensitive Data Do not log plain sensitive data as this might lead to privacy and security incidents. Sensitive data includes email addresses, file paths revealing user identity, filenames containing secrets or tokens, file contents with PII, temporary file paths with session IDs and more. Consider using the `data_privacy` crate for consistent redaction."}]}, {"id": "CG-0355", "guideline": "Security in Logging: Never log sensitive information, mask/redact sensitive fields.", "dimension": "What to log", "theme": "Sensitive-data exclusion", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0356", "guideline": "Use environment variables for sensitive configuration Don't expose internal service names in metrics Never log the configuration that contains secrets.", "dimension": "What to log", "theme": "Sensitive-data exclusion", "theme_basis": "Inductive", "original_count": "1", "examples": [{"reason": "#### ✅ **DO: Secure Configuration**\n\n```typescript\n// Use environment variables for sensitive configuration\nconst observabilityConfig = {\n  tracing: {\n    enabled: process.env.TRACING_ENABLED === 'true',\n    exporter: {\n      type: 'otlp',\n      endpoint: process.env.OTLP_TRACES_ENDPOINT,\n      headers: {\n        Authorization: `Bearer ${process.env.OTLP_API_TOKEN}`,\n      },\n    },\n  },\n  metrics: {\n    enabled: process.env.METRICS_ENABLED === 'true',\n    // Don't expose internal service names in metrics\n    defaultLabels: {\n      service: process.env.SERVICE_NAME,\n      version: process.env.SERVICE_VERSION,\n      environment: process.env.OTEL_SERVICE_ENV,\n    },\n  },\n};\n\n// Never log the configuration that contains secrets\nconsole.log('Observability initialized'); // Don't log config details\n```", "repository": "Paystack-MFB/nestjs-observability", "url": "https://github.com/Paystack-MFB/nestjs-observability/blob/87b280d79048785cb4cbf35ea3cb87b91d1b2f81/docs/best-practices.md?plain=1", "original_guideline": "Use environment variables for sensitive configuration Don't expose internal service names in metrics Never log the configuration that contains secrets."}]}, {"id": "CG-0357", "guideline": "Validate presence of secrets without printing them.", "dimension": "What to log", "theme": "Sensitive-data exclusion", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0358", "guideline": "\"Add correlation ID middleware and include in all log "1", "examples": []}, {"id": "CG-0373", "guideline": "Added the argument `execution.context.msg` to the `tryCatchLog` and `try` functions to support an text identifier (eg. the PID or a variable value) that will be added to msg.text for catched conditions. This makes it easier to identify the runtime state that caused a condition esp. in parallel execution scenarios.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0374", "guideline": "Adding \"Breadcrumbs\" to critical user flows.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0375", "guideline": "Affected configuration/files.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0376", "guideline": "All authentication events Authorization decisions Input validation failures Privilege changes Configuration modifications Data access patterns Error conditions Performance anomalies.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0377", "guideline": "All event logging, error reporting, and diagnostic output for battery analytics must conform to the standards in this document.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0378", "guideline": "Always include relevant context in your logs to make them actionable.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0379", "guideline": "An array holding secrets/sensitive-information to be removed from the body and metadata of to-be-logged messages and replaced with the default `'[secure]'` string.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0380", "guideline": "Any code in the core can call C<$self->log()> and those log lines will be dispatched to each of the registered logging plugins. When C<log()> is called from a plugin, the plugin and hook names are automatically included in the parameters passed the logging hooks. All plugins which register for the logging hook should expect the following parameters to be passed.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0381", "guideline": "API breaking change: `tryLog` has a changed API due to the newly inserted parameter `write.error.dump.folder` at position 3. Adjust your source code if you call `tryLog` and pass arguments by position using more than 2 arguments).", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0382", "guideline": "API breaking change: The function `build.log.output` has a new argument `include.compact.call.stack` at the 3rd position which breaks the old interface (only if the caller has passed subsequent arguments by position instead of using using the names).", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0383", "guideline": "Assign a trace ID for traceable operations.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0384", "guideline": "Audit authentication, authorization, sensitive-data access, data modification, administrative, and system events, including login/MFA/password/session events, permission and role changes, exports, CRUD/bulk/schema changes, provisioning/configuration/policy/key changes, service lifecycle, audit-log access, and backups.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0385", "guideline": "Authentication Events: Login success/failure Logout events Account lockouts Password changes Authorization Events: Access granted/denied Privilege escalations Permission changes Administrative actions System Events: Configuration changes Service starts/stops System errors Performance issues.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0386", "guideline": "Automatically audit requests to sensitive API endpoints, recording actor identity/type/IP, request method and category, target type/ID, success or failure status, request ID, and session ID.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "```python\n# FastAPI middleware for automatic audit logging\nfrom fastapi import Request, Response\nfrom starlette.middleware.base import BaseHTTPMiddleware\n\nclass AuditMiddleware(BaseHTTPMiddleware):\n    \"\"\"Automatically log all API requests to the audit trail.\"\"\"\n\n    # Endpoints that access sensitive data\n    SENSITIVE_ENDPOINTS = {\n        \"/api/users\": \"user_data\",\n        \"/api/payments\": \"payment_data\",\n        \"/api/admin\": \"admin_action\",\n    }\n\n    async def dispatch(self, request: Request, call_next):\n        # Capture request details\n        actor = get_current_user(request)\n        request_id = request.headers.get(\"x-request-id\", str(uuid.uuid4()))\n\n        # Process the request\n        response = await call_next(request)\n\n        # Determine if this endpoint requires audit logging\n        endpoint_category = self._match_sensitive_endpoint(request.url.path)\n        if endpoint_category:\n            audit.log(\n                actor_id=actor.id if actor else \"anonymous\",\n                actor_type=\"user\" if actor else \"anonymous\",\n                actor_ip=request.client.host,\n                action_type=request.method.lower(),\n                action_category=endpoint_category,\n                description=f\"{request.method} {request.url.path}\",\n                target_type=endpoint_category,\n                target_id=self._extract_resource_id(request.url.path),\n                result_status=\"success\" if response.status_code < 400 else \"failure\",\n                request_id=request_id,\n                session_id=actor.session_id if actor else None,\n            )\n\n        return response\n\n    def _match_sensitive_endpoint(self, path: str) -> str | None:\n        for prefix, category in self.SENSITIVE_ENDPOINTS.items():\n            if path.startswith(prefix):\n                return category\n        return None\n\n    def _extract_resource_id(self, path: str) -> str:\n        parts = path.strip(\"/\").split(\"/\")\n        return parts[-1] if len(parts) > 2 else \"collection\"\n```", "repository": "ayush-jadaun/knowledge-vault", "url": "https://github.com/ayush-jadaun/knowledge-vault/blob/0131f844f9b77aba044bc84bb1103bd096bf8601/docs/security/compliance/audit-logging.md?plain=1", "original_guideline": "Automatically audit requests to sensitive API endpoints, recording actor identity/type/IP, request method and category, target type/ID, success or failure status, request ID, and session ID."}]}, {"id": "CG-0387", "guideline": "Avoid legacy logging calls, stringified exceptions, and print statements; use the project’s structured logging mechanism instead.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "```python\n# ❌ WRONG - Old logging\nlogger.info(\"message\")\nlogger.error(\"error\", exc_info=exc)\n\n# ❌ WRONG - Stringified exceptions (CI/CD failure)\nlog_structured(\"error\", \"failed\", error=str(exc))\n\n# ❌ WRONG - Print statements\nprint(\"debug info\")\n```", "repository": "SamuelMatthew95/trading-control", "url": "https://github.com/SamuelMatthew95/trading-control/blob/23f31d9205555629194fde09c11c7c87e34dcd6e/.claude/rules/memory-logging.md?plain=1", "original_guideline": "Avoid legacy logging calls, stringified exceptions, and print statements; use the project’s structured logging mechanism instead."}]}, {"id": "CG-0388", "guideline": "Bind request and workflow context before logging, including request ID, correlation ID, workflow ID, workflow name, workflow version, and node position, so INFO messages inherit that context.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "```kotlin\n// General context\nwithLoggingContext(\n    LogContext.REQUEST_ID to requestId,\n    LogContext.CORRELATION_ID to correlationId\n) {\n    // Your code here\n    logger.info { \"Processing request\" }\n}\n\n// Workflow-specific context\nwithWorkflowContext(\n    workflowId = id,\n    workflowName = name,\n    workflowVersion = version,\n    nodePosition = position.toString()\n) {\n    // Your code here\n    logger.info { \"Processing workflow\" }\n}\n```", "repository": "lemline/lemline", "url": "https://github.com/lemline/lemline/blob/434a695bd360025410cb452cc4c5b47d90aacfa2/docs/AGENTS.md?plain=1", "original_guideline": "Bind request and workflow context before logging, including request ID, correlation ID, workflow ID, workflow name, workflow version, and node position, so INFO messages inherit that context."}]}, {"id": "CG-0389", "guideline": "Build the message to be sent to the syslog, combining text with variables to capture the information you want.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0390", "guideline": "Business operations with the context.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0391", "guideline": "Capture both internal system events and externally relevant user-facing changes, including new APIs, memory behaviors, or federated activity.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0392", "guideline": "Common fields include: `LogFieldMachine`, `LogFieldMetal3Machine`, `LogFieldCluster`, `LogFieldBMH`, `LogFieldError`, `LogFieldPhase`, etc.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0393", "guideline": "Configure Signale's `secrets` list to case-sensitively replace matching sensitive values in log bodies and metadata with `[secure]`; scoped loggers inherit secrets, and secrets may be added or cleared through the API.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0394", "guideline": "Confirm that debug messages are informative and context-rich.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0395", "guideline": "Context is King: \"An error occurred\" is useless; \"User X failed to pay Y due to Z\" is gold.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0396", "guideline": "Context: Include relevant context in error messages.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0397", "guideline": "Contextual Information: Include request IDs, user/entity IDs, and relevant metadata in logs.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0398", "guideline": "Core Fields (Mandatory): `timestamp`, `level`, `service`, `action`, `message`, `hostname`, `request_id`.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0399", "guideline": "Correlation: By capturing the `tool_name` inside the `context` dictionary, you can instantly run a query to see that 95% of your agent failures are originating from one specific, flaky Python tool function.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0400", "guideline": "Create an `http_request` span containing the request ID, HTTP method, request path, and remote-address context.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "Create a span for this request\n        let span = tracing::info_span!(\n            \"http_request\",\n            request_id = %request_id,\n            method = %req.method(),\n            path = %req.uri().path(),\n            remote_addr = ?req.headers().get(\"x-forwarded-for\").or_else(|| req.headers().get(\"x-real-ip\"))\n        );\n        //", "repository": "MikeTeddyOmondi/locci-lb", "url": "https://github.com/MikeTeddyOmondi/locci-lb/blob/1bbf86109c57813825a5498b70ab98d40365adf0/DOCS.md?plain=1", "original_guideline": "Create an `http_request` span containing the request ID, HTTP method, request path, and remote-address context."}]}, {"id": "CG-0401", "guideline": "Create an error report when a log record contains the configured error key, populate the message with the error details required by GCP Error Reporting, and ignore the separately passed log message.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0402", "guideline": "CSV and index read failures return `400` for missing files or `500` for parsing problems, with logs tagged by path.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0403", "guideline": "Dashboard Metrics Agent performance comparison Cost analysis per conversation Error rate tracking User satisfaction correlation.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0404", "guideline": "Define a structured logger interface that accepts key-value fields and supports DEBUG, INFO, ERROR, FATAL severity levels.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "// Logger interface for structured logging\ntype Logger interface {\n\tDebug(msg string, fields ...Field)\n\tInfo(msg string, fields ...Field)\n\tError(msg string, fields ...Field)\n\tFatal(msg string, fields ...Field)\n}\n\n// Field represents a key-value pair for structured logging\ntype Field struct {\n\tKey   string\n\tValue any\n}", "repository": "noelukwa/localbase", "url": "https://github.com/noelukwa/localbase/blob/566f3289289ba87abd9864d831f63bd82217814e/util.go", "original_guideline": "Define a structured logger interface that accepts key-value fields and supports DEBUG, INFO, ERROR, FATAL severity levels."}]}, {"id": "CG-0405", "guideline": "Define a structured logger interface that accepts key-value fields and supports DEBUG, INFO, WARN, ERROR severity levels.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "// Logger represents any structured logger.\ntype Logger interface {\n\tError(msg string, fields ...Field)\n\tWarn(msg string, fields ...Field)\n\tInfo(msg string, fields ...Field)\n\tDebug(msg string, fields ...Field)\n\tWith(fields ...Field) Logger\n\tNamed(name string) Logger\n}", "repository": "gordonmleigh/byolog", "url": "https://github.com/gordonmleigh/byolog/blob/bdfbc4ac09769db2056de502dd891a0b2f5fa743/byolog.go", "original_guideline": "Define a structured logger interface that accepts key-value fields and supports DEBUG, INFO, WARN, ERROR severity levels."}]}, {"id": "CG-0406", "guideline": "Design the correlation ID / distributed tracing strategy (API → Worker → DB).", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0407", "guideline": "Do not log API tokens or secret env values.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0408", "guideline": "Do not put secrets, raw passwords, tokens, full webhook payloads, or sensitive PII in `metadata`.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0409", "guideline": "Do not use `log::debug!` directly for category-specific output.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "Do not use `log::debug!` directly for category-specific output.", "repository": "Jay1/RustPods", "url": "https://github.com/Jay1/RustPods/blob/9bd9c17976b2409b4624bf1b958d3cc113223948/docs/index.md?plain=1", "original_guideline": "Do not use `log::debug!` directly for category-specific output."}]}, {"id": "CG-0410", "guideline": "DON'T Log: - Log sensitive data (passwords, tokens, PII) - Log entire file contents (use summaries) - Skip logging errors - Use inconsistent formats - Forget timestamps - Log at wrong level (DEBUG spam or missing INFO) Log DO: - Sanitize sensitive data before logging - Log operation summaries - Always log errors with context - Use consistent structure - Always include timestamp - Choose appropriate level", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0411", "guideline": "Emit structured app-server events with an event name and UTC timestamp, include the app-server PID and token-usage map when available, and attach event-specific payload fields for session, turn, approval, notification, malformed-message, and failure events.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0412", "guideline": "Error Handling Log stack traces Include error context Track error patterns Monitor recovery.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0413", "guideline": "Error Object: For `ERROR` level logs, an `error` object with `msg`, and `stack` must be included.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0414", "guideline": "Every agent call is logged with: Agent name Model used (primary vs fallback) Input token count Output token count Latency in milliseconds Success/failure status Retry attempts.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0415", "guideline": "Exported function `build.log.output` to create a single string suited as logging output from `last.tryCatchLog.result`.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0416", "guideline": "Extract remote trace context from HTTP headers, set it as the span parent, and record the trace ID for logging.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "```rust\npub fn set_otel_parent(headers: &http::HeaderMap, span: &tracing::Span) {\n    let remote_context = extract_context_from_headers(headers);\n    span.set_parent(remote_context);\n    // Record trace_id for logging\n}\n```", "repository": "nivek-ph/tracing-otel-extra", "url": "https://github.com/nivek-ph/tracing-otel-extra/blob/b9a926d44cb056a4f70658e0553638018d69cdb7/AGENTS.md?plain=1", "original_guideline": "Extract remote trace context from HTTP headers, set it as the span parent, and record the trace ID for logging."}]}, {"id": "CG-0417", "guideline": "For most Python projects, start with logging. Add metrics when you need dashboards and alerts. Add traces when you have multiple services that talk to each other.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0418", "guideline": "For security investigations, CloudTrail provides context on the creation, modification, and deletion of AWS resources. Therefore, CloudTrail is one of your most important log sources for security incident response in an AWS environment.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0419", "guideline": "For token-usage telemetry, prefer absolute thread totals, extract common input/output/total token fields leniently, ignore delta-style payloads for totals, compute deltas from the last absolute value to prevent double counting, and accumulate totals in orchestrator state.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0420", "guideline": "Gemini calls log contextual metadata (book title, query) but not raw prompts; redact secrets before filing issues.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0421", "guideline": "Generate a unique request ID for request tracing.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "Generate request ID for tracing\n        let request_id = Uuid::new_v4().to_string();\n        //", "repository": "MikeTeddyOmondi/locci-lb", "url": "https://github.com/MikeTeddyOmondi/locci-lb/blob/1bbf86109c57813825a5498b70ab98d40365adf0/DOCS.md?plain=1", "original_guideline": "Generate a unique request ID for request tracing."}]}, {"id": "CG-0422", "guideline": "If a data does not contain `msg` field, msg is set `default_message` attribute value of a Logger. its default is 'No message'.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "If a data does not contain `msg` field, msg is set `default_message` attribute value of a Logger. its default is 'No message'.\n\n```ruby\nlogger.default_message = 'User dump'\nlogger.debug(user: { name: 'Taro', age: 19 })\n```\n\n```json\n{\"name\":\"main\",\"hostname\":\"mint\",\"pid\":9303,\"level\":20,\"time\":\"2016-10-28T18:03:50.118+09:00\",\"v\":0,\"msg\":\"User dump\",\"user\":{\"name\":\"Taro\",\"age\":19}}\n```", "repository": "tilfin/ougai", "url": "https://github.com/tilfin/ougai/blob/397d07713c93f92a125c7ef6915f23c07df7db63/README.md?plain=1", "original_guideline": "If a data does not contain `msg` field, msg is set `default_message` attribute value of a Logger. its default is 'No message'."}]}, {"id": "CG-0423", "guideline": "If you call the log method on the connection object, you can forego the connection as argument: connection.logdebug(\"turtles all the way down\", plugin); and similarly for the log methods on the plugin object: plugin.logdebug(\"he just really likes turtles\", connection);.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0424", "guideline": "Implemented feature request #52: Add runtime context information to conditions (https://github.com/aryoda/tryCatchLog/issues/52).", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0425", "guideline": "Include `correlationId` in the log record to capture A correlation ID for tracing requests across services.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": ructured context fields for tenant, site, device, device type, correlation ID, causation ID, unique event ID, and event type when those identifiers apply to the event.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0440", "guideline": "Include user context in logs.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0441", "guideline": "Info!(\"Creating default configuration\");.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "info!(\"Creating default configuration\");", "repository": "MikeTeddyOmondi/locci-lb", "url": "https://github.com/MikeTeddyOmondi/locci-lb/blob/1bbf86109c57813825a5498b70ab98d40365adf0/DOCS.md?plain=1", "original_guideline": "Info!(\"Creating default configuration\");."}]}, {"id": "CG-0442", "guideline": "Info!(\"Default configuration written to {}\", path);.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "info!(\"Default configuration written to {}\", path);", "repository": "MikeTeddyOmondi/locci-lb", "url": "https://github.com/MikeTeddyOmondi/locci-lb/blob/1bbf86109c57813825a5498b70ab98d40365adf0/DOCS.md?plain=1", "original_guideline": "Info!(\"Default configuration written to {}\", path);."}]}, {"id": "CG-0443", "guideline": "Info!(\"Loaded configuration with {} routes\", config.routes.len());.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "info!(\"Loaded configuration with {} routes\", config.routes.len());", "repository": "MikeTeddyOmondi/locci-lb", "url": "https://github.com/MikeTeddyOmondi/locci-lb/blob/1bbf86109c57813825a5498b70ab98d40365adf0/DOCS.md?plain=1", "original_guideline": "Info!(\"Loaded configuration with {} routes\", config.routes.len());."}]}, {"id": "CG-0444", "guideline": "Info!(\"Successfully loaded configuration from {}\", path);.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "info!(\"Successfully loaded configuration from {}\", path);", "repository": "MikeTeddyOmondi/locci-lb", "url": "https://github.com/MikeTeddyOmondi/locci-lb/blob/1bbf86109c57813825a5498b70ab98d40365adf0/DOCS.md?plain=1", "original_guideline": "Info!(\"Successfully loaded configuration from {}\", path);."}]}, {"id": "CG-0445", "guideline": "Information about config (listening on X, watching Y).", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "2", "examples": []}, {"id": "CG-0446", "guideline": "Keeping track of the date and the time of each log is important. Every log message should display the date and time to the millisecond (or better if possible) along with the time zone. Not including the time zone is a common mistake, unfortunately, and reduces the value of the information.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0447", "guideline": "Key Events to Log: Authentication (success/failure) Authorization decisions Administrative actions System configuration changes Input validation failures.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0448", "guideline": "Kwargs in application-level log calls are an anti-pattern.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0449", "guideline": "Log `agent processing completed` at INFO level with structured fields `agent`, `processing_time_ms`, `trace_id`.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": " r `user_action` with `action`, `user_id`, `ip_address`.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "```python\nimport structlog\nimport sys\n\nstructlog.configure(\n    processors=[\n        structlog.stdlib.filter_by_level,\n        structlog.stdlib.add_logger_name,\n        structlog.stdlib.add_log_level,\n        structlog.processors.TimeStamper(fmt=\"iso\"),\n        structlog.processors.JSONRenderer()\n    ],\n    wrapper_class=structlog.stdlib.BoundLogger,\n    context_class=dict,\n    logger_factory=structlog.PrintLoggerFactory(),\n)\n\nlogger = structlog.get_logger()\n\n# Structured logging with context\nlogger.info(\"user_action\", \n    action=\"login\",\n    user_id=12345,\n    ip_address=\"192.168.1.1\"\n)\n```", "repository": "adhocteam/cloud-gov-instructions", "url": "https://github.com/adhocteam/cloud-gov-instructions/blob/64a6f40c7c07c5832faa4c9c9379df92b9ab311e/README.md?plain=1", "original_guideline": "Log INFO for `user_action` with `action`, `user_id`, `ip_address`."}]}, {"id": "CG-0482", "guideline": "Log Info!( error = %e, duration_ms = %duration.as_millis(), \"Request failed\" );.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "info!(\n                        error = %e,\n                        duration_ms = %duration.as_millis(),\n                        \"Request failed\"\n                    );", "repository": "MikeTeddyOmondi/locci-lb", "url": "https://github.com/MikeTeddyOmondi/locci-lb/blob/1bbf86109c57813825a5498b70ab98d40365adf0/DOCS.md?plain=1", "original_guideline": "Log Info!( error = %e, duration_ms = %duration.as_millis(), \"Request failed\" );."}]}, {"id": "CG-0483", "guideline": "Log Info!( status = %res.status(), duration_ms = %duration.as_millis(), \"Request completed\" );.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original
