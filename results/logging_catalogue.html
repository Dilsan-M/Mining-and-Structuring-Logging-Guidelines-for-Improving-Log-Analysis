"original_count": "1", "examples": []}, {"id": "CG-1679", "guideline": "Name Your Events Use hierarchical dot-notation: `<component>.<operation>.<state>` Named events enable grouping and filtering across log entries.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "### Name Your Events\n\nUse hierarchical dot-notation: `<component>.<operation>.<state>`\n\n```rust,ignore\n// Bad: Unnamed events\nevent!(\n    Level::INFO,\n    file.path = file_path,\n    \"file {{file.path}} processed succesfully\",\n);\n\n// Good: Named events\nevent!(\n    name: \"file.processing.success\", // event identifier\n    Level::INFO,\n    file.path = file_path,\n    \"file {{file.path}} processed succesfully\",\n);\n```\n\nNamed events enable grouping and filtering across log entries.", "repository": "dwalleck/rivets", "url": "https://github.com/dwalleck/rivets/blob/5630deebcfd3f91723389dfe0dbd2faa04e51392/all.txt", "original_guideline": "Name Your Events Use hierarchical dot-notation: `<component>.<operation>.<state>` Named events enable grouping and filtering across log entries."}]}, {"id": "CG-1680", "guideline": "Never swallow exceptions silently. Every `except` block must log the error with full context via `structlog`.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1681", "guideline": "No direct Logback imports.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1682", "guideline": "Observability: Prometheus, OpenTelemetry, structured JSON logging.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1683", "guideline": "OpenKilda code is expected to use SLF4J as API facade for logging.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1684", "guideline": "Ougai::Logger is a sub-class of the standard Logger in Ruby. All arguments of the `initialize` pass through to ::Logger.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "**Ougai::Logger** is a sub-class of the standard [Logger](https://ruby-doc.org/stdlib-2.4.1/libdoc/logger/rdoc/Logger.html) in Ruby.\nAll arguments of the `initialize` pass through to **::Logger**.\n\n```ruby\nrequire 'ougai'\n\nlogger = Ougai::Logger.new($stdout)\n```", "repository": "tilfin/ougai", "url": "https://github.com/tilfin/ougai/blob/397d07713c93f92a125c7ef6915f23c07df7db63/README.md?plain=1", "original_guideline": "Ougai::Logger is a sub-class of the standard Logger in Ruby. All arguments of the `initialize` pass through to ::Logger."}]}, {"id": "CG-1685", "guideline": "OwaspHeaders.Core includes comprehensive logging functionality via `ILogger<SecureHeadersMiddleware>`, following Andrew Lock's high-performance logging best practices.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1686", "guideline": "Prefer removing specific sink IDs or add replacements before removing default sinks in loguru.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1687", "guideline": "Public Logger getLogger() { return logger; }.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "public Logger getLogger() {\n        return logger;\n    }", "repository": "whimxiqal/SpongeDocs", "url": "https://github.com/whimxiqal/SpongeDocs/blob/92fcc2e69f3f7df99741256120c1f1772b01b5aa/source/plugin/logging.rst", "original_guideline": "Public Logger getLogger() { return logger; }."}]}, {"id": "CG-1688", "guideline": "Public static final Logger LOGGER = LoggerFactory.getLogger(MOD_ID);.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1689", "guideline": "Python packages like mcap-protobuf-support and foxglove-schemas-protobuf are nice implementations to achieve this.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1690", "guideline": "Python’s `logging` module has a global registry of loggers (`logging.Logger.manager.loggerDict`). When you call `logging.getLogger(name)`: If `name` is `None` or empty → returns the root logger. If `name` is given: Look up `loggerDict[name]`. If not found → create a new `Logger(name)` object, add it to `loggerDict`. Return the logger object. So you can think of it as a singleton factory per name.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1691", "guideline": "Replace `java.util.logging` / Logback imports with SLF4J: `import org.slf4j.Logger; import org.slf4j.LoggerFactory;`.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1692", "guideline": "Replace print() with structured logger.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1693", "guideline": "Resolve the value associated with the error key by using `slog.LogValuer.LogValue()` first; otherwise use the string or error text.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1694", "guideline": "Rotate and Archive Logs: Prevent logs from consuming excessive storage. Use rolling policies in `logback.xml`.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1695", "guideline": "RotatingFileHandler = prevents huge log files by rotating them `\"my_app\"` = application-level logger name (you can name it anything) At module level → always use `logger = logging.getLogger(name)` If you want per-file logs → attach a file handler only in that file’s logger.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1696", "guideline": "Set `\"disable_existing_loggers\": False` in `dictConfig` to preserve pre-existing loggers.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "2", "examples": []}, {"id": "CG-1697", "guideline": "Setup: `const logger = pino({ level: 'info', base: { service: 'api', version: '1.0' } })`.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1698", "guideline": "Skip logging if no handler is set or error is nil.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1699", "guideline": "Sponge uses ``org.slf4j.Logger``, not ``java.util.logging.Logger``.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1700", "guideline": "Store the logging backend atomically when it may be accessed across goroutines.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1701", "guideline": "Structured Logging: Employs `slog` (Go's standard structured logging package) for clear, configurable, and machine-parsable logs.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1702", "guideline": "Structured logging: JSON lines to `~/.minutes/logs/minutes.log`, daily rotation (7 days). Every pipeline step logs file, step, duration, outcome. `minutes logs` command to tail. `minutes logs --errors` to filter. `--verbose` CLI flag for stderr debug output.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1703", "guideline": "Sysmon is installed and configured using Olaf Hartong's open-sourced Sysmon configuration.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1704", "guideline": "Telemetry & Tracing — Use OpenTelemetry to track model behavior across services.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1705", "guideline": "The logging utility provides context-aware logging through MDC (Mapped Diagnostic Context). This allows including contextual information in all log messages without explicitly adding it to each log statement.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1706", "guideline": "The pipeline implements structured JSON logging across all Lambda functions to enable efficient log analysis and debugging in CloudWatch.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1707", "guideline": "The provider supports Terraform's native logging system (tflog) for improved debugging and troubleshooting. This provides structured logging with better integration into Terraform's logging infrastructure.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1708", "guideline": "The secondary effects to the system such as logs written by SLF4J are allowed.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1709", "guideline": "This project leverages Log4j2 as a logging framework.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1710", "guideline": "This solution assumes that log4j2 is used as logging framework by the server, however that might not be the case for all/future implementations of the SpongeAPI.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1711", "guideline": "To configure logging verbosity, specify the `v` flag such as `--v=2`.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1712", "guideline": "To create a logger handler that leverages the existing MCAP and Foxglove packages.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1713", "guideline": "To create a scoped logger based on an already existing one, use the `scope()` function, which will return a new signale instance, inheriting all custom loggers, timers, secrets, streams, configuration, log level, interactive mode & disabled statuses from the initial one.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1714", "guideline": "To enable global configuration define the options under the `signale` namespace in your `package.json`.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1715", "guideline": "To enable local configuration call the `config()` function on your signale instance. Local configurations will always override any pre-existing configuration inherited from `package.json`.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1716", "guideline": "To enable logging plugins, edit the file I<config/logging> and uncomment the entries for the plugins you wish to use.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1717", "guideline": "To initialize an interactive logger, create a new signale instance with the `interactive` attribute set to `true`. While into the interactive mode, previously logged messages originating from an interactive logger, will be overridden only by new ones originating from the same or a different interactive logger. Note that regular messages originating from regular loggers are not overridden by the interactive ones.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1718", "guideline": "To provide a plugin for standard Python loging.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1719", "guideline": "To take full advantage of this, ensure your top-level application framework (like a FastAPI route handler) captures these exceptions and injects its own trace IDs before logging them.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1720", "guideline": "Treated as event streams — `structlog` outputs JSON to stdout; collected by Loki.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1721", "guideline": "Use `flyctl logs` to view recent logs; use `flyctl logs -f` to follow logs in real time; use `-i <instance-id>` to filter by instance; pipe the output to `grep ERROR` to search error entries.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "```bash\n# View recent logs\nflyctl logs\n\n# Follow logs in real-time\nflyctl logs -f\n\n# Filter logs by instance\nflyctl logs -i instance-id\n\n# Search logs\nflyctl logs | grep ERROR\n```", "repository": "Guztaver/regulacao", "url": "https://github.com/Guztaver/regulacao/blob/980704276d9f067b5bc08f8a32aa3630c875bddc/FLY.md?plain=1", "original_guideline": "Use `flyctl logs` to view recent logs; use `flyctl logs -f` to follow logs in real time; use `-i <instance-id>` to filter by instance; pipe the output to `grep ERROR` to search error entries."}]}, {"id": "CG-1722", "guideline": "Use `getLogger(name)` → separates logs by module.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1723", "guideline": "Use `ILogger` for structured logging.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "2", "examples": []}, {"id": "CG-1724", "guideline": "Use a backend-agnostic structured-logging abstraction so the logging backend can be changed without modifying consuming code.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1725", "guideline": "Use a rotating file handler for `app.log`, rotate at 5000 bytes and retain 3 backups, and include timestamp, logger name, severity, and message in the format.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "```python\nimport logging\nfrom logging.handlers import RotatingFileHandler\nfrom worker import do_work\n\n# -------------------------------\n# 1. Create logger\n# -------------------------------\nlogger = logging.getLogger(\"my_app\")   # app-wide logger\nlogger.setLevel(logging.DEBUG)         # capture everything (handlers will filter)\n\n# -------------------------------\n# 2. Create handlers\n# -------------------------------\n\n# Console handler (for devs)\nconsole_handler = logging.StreamHandler()\nconsole_handler.setLevel(logging.WARNING)   # only show WARNING+\n\n# File handler (rotating logs)\nfile_handler = RotatingFileHandler(\n    \"app.log\", maxBytes=5000, backupCount=3\n)\nfile_handler.setLevel(logging.INFO)         # record INFO+\n\n# -------------------------------\n# 3. Define formatter\n# -------------------------------\nformatter = logging.Formatter(\n    \"%(asctime)s | %(name)s | %(levelname)s | %(message)s\"\n)\n\n# Attach formatter\nconsole_handler.setFormatter(formatter)\nfile_handler.setFormatter(formatter)\n\n# -------------------------------\n# 4. Add handlers to logger\n# -------------------------------\nlogger.addHandler(console_handler)\nlogger.addHandler(file_handler)\n\n# -------------------------------\n# 5. Example usage\n# -------------------------------\nlogger.debug(\"Starting application in DEBUG mode\")  # won't show on console\nlogger.info(\"Application started successfully\")     # goes to file\nlogger.warning(\"Low disk space!\")                   # goes to console + file\n\ntry:\n    result = do_work()\n    logger.info(f\"Work result: {result}\")\nexcept Exception:\n    logger.exception(\"Something went wrong during work execution\")\n```", "repository": "pandey-g/various_notes", "url": "https://github.com/pandey-g/various_notes/blob/7b2514cd235f6af69599f34b57c750dca0c9d9f3/JWT.md?plain=1", "original_guideline": "Use a rotating file handler for `app.log`, rotate at 5000 bytes and retain 3 backups, and include timestamp, logger name, severity, and message in the format."}]}, {"id": "CG-1726", "guideline": "Use basicConfig(force=True) or dictConfig to ensure intended logging configuration is applied.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1727", "guideline": "Use contextual logging whenever possible. `klog.FromContext` MUST be used to obtain a logger whenever there is a `Context` available.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1728", "guideline": "Use custom log format for pyxcp: .. code-block:: python import logging Custom format with milliseconds and function name formatter = logging.Formatter( \"%(asctime)s.%(msecs)03d [%(name)s:%(funcName)s] %(levelname)s: %(message)s\", datefmt=\"%H:%M:%S\" ) handler = logging.StreamHandler() handler.setFormatter(formatter) pyxcp_logger = logging.getLogger(\"pyxcp\") pyxcp_logger.addHandler(handler) pyxcp_logger.setLevel(logging.DEBUG).", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "Use custom log format for pyxcp:\n\n.. code-block:: python\n\n   import logging\n\n   # Custom format with milliseconds and function name\n   formatter = logging.Formatter(\n       \"%(asctime)s.%(msecs)03d [%(name)s:%(funcName)s] %(levelname)s: %(message)s\",\n       datefmt=\"%H:%M:%S\"\n   )\n\n   handler = logging.StreamHandler()\n   handler.setFormatter(formatter)\n\n   pyxcp_logger = logging.getLogger(\"pyxcp\")\n   pyxcp_logger.addHandler(handler)\n   pyxcp_logger.setLevel(logging.DEBUG)", "repository": "christoph2/pyxcp", "url": "https://github.com/christoph2/pyxcp/blob/9a8a2f966ad173ebafb9ccf76a0be65403b1457a/docs/logging.rst", "original_guideline": "Use custom log format for pyxcp: .. code-block:: python import logging Custom format with milliseconds and function name formatter = logging.Formatter( \"%(asctime)s.%(msecs)03d [%(name)s:%(funcName)s] %(levelname)s: %(message)s\", datefmt=\"%H:%M:%S\" ) handler = logging.StreamHandler() handler.setFormatter(formatter) pyxcp_logger = logging.getLogger(\"pyxcp\") pyxcp_logger.addHandler(handler) pyxcp_logger.setLevel(logging.DEBUG)."}]}, {"id": "CG-1729", "guideline": "Use Go's standard `slog` library for robust structured logging.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1730", "guideline": "Use loggers per module (`logger = logging.getLogger(name)`).", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1731", "guideline": "Use module-specific logger Example error.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "```python\nimport logging\n\n# Use module-specific logger\nlogger = logging.getLogger(__name__)\n\ndef do_work():\n    logger.debug(\"Starting work...\")   # captured (but not shown in console)\n    # Example error\n    x = 10 / 0   # will raise exception\n    return x\n```", "repository": "pandey-g/various_notes", "url": "https://github.com/pandey-g/various_notes/blob/7b2514cd235f6af69599f34b57c750dca0c9d9f3/JWT.md?plain=1", "original_guideline": "Use module-specific logger Example error."}]}, {"id": "CG-1732", "guideline": "Use NullHandler by default Never call ``logging.basicConfig()`` in library code Use hierarchical logger names Let applications configure logging.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1733", "guideline": "Use of klog is REQUIRED. Klog is the de facto logging package for Kubernetes development.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1734", "guideline": "Use structured logging (logger.bind(...)) where appropriate.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1735", "guideline": "Use structured logging as part of observability alongside Prometheus metrics and OpenTelemetry tracing.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1736", "guideline": "Use structured logging in production: Enable JSON logging in production environments for better log analysis.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1737", "guideline": "Use the `java.util.logging` package for project logging.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "4", "examples": []}, {"id": "CG-1738", "guideline": "Use the built-in ``setup_logging()`` helper: .. code-block:: python from pyxcp.logger import setup_logging import logging Enable INFO logging to console setup_logging(level=logging.INFO) Now pyxcp logs will appear from pyxcp.cmdline import ArgumentParser ap = ArgumentParser(description=\"With logging\") with ap.run() as xcp: xcp.connect() # Will log connection details xcp.disconnect().", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "Use the built-in ``setup_logging()`` helper:\n\n.. code-block:: python\n\n   from pyxcp.logger import setup_logging\n   import logging\n\n   # Enable INFO logging to console\n   setup_logging(level=logging.INFO)\n\n   # Now pyxcp logs will appear\n   from pyxcp.cmdline import ArgumentParser\n   ap = ArgumentParser(description=\"With logging\")\n   with ap.run() as xcp:\n       xcp.connect()  # Will log connection details\n       xcp.disconnect()", "repository": "christoph2/pyxcp", "url": "https://github.com/christoph2/pyxcp/blob/9a8a2f966ad173ebafb9ccf76a0be65403b1457a/docs/logging.rst", "original_guideline": "Use the built-in ``setup_logging()`` helper: .. code-block:: python from pyxcp.logger import setup_logging import logging Enable INFO logging to console setup_logging(level=logging.INFO) Now pyxcp logs will appear from pyxcp.cmdline import ArgumentParser ap = ArgumentParser(description=\"With logging\") with ap.run() as xcp: xcp.connect() # Will log connection details xcp.disconnect()."}]}, {"id": "CG-1739", "guideline": "Use the following logging configuration: Application logs (info/warn): 90 days, Operational debugging; Error logs: 1 year, Incident investigation; Security audit logs: 7–10 years, Legal/compliance (varies by EU country); Debug/trace logs: 7 days max, Only enabled temporarily, per-tenant; Access logs: 90 days, GDPR Art. 5(1)(e) — storage limitation.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1740", "guideline": "Use Winston for structured logging.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "2", "examples": []}, {"id": "CG-1741", "guideline": "Use Winston-based structured logging and include test lifecycle events.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1742", "guideline": "Used `LogManager.getLogger()` to initialize loggers in both files.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1743", "guideline": "Using `klog` log value helpers like `klog.KObj` is just fine.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1744", "guideline": "Utilizes Go's `slog` package for clear and structured logging, making it easier to monitor and debug.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1745", "guideline": "We use `logr.Logger` interface for logging everywhere.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1746", "guideline": "We use the `k8s.io/klog/v2` package to manage logging.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1747", "guideline": "When a security event occurs, you might want to review API calls that were attempted but failed due to the IAM principal not having access to perform the action on that resource. To discover this activity, run the following query (be sure to modify the time window first).", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1748", "guideline": "When not using stdlib logging, avoid %-style formatting (use the framework-native formatting or ensure calls go through a bridge adapter that pre-formats).", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1749", "guideline": "When using `file`, you should also configure: `LOG_FILE_PATH`: Path where log files are written when `LOG_TYPES` contains `file`. When using `syslog`, you should also configure: `LOG_SYSLOG_ADDRESS`: The address of the syslog server (e.g., `udp://bw-syslog:514` or `/dev/log`). `LOG_SYSLOG_TAG`: A unique tag for the service (e.g., `bw-scheduler`) to distinguish its entries.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1750", "guideline": "When using Loggly, <FormatMessage\\>true<\/FormatMessage\\> is required in the policy as a child of the <Syslog\\>element.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1751", "guideline": "Winston-based logging with file rotation.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1752", "guideline": "With `slog` being part of Go's stdlib since 1.21, we decided to use it as the logging library with a wrapper so that we can get log levels as well.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1753", "guideline": "WithLogger: Structured logging (compatible with log/slog).", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1754", "guideline": "You can configure Amazon Route 53 to log Domain Name System (DNS) queries.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1755", "guideline": "You can configure VPC Flow Logs for a VPC in your account to capture traffic that enters and moves around your VPC network, without the addition of instances or products.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1756", "guideline": "You should configure web access control lists (ACLs) to gain fine-grained control over the requests, and enable logging for such ACLs to get detailed information about traffic that is analyzed by AWS WAF.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1757", "guideline": "You should enable standard logs, also known as access logs, when using CloudFront. Specify an S3 bucket where you want CloudFront to save the files.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1758", "guideline": "Zeek and Suricata are pre-configured to monitor and alert on network traffic.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1759", "guideline": "\"Check level first: if (logger.isLevelEnabled('debug')) { ... }\".", "dimension": "How to log", "theme": "Logging verification", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-1760", "guideline": "::: tip Test Your Audit Logging Periodically run a tabletop exercise: \"User X's account was compromised last Tuesday. Reconstruct everything they did for the past 30 days.\" If your audit logs cannot answer this question comprehensively, you have gaps to fill. ::.", "dimension": "How to log", "theme": "Logging verification", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-1761", "guideline": "Check build logs flyctl logs --app regulacao-list.", "dimension": "How to log", "theme": "Logging verification", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-1762", "guideline": "Check if context is cancelled.", "dimension": "How to log", "theme": "Logging verification", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-1763", "guideline": "Check logs for anomalies via `/agents documentation-generator`.", "dimension": "How to log", "theme": "Logging verification", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-1764", "guideline": "For incident response, you need to be able to analyze and query your logs to validate what occurred and to understand the scope.", "dimension": "How to log", "theme": "Logging verification", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-1765", "guideline": "Log Test error scenarios.", "dimension": "How to log", "theme": "Logging verification", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-1766", "guideline": "Most settings are right but check your error sampling. Sampling errors in production is one of the most dangerous logging anti-patterns — errors must always be captured at 100%.", "dimension": "How to log", "theme": "Logging verification", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-1767", "guideline": "Reduce health check logging frequency.", "dimension": "How to log", "theme": "Logging verification", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-1768", "guideline": "Run with logging output RUST_LOG=debug cargo test test_name -- --nocapture.", "dimension": "How to log", "theme": "Logging verification", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-1769", "guideline": "Specialized formatters for test execution and HTTP requests.", "dimension": "How to log", "theme": "Logging verification", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-1770", "guideline": "Test alert queries against log data.", "dimension": "How to log", "theme": "Logging verification", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-1771", "guideline": "Use provided test commands to validate logging behavior in all operational modes.", "dimension": "How to log", "theme": "Logging verification", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-1772", "guideline": "Use severity-specific logging: INFO for `Test started`; ERROR for `Test failed`; DEBUG for `Debug information`.", "dimension": "How to log", "theme": "Logging verification", "theme_basis": "Inductive", "original_count": "1", "examples": [{"reason": "```typescript\nimport logger from '@core/logger';\n\n// Basic logging\nlogger.info('Test started');\nlogger.error('Test failed', error);\nlogger.debug('Debug information', { data });\n\n// Test execution logging\nlogger.logTest({\n  testName: 'Login Test',\n  testFile: 'auth.spec.ts',\n  browser: 'chromium',\n  status: 'passed',\n  duration: 1500\n});\n\n// HTTP request logging\nlogger.logHttp({\n  method: 'POST',\n  url: '/api/login',\n  requestBody: { username, password },\n  responseStatus: 200,\n  duration: 250\n});\n```", "repository": "omerakben/Playwright-Automation", "url": "https://github.com/omerakben/Playwright-Automation/blob/d61d9b43da038f58aa1501ac53d1cacfa59df290/Guide.md?plain=1", "original_guideline": "Use severity-specific logging: INFO for `Test started`; ERROR for `Test failed`; DEBUG for `Debug information`."}]}, {"id": "CG-1773", "guideline": "Use severity-specific logging: INFO for `TEST: {}`; INFO for `INPUT: {:?}`; INFO for `EXPECTED: {:?}`; INFO for `ACTUAL: {:?}`; INFO for `PASS/FAIL: {}`.", "dimension": "How to log", "theme": "Logging verification", "theme_basis": "Inductive", "original_count": "1", "examples": [{"reason": "```rust\ninfo!(\"TEST: {}\", test_name);\ninfo!(\"INPUT: {:?}\", input);\ninfo!(\"EXPECTED: {:?}\", expected);\ninfo!(\"ACTUAL: {:?}\", actual);\ninfo!(\"PASS/FAIL: {}\", result);\n```", "repository": "Dicklesworthstone/remote_compilation_helper", "url": "https://github.com/Dicklesworthstone/remote_compilation_helper/blob/39fec254482c7c0703308a23d0370f18d6431e21/docs/TESTING.md?plain=1", "original_guideline": "Use severity-specific logging: INFO for `TEST: {}`; INFO for `INPUT: {:?}`; INFO for `EXPECTED: {:?}`; INFO for `ACTUAL: {:?}`; INFO for `PASS/FAIL: {}`."}]}, {"id": "CG-1774", "guideline": "Verify that logging doesn't break the application logic.", "dimension": "How to log", "theme": "Logging verification", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-1775", "guideline": "Best practices like logging non-identifying tokens instead of personal data, sanitizing and redacting sensitive information, are just a few examples.", "dimension": "How to log", "theme": "Sensitive-data protection", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-1776", "guideline": "Data Privacy: Remove sensitive information before it leaves your infrastructure.", "dimension": "How to log", "theme": "Sensitive-data protection", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-1777", "guideline": "Extend the logging sanitization rules with application-specific sensitive-data patterns and redact matching values before they are written to logs.", "dimension": "How to log", "theme": "Sensitive-data protection", "theme_basis": "Inductive", "original_count": "1", "examples": [{"reason": "#### ✅ **DO: Add Custom Sensitive Patterns**\n\n```typescript\nimport { addSensitivePatterns, configureAttributeSanitization } from '@paystackhq/nestjs-observability';\n\n// Method 1: Add patterns incrementally to defaults\naddSensitivePatterns([\n  /customer[_-]?id/i, // Match customer_id, customer-id, customerId\n  /account[_-]?number/i, // Match account_number, account-number, accountNumber\n  /transaction[_-]?ref/i, // Match transaction_ref, transaction-ref, transactionRef\n  /\\b\\d{16}\\b/, // Match 16-digit numbers (like card numbers)\n  /user[_-]?data/i, // Match user_data, user-data, userData\n  /internal[_-]?reference/i, // Match internal_reference, internal-reference\n]);\n\n// Method 2: Configure all sanitization settings at once\nconfigureAttributeSanitization({\n  additionalSensitivePatterns: [/company[_-]?secret/i, /database[_-]?url/i, /session[_-]?key/i, /api[_-]?response/i],\n  customRedactedPlaceholder: '[BUSINESS_DATA]',\n});\n\n// Method 3: Reset and set new patterns (replaces additional patterns)\nconfigureAttributeSanitization({\n  additionalSensitivePatterns: [/financial[_-]?data/i, /personal[_-]?info/i],\n});\n```", "repository": "Paystack-MFB/nestjs-observability", "url": "https://github.com/Paystack-MFB/nestjs-observability/blob/87b280d79048785cb4cbf35ea3cb87b91d1b2f81/docs/best-practices.md?plain=1", "original_guideline": "Extend the logging sanitization rules with application-specific sensitive-data patterns and redact matching values before they are written to logs."}]}, {"id": "CG-1778", "guideline": "For any sensitive PII data, only capture masked or redacted version of the data. For phone numbers, capture only the area code. For user names, capture only the first initial and the last initial. For date of birth, capture only the month and year.", "dimension": "How to log", "theme": "Sensitive-data protection", "theme_basis": "Inductive", "original_count": "3", "examples": []}, {"id": "CG-1779", "guideline": "Keep audit logs selective, structured, and tamper-resistant: pseudonymize or mask PII, follow a defined event catalog, use consistent JSON, store logs separately in write-once or chained storage, define retention, and audit access to the audit system itself.", "dimension": "How to log", "theme": "Sensitive-data protection", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-1780", "guideline": "Log INFO for `Creating user`.", "dimension": "How to log", "theme": "Sensitive-data protection", "theme_basis": "Inductive", "original_count": "1", "examples": [{"reason": "#### ✅ **Example: Masking in Application Logs**\n\n```typescript\n@Injectable()\nexport class UserService {\n  constructor(private readonly logger: LoggerService) {\n    this.logger.setContext('UserService');\n  }\n\n  async createUser(userData: CreateUserDto): Promise<User> {\n    // Sensitive fields are automatically masked in the log output\n    this.logger.info('Creating user', {\n      email: 'user@example.com', // Will be masked as [MASKED]\n      password: 'secret123', // Will be masked as [MASKED]\n      name: 'John Doe', // Not masked\n      apiKey: 'key123', // Will be masked as [MASKED]\n    });\n\n    const user = await this.userRepository.create(userData);\n    return user;\n  }\n}\n```", "repository": "Paystack-MFB/nestjs-observability", "url": "https://github.com/Paystack-MFB/nestjs-observability/blob/87b280d79048785cb4cbf35ea3cb87b91d1b2f81/docs/best-practices.md?plain=1", "original_guideline": "Log INFO for `Creating user`."}]}, {"id": "CG-1781", "guideline": "Log request received (INFO) and response sent (INFO) Log errors with full context (ERROR) Include HTTP method, path, status code, duration DO NOT log request/response bodies (PHI risk, cardinality) DO propagate and log trace_id, correlation_id.", "dimension": "How to log", "theme": "Sensitive-data protection", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-1782", "guideline": "Mask secrets in error messages.", "dimension": "How to log", "theme": "Sensitive-data protection", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-1783", "guideline": "Never log sensitive data directly.", "dimension": "How to log", "theme": "Sensitive-data protection", "theme_basis": "Inductive", "original_count": "1", "examples": [{"reason": "3. **Never log sensitive data directly**:\n   ```javascript\n   // Bad\n   console.log('Token:', bearerToken);\n   \n   // Good\n   console.log('Headers:', maskSensitiveHeaders(headers));\n   ```", "repository": "sveneisenschmidt/n8n-openai-bridge", "url": "https://github.com/sveneisenschmidt/n8n-openai-bridge/blob/98976fe041d5ca6ce4dc01cfc63a60ba3012350e/docs/LOGGING.md?plain=1", "original_guideline": "Never log sensitive data directly."}]}, {"id": "CG-1784", "guideline": "One potential exception: descriptors. descriptor values will never contain sensitive data; since the other string and numeric values are anonymized, the descriptor value itself does not provide a side channel to sensitive information; there is value to having this when debugging failed HTTP requests.", "dimension": "How to log", "theme": "Sensitive-data protection", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-1785", "guideline": "Redact common credential patterns before logging, including passwords, secrets, tokens or keys, AWS access keys, GitHub tokens, and JWTs.", "dimension": "How to log", "theme": "Sensitive-data protection", "theme_basis": "Inductive", "original_count": "2", "examples": [{"reason": "```python\nimport re\n\n# Patterns that match common credential formats in cloud.gov environments\nREDACTION_PATTERNS = [\n    (re.compile(r'(?:password|secret|token|key)[\"\\s:=]+[\"\\']?([a-zA-Z0-9+/=_-]{20,})[\"\\']?', re.IGNORECASE), '[REDACTED]'),\n    (re.compile(r'AKIA[0-9A-Z]{16}'), '[AWS-KEY-REDACTED]'),                              # AWS Access Key ID\n    (re.compile(r'(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9_]{36}'), '[GITHUB-TOKEN-REDACTED]'), # GitHub tokens\n    (re.compile(r'eyJ[A-Za-z0-9-_]+\\.eyJ[A-Za-z0-9-_]+'), '[JWT-REDACTED]'),              # JWT tokens\n    (re.compile(r'cf\\s+auth\\s+\\S+\\s+\\S+'), 'cf auth [REDACTED] [REDACTED]'),           # CF auth commands\n]\n\ndef redact_sensitive(text: str) -> str:\n    \"\"\"Apply pattern-based redaction to log output.\"\"\"\n    for pattern, replacement in REDACTION_PATTERNS:\n        text = pattern.sub(replacement, text)\n    return text\n```", "repository": "adhocteam/cloud-gov-instructions", "url": "https://github.com/adhocteam/cloud-gov-instructions/blob/64a6f40c7c07c5832faa4c9c9379df92b9ab311e/README.md?plain=1", "original_guideline": "Redact common credential patterns before logging, including passwords, secrets, tokens or keys, AWS access keys, GitHub tokens, and JWTs."}, {"reason": "```javascript\nconst REDACTION_PATTERNS = [\n  [/(?:password|secret|token|key)[\"\\s:=]+[\"']?([a-zA-Z0-9+\\/=_-]{20,})[\"']?/gi, '[REDACTED]'],\n  [/AKIA[0-9A-Z]{16}/g, '[AWS-KEY-REDACTED]'],\n  [/(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9_]{36}/g, '[GITHUB-TOKEN-REDACTED]'],\n  [/eyJ[A-Za-z0-9\\-_]+\\.eyJ[A-Za-z0-9\\-_]+/g, '[JWT-REDACTED]'],\n];\n\nfunction redactSensitive(text) {\n  let redacted = text;\n  for (const [pattern, replacement] of REDACTION_PATTERNS) {\n    redacted = redacted.replace(pattern, replacement);\n  }\n  return redacted;\n}\n```", "repository": "adhocteam/cloud-gov-instructions", "url": "https://github.com/adhocteam/cloud-gov-instructions/blob/64a6f40c7c07c5832faa4c9c9379df92b9ab311e/README.md?plain=1", "original_guideline": "Redact common credential patterns before logging, including passwords, secrets, tokens or keys, AWS access keys, GitHub tokens, and JWTs."}]}, {"id": "CG-1786", "guideline": "Register secret values with `signale.addSecrets()` so matching values are masked as `[secure]` in log output.", "dimension": "How to log", "theme": "Sensitive-data protection", "theme_basis": "Inductive", "original_count": "1", "examples": [{"reason": "```js\nconst signale = require('signale');\n\nsignale.log('$ exporting USERNAME=%s', 'klaudiosinani');\n//=> $ exporting USERNAME=klaudiosinani\n\nsignale.addSecrets(['klaudiosinani']);\n\nsignale.log('$ exporting USERNAME=%s', 'klaudiosinani');\n//=> $ exporting USERNAME=[secure]\n```", "repository": "klaudiosinani/signale", "url": "https://github.com/klaudiosinani/signale/blob/a0119bb6b3b4d63b51318585c06d519c54897333/readme.md?plain=1", "original_guideline": "Register secret values with `signale.addSecrets()` so matching values are masked as `[secure]` in log output."}]}, {"id": "CG-1787", "guideline": "Sanitize error messages before logging.", "dimension": "How to log", "theme": "Sensitive-data protection", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-1788", "guideline": "Specify GDPR-compliant log handling (PII redaction, retention policies, right to erasure).", "dimension": "How to log", "theme": "Sensitive-data protection", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-1789", "guideline": "Use masked secrets in CI. Never echo environment variables containing secrets.", "dimension": "How to log", "theme": "Sensitive-data protection", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-1790", "guideline": "When debugging: Sensitive Data Sanitize logs Protect credentials Mask personal information Access Control Verify permissions Check authentication Monitor access patterns.", "dimension": "How to log", "theme": "Sensitive-data protection", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-1791", "guideline": "When logging request data (headers and body), sensitive information is automatically masked: Authorization headers: Only first 8 and last 4 characters shown API keys: Only first 8 and last 4 characters shown Example:.", "dimension": "How to log", "theme": "Sensitive-data protection", "theme_basis": "Inductive", "original_count": "1", "examples": [{"reason": "When logging request data (headers and body), sensitive information is automatically masked:\n\n- **Authorization headers**: Only first 8 and last 4 characters shown\n- **API keys**: Only first 8 and last 4 characters shown\n\nExample:\n```javascript\n// Before masking:\n{ authorization: 'Bearer sk-1234567890abcdefghijklmnopqrstuvwxyz' }\n\n// After masking:\n{ authorization: 'Bearer sk-12345...wxyz' }\n```", "repository": "sveneisenschmidt/n8n-openai-bridge", "url": "https://github.com/sveneisenschmidt/n8n-openai-bridge/blob/98976fe041d5ca6ce4dc01cfc63a60ba3012350e/docs/LOGGING.md?plain=1", "original_guideline": "When logging request data (headers and body), sensitive information is automatically masked: Authorization headers: Only first 8 and last 4 characters shown API keys: Only first 8 and last 4 characters shown Example:."}]}, {"id": "CG-1792", "guideline": "🔍 Log Format When HTTP request/response logging is enabled (`OTEL_LOG_HTTP_REQUESTS=true`), the logs follow the Paystack log format with automatic trace correlation and sensitive data masking.", "dimension": "How to log", "theme": "Sensitive-data protection", "theme_basis": "Inductive", "original_count": "1", "examples": [{"reason": "#### 🔍 **Log Format**\n\nWhen HTTP request/response logging is enabled (`OTEL_LOG_HTTP_REQUESTS=true`), the logs follow the Paystack log format with automatic trace correlation and sensitive data masking:\n\n```typescript\n// Request log\nconst req = {\n  service: 'my-service',\n  type: 'request',\n  level: 'info',\n  created: '2025-11-10T12:00:00.000Z',\n  environment: 'production',\n  age: 0,\n  endpoint: '/api/users',\n  traceId: 'abc123',\n  spanId: 'def456',\n  payload: {\n    verb: 'POST',\n    client: '192.168.1.1',\n    headers: { 'user-agent': 'Mozilla/5.0', authorization: '[MASKED]' },\n    query: { page: '1' },\n    body: { email: '[MASKED]', password: '[MASKED]', name: 'John Doe' },\n  },\n};\n\n// Response log\nconst res = {\n  service: 'my-service',\n  type: 'response',\n  level: 'info',\n  created: '2025-11-10T12:00:00.123Z',\n  environment: 'production',\n  age: 123,\n  endpoint: '/api/users',\n  traceId: 'abc123',\n  spanId: 'def456',\n  payload: {\n    verb: 'POST',\n    client: '192.168.1.1',\n    status: 201,\n    body: { id: 'user-123', email: '[MASKED]', token: '[MASKED]' },\n  },\n};\n```", "repository": "Paystack-MFB/nestjs-observability", "url": "https://github.com/Paystack-MFB/nestjs-observability/blob/87b280d79048785cb4cbf35ea3cb87b91d1b2f81/docs/best-practices.md?plain=1", "original_guideline": "🔍 Log Format When HTTP request/response logging is enabled (`OTEL_LOG_HTTP_REQUESTS=true`), the logs follow the Paystack log format with automatic trace correlation and sensitive data masking."}]}, {"id": "CG-1793", "guideline": "Support a minimal logging mode.", "dimension": "Log verbosity", "theme": "Custom verbosity scale", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-1794", "guideline": "Use controller verbosity levels consistently: V0 for errors, warnings, and lifecycle; V1 for effectual reconciliation actions; V2 for non-effectual reconciliation steps; V3 for other useful reconcile details; V4 for non-controller utilities; and remove V5+ debug logs before commit.", "dimension": "Log verbosity", "theme": "Custom verbosity scale", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-1795", "guideline": "Use the defined verbosity scale `DEFAULT=2`, `VERBOSE=3`, `DEBUG=4`, and `TRACE=5` to control log detail.", "dimension": "Log verbosity", "theme": "Custom verbosity scale", "theme_basis": "Inductive", "original_count": "2", "examples": [{"reason": "We choose to simplify to the following 3 common levels.\n\n```\nconst(\n    DEFAULT=2\n    VERBOSE=3\n    DEBUG=4\n    TRACE=5\n)\n```", "repository": "shaneutt/gateway-api-inference-extension-2", "url": "https://github.com/shaneutt/gateway-api-inference-extension-2/blob/1ba13f390d17709ed825d9c952a8117e4f0df24e/docs/dev.md?plain=1", "original_guideline": "Use the defined verbosity scale `DEFAULT=2`, `VERBOSE=3`, `DEBUG=4`, and `TRACE=5` to control log detail."}]}, {"id": "CG-1796", "guideline": "Use V0–V5 verbosity consistently: V0 for always-useful operator information, V1 for a quiet default, V2 for steady-state and significant changes (recommended default), V3 for extended change details, V4 for debugging, and V5 for tracing.", "dimension": "Log verbosity", "theme": "Custom verbosity scale", "theme_basis": "Inductive", "original_count": "2", "examples": [{"reason": "- `logger.V(0).Info` = `logger.Info` - Generally useful for this to **always** be visible to a cluster operator\n- `logger.V(1).Info` - A reasonable default log level if you don't want verbosity.\n- `logger.V(2).Info` - Useful steady state information about the service and important log messages that may correlate to significant changes in the system. This is the recommended default log level for most systems.\n- `logger.V(3).Info` - Extended information about changes\n- `logger.V(4).Info` - Debug level verbosity\n- `logger.V(5).Info` - Trace level verbosity", "repository": "shaneutt/gateway-api-inference-extension-2", "url": "https://github.com/shaneutt/gateway-api-inference-extension-2/blob/1ba13f390d17709ed825d9c952a8117e4f0df24e/docs/dev.md?plain=1", "original_guideline": "Use verbosity levels consistently: V0 for information always useful to operators, V1 for a quiet default, V2 for steady-state and significant system changes (recommended default), V3 for extended change details, V4 for debugging, and V5 for tracing."}, {"reason": "* `klog.V(0).InfoS` = `klog.InfoS` - Generally useful for this to **always** be visible to a cluster operator\n* `klog.V(1).InfoS` - A reasonable default log level if you don't want verbosity.\n* `klog.V(2).InfoS` - Useful steady state information about the service and important log messages that may correlate to significant changes in the system.  This is the recommended default log level for most systems.\n* `klog.V(3).InfoS` - Extended information about changes\n* `klog.V(4).InfoS` - Debug level verbosity\n* `klog.V(5).InfoS` - Trace level verbosity", "repository": "coolkp/llm-instance-gateway", "url": "https://github.com/coolkp/llm-instance-gateway/blob/6c22d92eb4594e1d560740de892432b87778e2f3/docs/dev.md?plain=1", "original_guideline": "Use klog verbosity consistently: V0 for information always useful to operators, V1 for a quiet default, V2 for steady-state and significant system changes (recommended default), V3 for extended change details, V4 for debugging, and V5 for tracing."}]}, {"id": "CG-1797", "guideline": "\"Debug level as default. Should default to 'info' for production.\".", "dimension": "Log verbosity", "theme": "DEBUG", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1798", "guideline": "`V(DEBUG)` and above: use best judgement.", "dimension": "Log verbosity", "theme": "DEBUG", "theme_basis": "Deductive", "original_count": "2", "examples": []}, {"id": "CG-1799", "guideline": "A: Use ``setup_logging(level=logging.DEBUG)`` from ``pyxcp.logger``.", "dimension": "Log verbosity", "theme": "DEBUG", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "A: Use ``setup_logging(level=logging.DEBUG)`` from ``pyxcp.logger``.", "repository": "christoph2/pyxcp", "url": "https://github.com/christoph2/pyxcp/blob/9a8a2f966ad173ebafb9ccf76a0be65403b1457a/docs/logging.rst", "original_guideline": "A: Use ``setup_logging(level=logging.DEBUG)`` from ``pyxcp.logger``."}]}, {"id": "CG-1800", "guideline": "A: Yes! Configure loggers like ``logging.getLogger(\"pyxcp.transport\").setLevel(logging.DEBUG)``.", "dimension": "Log verbosity", "theme": "DEBUG", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "A: Yes! Configure loggers like ``logging.getLogger(\"pyxcp.transport\").setLevel(logging.DEBUG)``.", "repository": "christoph2/pyxcp", "url": "https://github.com/christoph2/pyxcp/blob/9a8a2f966ad173ebafb9ccf76a0be65403b1457a/docs/logging.rst", "original_guideline": "A: Yes! Configure loggers like ``logging.getLogger(\"pyxcp.transport\").setLevel(logging.DEBUG)``."}]}, {"id": "CG-1801", "guideline": "Any default debug level severity messages need to be logged using: ---- $ glog.V(4).Infof(msg, args...)` ----.", "dimension": "Log verbosity", "theme": "DEBUG", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1802", "guideline": "Avoid unbounded DEBUG logging in production.", "dimension": "Log verbosity", "theme": "DEBUG", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1803", "guideline": "Debug logging: Use debug level for most logging; avoid info/warn/error unless absolutely necessary.", "dimension": "Log verbosity", "theme": "DEBUG", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1804", "guideline": "Debug logs are extremely verbose and generated at high volume. They are only useful during active debugging sessions (hours to days). Retaining debug logs beyond 7 days is almost never useful and creates significant unnecessary storage cost — debug logs often account for 40–60% of total log volume.", "dimension": "Log verbosity", "theme": "DEBUG", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1805", "guideline": "Debug Mode: Set `ROCM_NINODES_DEBUG=1` environment variable before starting.", "dimension": "Log verbosity", "theme": "DEBUG", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1806", "guideline": "Displays additional information about the state of an HTTP request and/or state of responses from external services.", "dimension": "Log verbosity", "theme": "DEBUG", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1807", "guideline": "Enable debug logging (edit logging_config.py) Set console_level=\"DEBUG\".", "dimension": "Log verbosity", "theme": "DEBUG", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1808", "guideline": "Enable debug logging by setting log level to DEBUG.", "dimension": "Log verbosity", "theme": "DEBUG", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1809", "guideline": "Enable debug logging export STRUCTKIT_LOG_LEVEL=DEBUG structkit generate config.yaml --log DEBUG.", "dimension": "Log verbosity", "theme": "DEBUG", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1810", "guideline": "Enable DEBUG logging when diagnostic detail is required.", "dimension": "Log verbosity", "theme": "DEBUG", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1811", "guideline": "Enable debug logging.", "dimension": "Log verbosity", "theme": "DEBUG", "theme_basis": "Deductive", "original_count": "2", "examples": []}, {"id": "CG-1812", "guideline": "FINER/FINEST: Highly detailed debugging information for troubleshooting.", "dimension": "Log verbosity", "theme": "DEBUG", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1813", "guideline": "Guard expensive computations behind logger.isEnabledFor(logging.DEBUG) so they are only executed when DEBUG logging is enabled.", "dimension": "Log verbosity", "theme": "DEBUG", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1814", "guideline": "Guard expensive debug-time computations with logger.isEnabledFor(logging.DEBUG).", "dimension": "Log verbosity", "theme": "DEBUG", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1815", "guideline": "Log `i like turtles` at DEBUG level.", "dimension": "Log verbosity", "theme": "DEBUG", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1816", "guideline": "Log the event at DEBUG level with structured fields `message`, `paymentId`, `amount`, `provider`.", "dimension": "Log verbosity", "theme": "DEBUG", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "#### ✅ **DO: Use Appropriate Log Levels**\n\n```typescript\n@Injectable()\nexport class PaymentService {\n  constructor(private readonly logger: LoggerService) {\n    this.logger.setContext('PaymentService');\n  }\n\n  async processPayment(paymentData: PaymentDto): Promise<Payment> {\n    // DEBUG: Detailed information for debugging\n    this.logger.debug({\n      message: 'Starting payment processing',\n      paymentId: paymentData.id,\n      amount: paymentData.amount,\n      provider: paymentData.provider,\n    });\n\n    // INFO: General information about normal operations\n    this.logger.info({\n      message: 'Payment processing initiated',\n      paymentId: paymentData.id,\n      amount: paymentData.amount,\n    });\n\n    try {\n      const payment = await this.processPaymentInternal(paymentData);\n\n      // INFO: Successful operations\n      this.logger.info({\n        message: 'Payment processed successfully',\n        paymentId: payment.id,\n        status: payment.status,\n      });\n\n      return payment;\n    } catch (error) {\n      if (error instanceof ValidationError) {\n        // WARN: Expected errors that don't require immediate attention\n        this.logger.warn({\n          message: 'Payment validation failed',\n          paymentId: paymentData.id,\n          error: error.message,\n        });\n      } else {\n        // ERROR: Unexpected errors that require attention\n        this.logger.error({\n          message: 'Payment processing failed',\n          paymentId: paymentData.id,\n          error: error.message,\n          stack: error.stack,\n        });\n      }\n      throw error;\n    }\n  }\n}\n```", "repository": "Paystack-MFB/nestjs-observability", "url": "https://github.com/Paystack-MFB/nestjs-observability/blob/87b280d79048785cb4cbf35ea3cb87b91d1b2f81/docs/best-practices.md?plain=1", "original_guideline": "Log the event at DEBUG level with structured fields `message`, `paymentId`, `amount`, `provider`."}]}, {"id": "CG-1817", "guideline": "Never enable in production, but for troubleshooting.", "dimension": "Log verbosity", "theme": "DEBUG", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1818", "guideline": "Optional: Logging level export STRUCTKIT_LOG_LEVEL=\"DEBUG\".", "dimension": "Log verbosity", "theme": "DEBUG", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1819", "guideline": "Quick debug mode enable_debug_logging().", "dimension": "Log verbosity", "theme": "DEBUG", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1820", "guideline": "Set `RUST_LOG=debug` for detailed tracing.", "dimension": "Log verbosity", "theme": "DEBUG", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1821", "guideline": "Set the log level to DEBUG when using the troubleshooting hook.", "dimension": "Log verbosity", "theme": "DEBUG", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1822", "guideline": "Set the minimum log level to DEBUG.", "dimension": "Log verbosity", "theme": "DEBUG", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1823", "guideline": "So, the simplest conclusion is that logs shouldn't be too many to make storage and management difficult, nor too few to hinder troubleshooting. This paradox is the art of logging!", "dimension": "Log verbosity", "theme": "DEBUG", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1824", "guideline": "Store `log_level_override` on the `tenants` table. When debugging a specific tenant's issue, temporarily set their level to `debug` without affecting all tenants.", "dimension": "Log verbosity", "theme": "DEBUG", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "Store `log_level_override` on the `tenants` table. When debugging a specific tenant's issue, temporarily set their level to `debug` without affecting all tenants:\n\n```typescript\nconst effectiveLevel = tenantOverride ?? globalLevel;\nconst childLogger = logger.child({ tenantId, level: effectiveLevel });\n```", "repository": "purposestack/givernance", "url": "https://github.com/purposestack/givernance/blob/5950cbce7ee516a3a869816ccfc6efc7906f3065/.claude/agents/log-analyst.md?plain=1", "original_guideline": "Store `log_level_override` on the `tenants` table. When debugging a specific tenant's issue, temporarily set their level to `debug` without affecting all tenants."}]}, {"id": "CG-1825", "guideline": "The Correct Configuration To log `DEBUG` messages, both the logger and the handler must have a level of `DEBUG` or lower. With this change, a `DEBUG` message will pass the logger's filter (`DEBUG >= DEBUG`) and then also pass the handler's filter (`DEBUG >= DEBUG`), allowing it to be written to the file.", "dimension": "Log verbosity", "theme": "DEBUG", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "### The Correct Configuration\n\nTo log `DEBUG` messages, both the logger and the handler must have a level of `DEBUG` or lower.\n\n```python\n# The correct way to log DEBUG messages\n\n# Set the logger's level to DEBUG\nlogger.setLevel(logging.DEBUG)\n\n# Set the handler's level to DEBUG\nfile_handler.setLevel(logging.DEBUG)\n```\n\nWith this change, a `DEBUG` message will pass the logger's filter (`DEBUG >= DEBUG`) and then also pass the handler's filter (`DEBUG >= DEBUG`), allowing it to be written to the file.", "repository": "pandey-g/various_notes", "url": "https://github.com/pandey-g/various_notes/blob/7b2514cd235f6af69599f34b57c750dca0c9d9f3/JWT.md?plain=1", "original_guideline": "The Correct Configuration To log `DEBUG` messages, both the logger and the handler must have a level of `DEBUG` or lower. With this change, a `DEBUG` message will pass the logger's filter (`DEBUG >= DEBUG`) and then also pass the handler's filter (`DEBUG >= DEBUG`), allowing it to be written to the file."}]}, {"id": "CG-1826", "guideline": "Use `klog.V(DEBUG).InfoS` for structured logging at DEBUG verbosity.", "dimension": "Log verbosity", "theme": "DEBUG", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1827", "guideline": "Use `ROCM_NINODES_DEBUG=1` to enable debug-mode data capture.", "dimension": "Log verbosity", "theme": "DEBUG", "theme_basis": "Deductive", "original_count": "2", "examples": []}, {"id": "CG-1828", "guideline": "Use appropriate log levels (DEBUG only when needed).", "dimension": "Log verbosity", "theme": "DEBUG", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1829", "guideline": "Use categorized DEBUG logging for runtime diagnostics: `ui` for `Window state changed to: {:?}`; `bluetooth` for `CLI scanner found {} devices`; `airpods` for `Battery levels: L:{}% R:{}% C:{}%`; `config` for `Loading configuration from: {}`; `system` for `Application lifecycle state: {:?}`.", "dimension": "Log verbosity", "theme": "DEBUG", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "```rust\ncrate::debug_log!(\"ui\", \"Window state changed to: {:?}\", window_state);\ncrate::debug_log!(\"bluetooth\", \"CLI scanner found {} devices\", devices.len());\ncrate::debug_log!(\"airpods\", \"Battery levels: L:{}% R:{}% C:{}%\", left, right, case);\ncrate::debug_log!(\"config\", \"Loading configuration from: {}\", config_path);\ncrate::debug_log!(\"system\", \"Application lifecycle state: {:?}\", state);\n```", "repository": "Jay1/RustPods", "url": "https://github.com/Jay1/RustPods/blob/9bd9c17976b2409b4624bf1b958d3cc113223948/docs/index.md?plain=1", "original_guideline": "Use categorized DEBUG logging for runtime diagnostics: `ui` for `Window state changed to: {:?}`; `bluetooth` for `CLI scanner found {} devices`; `airpods` for `Battery levels: L:{}% R:{}% C:{}%`; `config` for `Loading configuration from: {}`; `system` for `Application lifecycle state: {:?}`."}]}, {"id": "CG-1830", "guideline": "Use DEBUG for per-item verbose logs and reserve INFO for summaries/lifecycle milestones.", "dimension": "Log verbosity", "theme": "DEBUG", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1831", "guideline": "Use DEBUG logging for the configured diagnostic behavior.", "dimension": "Log verbosity", "theme": "DEBUG", "theme_basis": "Deductive", "original_count": "9", "examples": [{"reason": ".. code-block:: python\n\n   from pyxcp.logger import setup_logging\n   from pyxcp.cmdline import ArgumentParser\n   import logging\n\n   # Quick debug setup\n   setup_logging(level=logging.DEBUG)\n\n   ap = ArgumentParser(description=\"Debug session\")\n   with ap.run() as xcp:\n       xcp.connect()\n       result = xcp.fetch(0x1000, 4)\n       print(f\"Data: {result.hex()}\")\n       xcp.disconnect()", "repository": "christoph2/pyxcp", "url": "https://github.com/christoph2/pyxcp/blob/9a8a2f966ad173ebafb9ccf76a0be65403b1457a/docs/logging.rst", "original_guideline": "Use DEBUG logging for the configured diagnostic behavior."}, {"reason": "```sh\n{\"time\":\"2025-06-03T10:49:23.100783-04:00\",\"level\":\"DEBUG\",\"msg\":\"Before stage\",\"domain\":\"example\",\"provider_name\":\"InMemoryProvider\",\"flag_key\":\"not-exist\",\"default_value\":true,\"stage\":\"before\"}\n{\"time\":\"2025-06-03T10:49:23.101037-04:00\",\"level\":\"ERROR\",\"msg\":\"Error stage\",\"domain\":\"example\",\"provider_name\":\"InMemoryProvider\",\"flag_key\":\"not-exist\",\"default_value\":true,\"error_message\":\"error code: FLAG_NOT_FOUND: flag for key not-exist not found\",\"stage\":\"error\"}\n```", "repository": "open-feature/go-sdk", "url": "https://github.com/open-feature/go-sdk/blob/13224532ef1798f223672d2c107126d0e1633e45/README.md?plain=1", "original_guideline": "Use DEBUG logging for the configured diagnostic behavior."}, {"reason": "```ruby\nlogger.info { 'Hello!' }\n\nlogger.debug do\n  ['User dump', { name: 'Taro', age: 15 }]\nend\n\nlogger.error do\n  ['Failed to fetch info', ex, { id: 10 }]\nend\n\nlogger.fatal { ex }\n\nlogger.fatal do\n  ['Unexpected', ex]\nend\n```\n\nTo specify more than one message, exception, and custom data, the block returns them as an array.", "repository": "tilfin/ougai", "url": "https://github.com/tilfin/ougai/blob/397d07713c93f92a125c7ef6915f23c07df7db63/README.md?plain=1", "original_guideline": "Use DEBUG logging for the configured diagnostic behavior."}, {"reason": "```bash\nOTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317\nOTEL_EXPORTER_OTLP_PROTOCOL=grpc\nOTEL_RESOURCE_ATTRIBUTES='service.name=my-service,service.version=1.0.0'\nRUST_LOG=debug\n```", "repository": "nivek-ph/tracing-otel-extra", "url": "https://github.com/nivek-ph/tracing-otel-extra/blob/b9a926d44cb056a4f70658e0553638018d69cdb7/AGENTS.md?plain=1", "original_guideline": "Use DEBUG logging for the configured diagnostic behavior."}, {"reason": "Enable OpenTelemetry debug logging:\n\n```bash\nexport OTEL_LOG_LEVEL=debug\n```", "repository": "traceloop/openllmetry-js", "url": "https://github.com/traceloop/openllmetry-js/blob/28c4a7a9e29ad295fe3dd108e853ef442b3fc507/CLAUDE.md?plain=1", "original_guideline": "Use DEBUG logging for the configured diagnostic behavior."}, {"reason": "#### ✅ **DO: Mock Observability in Unit Tests**\n\n```typescript\n// user.service.spec.ts\nimport { Test, TestingModule } from '@nestjs/testing';\nimport { LoggerService } from '@paystackhq/nestjs-observability';\nimport { UserService } from './user.service';\n\ndescribe('UserService', () => {\n  let service: UserService;\n  let loggerService: LoggerService;\n\n  beforeEach(async () => {\n    const mockLogger = {\n      log: jest.fn(),\n      error: jest.fn(),\n      warn: jest.fn(),\n      debug: jest.fn(),\n      setContext: jest.fn(),\n      addContext: jest.fn(),\n      clearContext: jest.fn(),\n      createChildLogger: jest.fn().mockReturnValue({\n        log: jest.fn(),\n        error: jest.fn(),\n      }),\n    };\n\n    const module: TestingModule = await Test.createTestingModule({\n      providers: [UserService, { provide: LoggerService, useValue: mockLogger }],\n    }).compile();\n\n    service = module.get<UserService>(UserService);\n    loggerService = module.get<LoggerService>(LoggerService);\n  });\n\n  it('should log user creation', async () => {\n    const userData = { email: 'test@example.com', name: 'Test User' };\n\n    await service.createUser(userData);\n\n    expect(loggerService.log).toHaveBeenCalledWith({\n      message: 'Creating user',\n
