asis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0513", "guideline": "Logging: Structured JSON (core/logging/) with user ID, request ID via `/agents documentation-generator`.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0514", "guideline": "Logs will include: Token extraction attempts Validation success/failure with timing Excluded URLs OPTIONS request handling.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0515", "guideline": "Look for errors in job-application relationship management and view state transitions.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0516", "guideline": "Many logging libraries can be configured to output timestamps in this format automatically:.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0517", "guideline": "Metrics Collection - Add performance and error rate monitoring.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0518", "guideline": "Minimum canonical fields on every wide event: `timestamp`, `level`, `event_name`, `request_id`, `workspace_id` `command`, `outcome`, `duration_ms`, `actor_id` (if available) `service_name`, `service_version`, `commit_hash`, `environment` `repo_count_affected`, `cascade_id` (when applicable) `error_code` and `error_class` on failures.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0519", "guideline": "Missing context - Logs without context are difficult to troubleshoot.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0520", "guideline": "Missing Context: API calls that fail without logging the parameters (sanitized) that caused it.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0521", "guideline": "Missing context: Logs without user, request, or business context.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0522", "guideline": "Monitor memory usage for session maps.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0523", "guideline": "Never log secrets, API keys, or bearer tokens Never log raw user input without sanitization Never use `print()` statements — always use `structlog` Never log at `INFO` level inside tight loops (use `DEBUG` or sample) Avoid string concatenation in log calls — use structlog's key-value binding.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "- **Never** log secrets, API keys, or bearer tokens\n- **Never** log raw user input without sanitization\n- **Never** use `print()` statements — always use `structlog`\n- **Never** log at `INFO` level inside tight loops (use `DEBUG` or sample)\n- **Avoid** string concatenation in log calls — use structlog's key-value binding:\n  ```python\n  # Bad\n  logger.info(f\"Detected anomaly on {service}\")\n  \n  # Good\n  logger.info(\"anomaly_detected\", service=service, anomaly_type=anomaly_type)\n  ```", "repository": "faizanhussainrabbani/autonomous-sre-agent", "url": "https://github.com/faizanhussainrabbani/autonomous-sre-agent/blob/143910db596af769d7dd0fcf10faeea532041e09/docs/project/standards/engineering_standards.md?plain=1", "original_guideline": "Never log secrets, API keys, or bearer tokens Never log raw user input without sanitization Never use `print()` statements — always use `structlog` Never log at `INFO` level inside tight loops (use `DEBUG` or sample) Avoid string concatenation in log calls — use structlog's key-value binding."}]}, {"id": "CG-0524", "guideline": "Never log the configuration that contains secrets.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0525", "guideline": "No additional logging is emitted during normal operation (state transitions, dialog button choices), since the startup probe has already verified the path works.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0526", "guideline": "Note: `vectors` is not included in `repr()`/`print()` output to keep logs readable. Access it directly via `r.vectors` after passing `with_vectors=True` to the search call.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "> **Note:** `vectors` is not included in `repr()`/`print()` output to keep logs readable.\n> Access it directly via `r.vectors` after passing `with_vectors=True` to the search call.\n>\n> ```python\n> results = client.points.search(\"col\", vector=query, limit=5, with_vectors=True)\n> for r in results:\n>     print(r.vectors)   # full vector list\n> ```", "repository": "hackmamba-io/actian-vectorAI-db-beta", "url": "https://github.com/hackmamba-io/actian-vectorAI-db-beta/blob/569af685f86be5f992535e70596a9bd84172fe91/docs/api.md?plain=1", "original_guideline": "Note: `vectors` is not included in `repr()`/`print()` output to keep logs readable. Access it directly via `r.vectors` after passing `with_vectors=True` to the search call."}]}, {"id": "CG-0527", "guideline": "Operator-visible observability (structured logs; optional snapshot/status surface).", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0528", "guideline": "Pass the application logger to the native library loader whether a custom library path is used or the default library is loaded.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "if (Qwen3ASRConfig.customLibrary) {\n            NativeManager.loadLibrary(Paths.get(Qwen3ASRConfig.customLibraryDir), Qwen3ASRFabricClient.LOGGER);\n         } else {\n            NativeManager.loadLibrary(Qwen3ASRFabricClient.LOGGER);\n         }", "repository": "Jaffe2718/Microphone-Text-Input", "url": "https://github.com/Jaffe2718/Microphone-Text-Input/blob/abcc0d38e5e51b060435a36ab46bdcce53851eac/DEV.md?plain=1", "original_guideline": "Pass the application logger to the native library loader whether a custom library path is used or the default library is loaded."}]}, {"id": "CG-0529", "guideline": "Per-Conversation Metrics: Track tokens, API calls, storage Daily Budget Alerts: Notify when 80% of budget reached.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0530", "guideline": "Performance Tracking Log operation timing Monitor resource usage Track message sizes Measure latency.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0531", "guideline": "Periodic (every 5s) debug loop which prints the current pods and metrics.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0532", "guideline": "Populate the error-report message with a stack trace for `StackTraceError`; otherwise use the error or string value.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0533", "guideline": "Prefer to group related information in a single log statement rather than using many of them.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0534", "guideline": "Private Logger logger; @Inject private void setLogger(Logger logger) { this.logger = logger; }.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "private Logger logger;\n\n    @Inject\n    private void setLogger(Logger logger) {\n        this.logger = logger;\n    }", "repository": "whimxiqal/SpongeDocs", "url": "https://github.com/whimxiqal/SpongeDocs/blob/92fcc2e69f3f7df99741256120c1f1772b01b5aa/source/plugin/logging.rst", "original_guideline": "Private Logger logger; @Inject private void setLogger(Logger logger) { this.logger = logger; }."}]}, {"id": "CG-0535", "guideline": "Provide a no-op logger implementation that satisfies the logging interface while emitting no messages and preserving chaining methods.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "// Nop creates a logger which satisfies the interface and does nothing.\nfunc Nop() Logger {\n\treturn &nop{}\n}\n\nfunc (n *nop) Error(msg string, fields ...Field) {\n}\n\nfunc (n *nop) Warn(msg string, fields ...Field) {\n}\n\nfunc (n *nop) Info(msg string, fields ...Field) {\n}\n\nfunc (n *nop) Debug(msg string, fields ...Field) {\n}\n\nfunc (n *nop) With(fields ...Field) Logger {\n\treturn n\n}\n\nfunc (n *nop) Named(name string) Logger {\n\treturn n\n}", "repository": "gordonmleigh/byolog", "url": "https://github.com/gordonmleigh/byolog/blob/bdfbc4ac09769db2056de502dd891a0b2f5fa743/byolog.go", "original_guideline": "Provide a no-op logger implementation that satisfies the logging interface while emitting no messages and preserving chaining methods."}]}, {"id": "CG-0536", "guideline": "Provide an optional structured logger for structured log output.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0537", "guideline": "Put the correlation ID into MDC for request processing and always remove it in a `finally` block to prevent thread-pool context leakage.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "MDC.put(\"correlationId\", correlationId);\n\ntry {\n    chain.doFilter(request, response);\n} finally {\n    MDC.remove(\"correlationId\");  // Always clean up in thread pools\n}", "repository": "Mhmccabe/fitness-functions", "url": "https://github.com/Mhmccabe/fitness-functions/blob/beb605439f926f1aca8fa83d5022505a8aa90a6f/Java/logging-standards/README.md?plain=1", "original_guideline": "Put the correlation ID into MDC for request processing and always remove it in a `finally` block to prevent thread-pool context leakage."}]}, {"id": "CG-0538", "guideline": "Rate-limit tracking: Track the latest rate-limit payload seen in any agent update. Any human-readable presentation of rate-limit data is implementation-defined.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0539", "guideline": "Received an HTTP request URL clientId traceId verb contentType _do not include the payload_.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0540", "guideline": "Received an HTTP request → add anonymized payload.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0541", "guideline": "Record error states.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0542", "guideline": "Represent structured log context as name/value fields.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "// Field represents a field for structured logging.\ntype Field struct {\n\tName  string\n\tValue interface{}\n}\n\n// NewField creates a new field.\nfunc NewField(name string, value interface{}) Field {\n\treturn Field{Name: name, Value: value}\n}", "repository": "gordonmleigh/byolog", "url": "https://github.com/gordonmleigh/byolog/blob/bdfbc4ac09769db2056de502dd891a0b2f5fa743/byolog.go", "original_guideline": "Represent structured log context as name/value fields."}]}, {"id": "CG-0543", "guideline": "Request ID - A unique identifier for tracking requests across services User ID - The identifier of the affected user (when applicable) Service Name - The name of the service generating the log Instance ID - For containerized or scaled applications Version - Software version information.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0544", "guideline": "RequestId enables correlation of all log events for a single request across multiple services. service identifies which microservice produced the log. durationMs enables latency analysis with Insights aggregations. Without these fields, tracing a customer-reported issue across services requires guessing at time windows.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0545", "guideline": "Required context fields for issue-related logs: `issue_id` `issue_identifier`.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0546", "guideline": "Required context for coding-agent session lifecycle logs: `session_id`.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0547", "guideline": "Responded to an HTTP request URL response code clientId duration from time of receipt of HTTP request to response (milliseconds) _do not include the payload_.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0548", "guideline": "Responded to an HTTP request → add payload.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0549", "guideline": "Right away we can see the issue because the logs are easily parsed. Thinking about what kind of issues are likely to occur in production should be at the forefront of your mind while writing the logging statements.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0550", "guideline": "Route DEBUG, INFO, NOTICE, WARN, ERROR, and CRITICAL messages through the logger stored in the context, creating a fallback logger only when the context has none.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "// Debug outputs a debug log message using the logger contained in ctx.\n// If ctx doesn't contain a logger, it uses a new logger.\nfunc Debug(ctx context.Context, msg string, req *HTTPRequest, fields Fields) {\n\tl := GetLogger(ctx)\n\tl.output(levelDebug, msg, req, fields)\n}\n\n// Info outputs an info log message using the logger contained in ctx.\n// If ctx doesn't contain a logger, it uses a new logger.\nfunc Info(ctx context.Context, msg string, req *HTTPRequest, fields Fields) {\n\tl := GetLogger(ctx)\n\tl.output(levelInfo, msg, req, fields)\n}\n\n// Notice outputs a notice log message using the logger contained in ctx.\n// If ctx doesn't contain a logger, it uses a new logger.\nfunc Notice(ctx context.Context, msg string, req *HTTPRequest, fields Fields) {\n\tl := GetLogger(ctx)\n\tl.output(levelNotice, msg, req, fields)\n}\n\n// Warning outputs a warning log message using the logger contained in ctx.\n// If ctx doesn't contain a logger, it uses a new logger.\nfunc Warning(ctx context.Context, msg string, req *HTTPRequest, fields Fields) {\n\tl := GetLogger(ctx)\n\tl.output(levelWarning, msg, req, fields)\n}\n\n// Error outputs an error log message using the logger contained in ctx.\n// If ctx doesn't contain a logger, it uses a new logger.\nfunc Error(ctx context.Context, msg string, req *HTTPRequest, fields Fields) {\n\tl := GetLogger(ctx)\n\tl.output(levelError, msg, req, fields)\n}\n\n// Critical outputs a critical log message using the logger contained in ctx.\n// If ctx doesn't contain a logger, it uses a new logger.\nfunc Critical(ctx context.Context, msg string, req *HTTPRequest, fields Fields) {\n\tl := GetLogger(ctx)\n\tl.output(levelCritical, msg, req, fields)\n}\n\n// Alert outputs an alert log message using the logger contained in ctx.\n// If ctx doesn't contain a logger, it uses a new logger.\nfunc Alert(ctx context.Context, msg string, req *HTTPRequest, fields Fields) {\n\tl := GetLogger(ctx)\n\tl.output(levelAlert, msg, req, fields)\n}\n\n// Emergency outputs an emergency log message using the logger contained in ctx.\n// If ctx doesn't contain a logger, it uses a new logger.\nfunc Emergency(ctx context.Context, msg string, req *HTTPRequest, fields Fields) {\n\tl := GetLogger(ctx)\n\tl.output(levelEmergency, msg, req, fields)\n}", "repository": "fiskaly/golog", "url": "https://github.com/fiskaly/golog/blob/8f9568c0d5c6e53372eed3e9f7ef13ea48b24329/golog.go", "original_guideline": "Route DEBUG, INFO, NOTICE, WARN, ERROR, and CRITICAL messages through the logger stored in the context, creating a fallback logger only when the context has none."}]}, {"id": "CG-0551", "guideline": "Rule of thumb: Logs tell you *what happened*. Metrics tell you *how often* and *how fast*. Traces tell you *where the time went* across service boundaries.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0552", "guideline": "Runtime accounting: Runtime should be reported as a live aggregate at snapshot/render time. Implementations may maintain a cumulative counter for ended sessions and add active-session elapsed time derived from `running` entries (for example `started_at`) when producing a snapshot/status view. Add run duration seconds to the cumulative ended-session runtime when a session ends (normal exit or cancellation/termination). Continuous background ticking of runtime totals is not required.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0553", "guideline": "Sensitive information handling is crucial for most companies. Remember these security and compliance requirements: Do not leak sensitive personal identity information (PII). Do not leak encryption keys or secrets. Ensure the company's privacy policy covers log data. Ensure log providers meet compliance requirements. Ensure data storage duration requirements are met.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0554", "guideline": "Store log records in `usage_logs` with fields `id`, `user_id`, `tweet_id`, `event_type`, `arweave_id`, `created_at`.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "```sql\n   CREATE TABLE usage_logs (\n     id SERIAL PRIMARY KEY,\n     user_id VARCHAR(255) REFERENCES users(id),\n     tweet_id VARCHAR(255) NOT NULL,\n     event_type VARCHAR(50) NOT NULL,\n     arweave_id VARCHAR(255),\n     created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP\n   );\n   ```", "repository": "itsrealkaran/ArkiveNow-Bot", "url": "https://github.com/itsrealkaran/ArkiveNow-Bot/blob/b0b6220fd6279fda99c3cae470468854adb26cfb/docs.md?plain=1", "original_guideline": "Store log records in ving objects in the data store).", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "2", "examples": []}, {"id": "CG-0562", "guideline": "The `JSONFormatter` class converts Python log records into structured JSON format with consistent fields including timestamp, log level, message, and correlation ID.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0563", "guideline": "The fields of `with_fields` add to all logs as is. If any field of with_fields is specified in each log, the field is overridden. If the field's type is *Array*, both with_field value and logging value are merged with `concat` and `uniq`. If the field's type is *Hash*, then values are merged recursively.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "The fields of `with_fields` add to all logs as is.\n\n```ruby\nlogger.with_fields = { version: '1.1.0' }\nlogger.debug(user: { name: 'Taro', age: 19 })\nlogger.info('Hello!', user: { name: 'Jiro' }, version: '2.3')\n```\n\n```json\n{\"name\":\"test\",\"hostname\":\"mint\",\"pid\":30182,\"level\":20,\"time\":\"2017-07-22T20:52:12.332+09:00\",\"v\":0,\"version\":\"1.1.0\",\"msg\":\"No message\",\"user\":{\"name\":\"Taro\",\"age\":19}}\n{\"name\":\"test\",\"hostname\":\"mint\",\"pid\":30308,\"level\":30,\"time\":\"2017-07-22T20:53:54.314+09:00\",\"v\":0,\"version\":\"2.3\",\"user\":{\"name\":\"Jiro\"},\"msg\":\"Hello!\"}\n```\n\nIf any field of with_fields is specified in each log, the field is overridden.\nIf the field's type is *Array*, both with_field value and logging value are merged with `concat` and `uniq`.\n\nIf the field's type is *Hash*, then values are merged recursively.\n\n```ruby\nlogger.with_fields = { version: '1.1.0', user: { name: 'Taro' } }\nlogger.debug(user: { age: 19 })\n```\n\n```json\n{\"name\":\"test\",\"hostname\":\"mint\",\"pid\":30182,\"level\":20,\"time\":\"2017-07-22T20:52:12.332+09:00\",\"v\":0,\"version\":\"1.1.0\",\"msg\":\"No message\",\"user\":{\"name\":\"Taro\",\"age\":19}}\n```", "repository": "tilfin/ougai", "url": "https://github.com/tilfin/ougai/blob/397d07713c93f92a125c7ef6915f23c07df7db63/README.md?plain=1", "original_guideline": "The fields of `with_fields` add to all logs as is. If any field of with_fields is specified in each log, the field is overridden. If the field's type is *Array*, both with_field value and logging value are merged with `concat` and `uniq`. If the field's type is *Hash*, then values are merged recursively."}]}, {"id": "CG-0564", "guideline": "The logger instance is loaded from `context.Context` or passed around as an argument directly.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0565", "guideline": "The logs capture: Server connection events Configuration issues Runtime errors Message exchanges.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0566", "guideline": "The object which was used to call the log() method; this can be any object within the system, since the core code will automatically load logging plugins on behalf of any object.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0567", "guideline": "This is primarily useful for testing (capturing log output).", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0568", "guideline": "TimeKey: \"time\", LevelKey: \"severity\", CallerKey: \"caller\", MessageKey: \"message\", StacktraceKey: \"stacktrace\",.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "TimeKey:        \"time\",\n\ ys\", \"7 days\", \"14 days\", \"30 days\", \"90 days\", \"180 day\", \"365 days\", \"Never Expire\"] -rationaleID: \"r-app-logs\",\"r-audit-logs\",\"r-debug-logs\",\"r-lambda-logs\","}]}, {"id": "CG-0575", "guideline": "Use severity-specific logging: INFO for `user_login` with `user_id`, `extra`; INFO for `api_call` with `endpoint`, `status`, `extra`; INFO for `record_processed` with `record_type`, `extra`.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "```python\n# BAD - Never do this!\nlogger.info(f\"User login: email={email}, password={password}\")\nlogger.info(f\"API call with token: {api_token}\")\nlogger.info(f\"Processing SSN: {ssn}\")\n\n# GOOD - Log safely\nlogger.info(\"user_login\", extra={\"user_id\": user.id})\nlogger.info(\"api_call\", extra={\"endpoint\": \"/users\", \"status\": 200})\nlogger.info(\"record_processed\", extra={\"record_type\": \"user_data\"})\n```", "repository": "adhocteam/cloud-gov-instructions", "url": "https://github.com/adhocteam/cloud-gov-instructions/blob/64a6f40c7c07c5832faa4c9c9379df92b9ab311e/README.md?plain=1", "original_guideline": "Use severity-specific logging: INFO for `user_login` with `user_id`, `extra`; INFO for `api_call` with `endpoint`, `status`, `extra`; INFO for `record_processed` with `record_type`, `extra`."}]}, {"id": "CG-0576", "guideline": "Use structured JSON log entries with fields such as `agent_timings`, `classifier`, `simplifier`, `risk_analyzer`, `benchmark`, `advisor`, `verifier`, `models_used`, `total_analysis_time_ms`, `cache_hit`, `verification_confidence`.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "Every analysis result includes:\n```json\n{\n  \"agent_timings\": {\n    \"classifier\": 850,\n    \"simplifier\": 2100,\n    \"risk_analyzer\": 3200,\n    \"benchmark\": 2800,\n    \"advisor\": 4100,\n    \"verifier\": 2500\n  },\n  \"m  dump", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "```json\n{\n  \"timestamp\": \"2026-01-14T15:30:00.000Z\",\n  \"level\": \"INFO\",\n  \"category\": \"file_operation\",\n  \"action\": \"read\",\n  \"target\": \"/path/to/file.py\",\n  \"result\": \"success\",\n  \"duration_ms\": 45,\n  \"metadata\": {\n    \"lines_read\": 150,\n    \"file_size\": 4096\n  }\n}\n```", "repository": "TheArchitectit/agent-guardrails-template", "url": "https://github.com/TheArchitectit/agent-guardrails-template/blob/139118958cba9c083bf78c29f3efdc0034b24d14/TOC.md?plain=1", "original_guideline": "Use structured JSON log entries with fields such as `timestamp`, `level`, `category`, `action`, `target`, `result`, `duration_ms`, `metadata`, `lines_read`, `file_size`."}]}, {"id": "CG-0585", "guideline": "Use structured JSON log entries with fields such as `timestamp`, `severity`, `service.name`, `service.version`, `environment`, `region`, `operation`, `tenant_id`, `message`, `outcome`, `error.code`, `error.message`, `host.name`, `source.type`, and 5 more.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "```json\n{\n  \"timestamp\": \"2024-01-15T10:30:50.000Z\",\n  \"severity\": \"ERROR\",\n  \"service.name\": \"legacy-gateway-v1\",\n  \"service.version\": \"unknown\",\n  \"environment\": \"production\",\n  \"region\": \"us-east-1\",\n  \"operation\": \"processHL7Message\",\n  \"tenant_id\": \"HOSP-789\",\n  \"message\": \"HL7 message processing failed: invalid segment PID\",\n  \"outcome\": \"failure\",\n  \"error.code\": \"HL7_PARSE_ERROR\",\n  \"error.message\": \"Invalid segment PID at position 3\",\n  \"host.name\": \"legacy-gw-prod-03\",\n  \"source.type\": \"legacy_transformed\",\n  \"source.original_format\": \"plaintext\",\n  \"source.file\": \"/var/log/legacy-gw/gateway.log\",\n  \"source.line_number\": 48291,\n  \"transformation.confidence\": \"high\",\n  \"transformation
