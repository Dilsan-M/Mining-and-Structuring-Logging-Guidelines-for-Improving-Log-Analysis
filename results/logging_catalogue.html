application kwargs into formatted message bodies and preserve exc_info for stack traces.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1447", "guideline": "Move kwargs out of log call kwargs and embed context in the message (e.g., using %-style templates) so values are visible and queryable; do not rely on loguru kwargs as structured fields.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1448", "guideline": "Normalize logging event naming across client and server.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1449", "guideline": "Parse log files into structured records with fields for time, process, level, handle, user, memory, and message so they can be queried as a table.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1450", "guideline": "Pass structured fields according to the logging framework: use `extra={}` with Python stdlib logging, pass keyword arguments directly with structlog, and use keyword arguments with Loguru rather than treating `extra={}` specially.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1451", "guideline": "Prefer JSON logs with fields such as: timestamp level service environment trace_id request_id user_id when allowed message.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1452", "guideline": "Prefer structured data over string concatenation.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1453", "guideline": "Prepend each log message with \"function_name says: \" where function_name is the actual function making the log.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1454", "guideline": "Provide consistent log formats across all modules.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1455", "guideline": "Record audit events as structured JSON entries with fields such as `eventId`, `timestamp`, `version`, `actor`, `id`, `type`, `email`, `ipAddress`, `sessionId`, `mfaVerified`, `action`, `category`, `description`, `target`, and 11 more.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "```python\n# Audit logging service\nimport uuid\nimport json\nfrom datetime import datetime, timezone\nfrom typing import Any\n\nclass AuditLogger:\n    def __init__(self, service_name: str, environment: str):\n        self.service = service_name\n        self.environment = environment\n        self.transport = AuditTransport()  # Sends to immutable store\n\n    def log(\n        self,\n        actor_id: str,\n        actor_type: str,\n        action_type: str,\n        action_category: str,\n        description: str,\n        target_type: str,\n        target_id: str,\n        result_status: str,\n        *,\n        actor_ip: str | None = None,\n        actor_email: str | None = None,\n        session_id: str | None = None,\n        mfa_verified: bool = False,\n        request_id: str | None = None,\n        changes_before: dict | None = None,\n        changes_after: dict | None = None,\n        result_reason: str | None = None,\n        target_name: str | None = None,\n    ) -> str:\n        event_id = str(uuid.uuid7())\n\n        event = {\n            \"eventId\": event_id,\n            \"timestamp\": datetime.now(timezone.utc).isoformat(),\n            \"version\": \"1.0\",\n            \"actor\": {\n                \"id\": actor_id,\n                \"type\": actor_type,\n                \"email\": actor_email,\n                \"ipAddress\": actor_ip,\n                \"sessionId\": session_id,\n                \"mfaVerified\": mfa_verified,\n            },\n            \"action\": {\n                \"type\": action_type,\n                \"category\": action_category,\n                \"description\": description,\n            },\n            \"target\": {\n                \"type\": target_type,\n                \"id\": target_id,\n                \"name\": target_name,\n            },\n            \"result\": {\n                \"status\": result_status,\n                \"reason\": result_reason,\n            },\n            \"context\": {\n                \"service\": self.service,\n                \"environment\": self.environment,\n                \"requestId\": request_id,\n            },\n        }\n\n        if changes_before or changes_after:\n            changed_fields = []\n            if changes_before and changes_after:\n                changed_fields = [\n                    k for k in changes_after\n                    if changes_before.get(k) != changes_after.get(k)\n                ]\n            event[\"changes\"] = {\n                \"before\": changes_before,\n                \"after\": changes_after,\n                \"fields\": changed_fields,\n            }\n\n        # Send to immutable audit store\n        self.transport.send(event)\n\n        return event_id\n\n# Usage\naudit = AuditLogger(service_name=\"user-service\", environment=\"production\")\n\n# Log a role change\naudit.log(\n    actor_id=\"user-42\",\n    actor_type=\"user\",\n    actor_email=\"alice@company.com\",\n    actor_ip=\"203.0.113.42\",\n    action_type=\"update\",\n    action_category=\"admin\",\n    description=\"Changed user role\",\n    target_type=\"user\",\n    target_id=\"user-99\",\n    target_name=\"Bob Williams\",\n    result_status=\"success\",\n    changes_before={\"role\": \"viewer\"},\n    changes_after={\"role\": \"admin\"},\n    mfa_verified=True,\n)\n```", "repository": "ayush-jadaun/knowledge-vault", "url": "https://github.com/ayush-jadaun/knowledge-vault/blob/0131f844f9b77aba044bc84bb1103bd096bf8601/docs/security/compliance/audit-logging.md?plain=1", "original_guideline": "Record audit events as structured JSON entries with fields such as `eventId`, `timestamp`, `version`, `actor`, `id`, `type`, `email`, `ipAddress`, `sessionId`, `mfaVerified`, `action`, `category`, `description`, `target`, and 11 more."}]}, {"id": "CG-1456", "guideline": "Redact authentication headers, cookies, API keys, passwords, direct identifiers, contact and address data, sensitive record fields, and free-text fields before logging; replace matched values with `[REDACTED]`.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "```typescript\nredact: {\n  paths: [\n    // Auth / secrets\n    'req.headers.authorization',\n    'req.headers.cookie',\n    'req.headers[\"x-api-key\"]',\n    'body.password',\n    // Direct identifiers (from doc-03 constituents schema)\n    'body.email',\n    'body.firstName',\n    'body.lastName',\n    'body.preferredName',\n    'body.salutation',\n    'body.emailPrimary',\n    'body.emailSecondary',\n    'body.phonePrimary',\n    'body.phoneMobile',\n    'body.phone',\n    'body.dateOfBirth',\n    'body.nationalId',\n    'body.iban',\n    // Address fields\n    'body.address',\n    'body.address.*',\n    'body.addrLine1',\n    'body.addrLine2',\n    'body.addrPostcode',\n    'body.addrCity',\n    'body.addrCountry',\n    // Contact arrays\n    'body.contacts[*].email',\n    'body.contacts[*].phone',\n    'body.contacts[*].name',\n    'body.contacts[*].firstName',\n    'body.contacts[*].lastName',\n    'body.donors[*].name',\n    // Emergency contacts (third-party PII)\n    'body.emergencyContactName',\n    'body.emergencyContactPhone',\n    // Criminal record data — GDPR Art. 10 special category\n    'body.dbsCheckDate',\n    'body.dbsExpiryDate',\n    'body.dbsReference',\n    // Free-text / arbitrary JSONB fields (may contain PII)\n    'body.notes',\n    'body.customFields',\n    'body.customFields.*',\n    'body.custom_fields',\n    'body.custom_fields.*',\n    'body.relationships[*].notes',\n  ],\n  censor: '[REDACTED]',\n}\n```", "repository": "purposestack/givernance", "url": "https://github.com/purposestack/givernance/blob/5950cbce7ee516a3a869816ccfc6efc7906f3065/.claude/agents/log-analyst.md?plain=1", "original_guideline": "Redact authentication headers, cookies, API keys, passwords, direct identifiers, contact and address data, sensitive record fields, and free-text fields before logging; replace matched values with `[REDACTED]`."}]}, {"id": "CG-1457", "guideline": "Redact sensitive fields recursively before logging, including `password`, `token`, `api_key`, `secret`, `ssn`, `credit_card`.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "```python\nSENSITIVE_FIELDS = ['password', 'token', 'api_key', 'secret', 'ssn', 'credit_card']\n\ndef sanitize_log_data(data):\n    \"\"\"Remove or mask sensitive fields from log data\"\"\"\n    if isinstance(data, dict):\n        sanitized = {}\n        for key, value in data.items():\n            if any(field in key.lower() for field in SENSITIVE_FIELDS):\n                sanitized[key] = '***REDACTED***'\n            else:\n                sanitized[key] = sanitize_log_data(value)\n        return sanitized\n    return data\n```", "repository": "adhocteam/cloud-gov-instructions", "url": "https://github.com/adhocteam/cloud-gov-instructions/blob/64a6f40c7c07c5832faa4c9c9379df92b9ab311e/README.md?plain=1", "original_guideline": "Redact sensitive fields recursively before logging, including `password`, `token`, `api_key`, `secret`, `ssn`, `credit_card`."}]}, {"id": "CG-1458", "guideline": "Remove all tick boxes, emojis, and other decorative characters from log messages.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1459", "guideline": "Replace `console.log` with `logger.info` or `logger.error`.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1460", "guideline": "Replace `print(\"message\")` with `logger.info(\"message\")` — flag for human review.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1461", "guideline": "Replace `System.out.println` with `logger.info(\"event.name\")`.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1462", "guideline": "Replace any use of logger.warn() or logging.warn() with logger.warning() / logging.warning().", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1463", "guideline": "Replace logger.exception() with logger.error() when there is no exception context.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1464", "guideline": "Replace print() with logger calls and embed context in the message body.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1465", "guideline": "Replace string concatenation in log messages with %-style templates and positional args.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1466", "guideline": "Replace string concatenation with `{}` placeholders: `logger.info(\"order.started orderId={}\", orderId)`.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1467", "guideline": "Replace string concatenation with structured logging.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1468", "guideline": "Represent canonical log lines as single-line key-value pairs (`logfmt`) so tools such as Splunk can index individual fields and support field-based filtering, aggregation, and time-series analysis.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1469", "guideline": "RESOLVED: JSON lines to ~/.minutes/logs/, 7-day rotation, `minutes logs` command.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1470", "guideline": "Run `/code-quality` to detect logging anti-patterns like f-string formatting in log calls.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1471", "guideline": "Scattered `println!` / `console.log` in request/command handlers. Per-file logger instances with divergent config. Missing request correlation or missing workspace/cascade context. Inconsistent field naming (`user_id` vs `userId`) across events. Unstructured logs for operational outcomes.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1472", "guideline": "Scattered logging: Multiple `console.log` or `logger.info` calls in request handlers.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1473", "guideline": "Setting `before_log` of logger or child an *lambda* with `data` field, a process can be run before log each output. Adding variable data (like Thread ID) to logging data can be defined in common. Returning `false` in *lambda*, the log is cancelled and does not output. The *before_log* of child logger is run ahead of the parent logger's.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "Setting `before_log` of logger or child an *lambda* with `data` field, a process can be run before log each output.\n\n* Adding variable data (like Thread ID) to logging data can be defined in common.\n* Returning `false` in *lambda*, the log is cancelled and does not output.\n* The *before_log* of child logger is run ahead of the parent logger's.\n\n```ruby\nlogger.before_log = lambda do |data|\n  data[:thread_id] = Thread.current.object_id.to_s(36)\nend\n\nlogger.debug('on main thread')\nThread.new { logger.debug('on another thread') }\n```\n\n```json\n{\"name\":\"main\",\"hostname\":\"mint\",\"pid\":13975,\"level\":20,\"time\":\"2017-08-06T15:35:53.435+09:00\",\"v\":0,\"msg\":\"on main thread\",\"thread_id\":\"gqe0ava6c\"}\n{\"name\":\"main\",\"hostname\":\"mint\",\"pid\":13975,\"level\":20,\"time\":\"2017-08-06T15:35:53.435+09:00\",\"v\":0,\"msg\":\"on another thread\",\"thread_id\":\"gqe0cb14g\"}\n```", "repository": "tilfin/ougai", "url": "https://github.com/tilfin/ougai/blob/397d07713c93f92a125c7ef6915f23c07df7db63/README.md?plain=1", "original_guideline": "Setting `before_log` of logger or child an *lambda* with `data` field, a process can be run before log each output. Adding variable data (like Thread ID) to logging data can be defined in common. Returning `false` in *lambda*, the log is cancelled and does not output. The *before_log* of child logger is run ahead of the parent logger's."}]}, {"id": "CG-1474", "guideline": "Signals: How to handle interpolated logs (include, warn, exclude) interpolated_logs: include.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1475", "guideline": "Stack Traces: Include full stack traces for debugging.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1476", "guideline": "String formatting and expensive computations are only performed when output is enabled.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1477", "guideline": "String Interpolation in Log Messages Problem: String interpolation defeats structured logging and always allocates.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "### String Interpolation in Log Messages\n\n**Problem**: String interpolation defeats structured logging and always allocates.\n\n```csharp\n// BAD: String interpolation\nlogger.LogInformation($\"Processing order {order.Id} for customer {order.CustomerId}\");\n\n// GOOD: Message templates\nlogger.LogInformation(\"Processing order {OrderId} for customer {CustomerId}\",\n    order.Id, order.CustomerId);\n```", "repository": "Postpartum-genushyacinthus29/dotnet-skills", "url": "https://github.com/Postpartum-genushyacinthus29/dotnet-skills/blob/0220509679e131ca2957d79157fa5ee93a439cd0/skills/dotnet-microsoft-extensions/references/anti-patterns.md?plain=1", "original_guideline": "String Interpolation in Log Messages Problem: String interpolation defeats structured logging and always allocates."}]}, {"id": "CG-1478", "guideline": "Structured context is provided (not string interpolation).", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1479", "guideline": "Structured JSON enables CloudWatch Logs Insights to parse and query specific fields without regex. `filter level = 'ERROR' | stats count(*) by service` is only possible with structured logs. Unstructured text requires regex parsing which is slow, error-prone, and can't be used for metric filters or alarms.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1480", "guideline": "Structured JSON logs only. Log field naming: `snake_case`. Log levels: `info` and `error` only for canonical events. No free-form string-only log lines in core paths.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1481", "guideline": "Structured JSON with consistent field schema.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1482", "guideline": "Structured Logging Over Plain Text: Always use structured formats (JSON, key-value pairs) instead of plain text logs.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1483", "guideline": "Structured Logging Use consistent formats Include context Add timestamps Track request IDs Error Handling Log stack traces Include error context Track error patterns Monitor recovery Performance Tracking Log operation timing Monitor resource usage Track message sizes Measure latency.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "2", "examples": []}, {"id": "CG-1484", "guideline": "Structured Logging Use consistent formats Include context Add timestamps Track request IDs.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1485", "guideline": "Structured Logging: Use `slog`. Prefer passing key-value pairs: `logger.Info(\"message\", \"key\", value)`.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1486", "guideline": "The `options` object can hold any of the following attributes: `disabled`, `interactive`, `logLevel`, `secrets`, `stream`, `scope` and `types`.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1487", "guideline": "The `tracing` event macros support passing the event message itself in a few ways, but we prefer the fields/message/message arguments order.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "The `tracing` event macros support passing the event message itself in a few ways, but we prefer the\n**fields/message/message arguments** order:\n\n```rust\n// Don't do this:\ninfo!(message = \"Something happened.\");\n// Do this instead:\ninfo!(\"Something happened.\");\n\n// Don't do this:\ndebug!(%client_id, message = \"Client entered authentication phase.\");\ndebug!(message = \"Client entered authentication phase.\", %client_id);\n// Do this instead:\ndebug!(%client_id, \"Client entered authentication phase.\");\n```", "repository": "deckhouse/3p-vector", "url": "https://github.com/deckhouse/3p-vector/blob/be9f229dd56b483b5223c3da57ac9f690ddc0a13/STYLE.md?plain=1", "original_guideline": "The `tracing` event macros support passing the event message itself in a few ways, but we prefer the fields/message/message arguments order."}]}, {"id": "CG-1488", "guideline": "The code generation system automatically extracts parameters from message templates using a regular expression pattern. Parameters are formatted as `{ParameterName}` or `{ParameterName:Type}` where: `ParameterName` is converted to camelCase for method parameters `Type` defines the parameter type (defaults to `string?` if not specified) For example, a template like `\"User {UserId:Guid} uploaded {FileCount:int} files\"` generates parameters `Guid userId, int fileCount`.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1489", "guideline": "The Guice module used during the initialization of plugins has a plugin-scoped logger. This allows you to annotate a field, method, or constructor with ``@Inject`` to get the logger for your plugin, which is pre-configured with the correct plugin ID.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1490", "guideline": "The support for fields as a backing-store in conjunction with Golf support enable the ability to seamlessly integrate with the structured logging framework Logrus (https://github.com/Sirupsen/logrus).", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1491", "guideline": "This is where the use of a well-thought-out banner comes in. Every log message should include the uniform banner to make it easy to read and understand for all team members. Here are some of the things that should be included in a good log banner.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1492", "guideline": "To create a custom logger define an `options` object yielding a `types` field with the logger data and pass it as argument to a new signale instance.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1493", "guideline": "To create a scoped logger from scratch, define the `scope` field inside the `options` object and pass it as argument to a new signale instance.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1494", "guideline": "Treat high-cardinality fields carefully: index them only in suitable backends, do not use them as Datadog tags, use short retention, avoid faceting or aggregation, and query by exact match; never index request bodies or use stack traces as tags/facets, and consider hashing device IDs when raw values are unnecessary.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1495", "guideline": "Use %-style formatting instead of string concatenation in log messages to preserve template stability for aggregation.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1496", "guideline": "Use `logger.exception()` inside `except` → captures stack trace.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1497", "guideline": "Use `signale.complete()` for completed-task messages and, when needed, add a custom prefix, suffix, and formatted message arguments.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "2", "examples": [{"reason": "```js\nconst signale = require('signale');\n\nsignale.success('Operation successful');\nsignale.debug('Hello', 'from', 'L59');\nsignale.pending('Write release notes for %s', '1.2.0');\nsignale.fatal(new Error('Unable to acquire lock'));\nsignale.watch('Recursively watching build directory...');\nsignale.complete({prefix: '[task]', message: 'Fix issue #59', suffix: '(@klaudiosinani)'});\n```", "repository": "klaudiosinani/signale", "url": "https://github.com/klaudiosinani/signale/blob/a0119bb6b3b4d63b51318585c06d519c54897333/readme.md?plain=1", "original_guideline": "Use `signale.complete()` for completed-task messages and, when needed, add a custom prefix, suffix, and formatted message arguments."}, {"reason": "```js\nconst signale = require('signale');\n\nsignale.complete({prefix: '[task]', message: 'Fix issue #59', suffix: '(@klaudiosinani)'});\n//=> [task] ☒  complete  Fix issue #59 (@klaudiosinani)\n\nsignale.complete({prefix: '[task]', message: ['Fix issue #%d', 59], suffix: '(@klaudiosinani)'});\n//=> [task] ☒  complete  Fix issue #59 (@klaudiosinani)\n```", "repository": "klaudiosinani/signale", "url": "https://github.com/klaudiosinani/signale/blob/a0119bb6b3b4d63b51318585c06d519c54897333/readme.md?plain=1", "original_guideline": "Use `signale.complete()` for completed-task messages and, when needed, add a custom prefix, suffix, and formatted message arguments."}]}, {"id": "CG-1498", "guideline": "Use `signale.success()` to log successful operations; pass message arguments or format placeholders when values must be inserted.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "```js\nconst signale = require('signale');\n\nsignale.success('Successful operation');\n//=> ✔  success  Successful operation\n\nsignale.success('Successful', 'operation');\n//=> ✔  success  Successful operation\n\nsignale.success('Successful %s', 'operation');\n//=> ✔  success  Successful operation\n```", "repository": "klaudiosinani/signale", "url": "https://github.com/klaudiosinani/signale/blob/a0119bb6b3b4d63b51318585c06d519c54897333/readme.md?plain=1", "original_guideline": "Use `signale.success()` to log successful operations; pass message arguments or format placeholders when values must be inserted."}]}, {"id": "CG-1499", "guideline": "Use `signale.time()` and `signale.timeEnd()` to measure and log elapsed time, using labels when multiple timers need to be identified.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "2", "examples": [{"reason": "```js\nconst signale = require('signale');\n\nsignale.time();\n//=> ▶  timer_0  Initialized timer...\n\nsignale.time();\n//=> ▶  timer_1  Initialized timer...\n\nsignale.time('label');\n//=> ▶  label    Initialized timer...\n```", "repository": "klaudiosinani/signale", "url": "https://github.com/klaudiosinani/signale/blob/a0119bb6b3b4d63b51318585c06d519c54897333/readme.md?plain=1", "original_guideline": "Use `signale.time()` and `signale.timeEnd()` to measure and log elapsed time, using labels when multiple timers need to be identified."}, {"reason": "```js\nconst signale = require('signale');\n\nsignale.time();\n//=> ▶  timer_0  Initialized timer...\n\nsignale.time();\n//=> ▶  timer_1  Initialized timer...\n\nsignale.time('label');\n//=> ▶  label    Initialized timer...\n\nsignale.timeEnd();\n//=> ◼  timer_1  Timer run for: 2ms\n\nsignale.timeEnd();\n//=> ◼  timer_0  Timer run for: 2ms\n\nsignale.timeEnd('label');\n//=> ◼  label    Timer run for: 2ms\n```", "repository": "klaudiosinani/signale", "url": "https://github.com/klaudiosinani/signale/blob/a0119bb6b3b4d63b51318585c06d519c54897333/readme.md?plain=1", "original_guideline": "Use `signale.time()` and `signale.timeEnd()` to measure and log elapsed time, using labels when multiple timers need to be identified."}]}, {"id": "CG-1500", "guideline": "Use a consistent timestamp format (`YYYY-MM-DD`) for all log entries.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1501", "guideline": "Use consistent formatting: command on one line, brief result/status below.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1502", "guideline": "Use framework-appropriate field passing: stdlib uses extra={}, structlog expects keyword args at top level.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1503", "guideline": "Use ISO 8601 (YYYY-MM-DDTHH:MM:SSZ) for timestamps to ensure consistency across your logging infrastructure.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1504", "guideline": "Use JSON as the structured log format.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "9", "examples": []}, {"id": "CG-1505", "guideline": "Use lambda for log messages: Always use the lambda syntax for log messages to avoid string concatenation when the log level is disabled.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1506", "guideline": "Use lazy formatting. Write `logger.info(\"x=%s\", x)` not `logger.info(f\"x={x}\")`. The f-string evaluates even when the log level is disabled.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1507", "guideline": "Use logger.error() outside of except blocks; reserve logger.exception() for use inside except blocks where exception context exists.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1508", "guideline": "Use lowercase dot-separated actions, such as `project.created`.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1509", "guideline": "Use machine-parseable key-value logs with timestamp, severity, service name/version, environment, and message; namespace fields consistently, index but do not tag high-cardinality IDs, never log PHI/PII, separate event-journal data, and mark transformed legacy logs with source and confidence metadata.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1510", "guideline": "Use Pino rather than `console.log()` or Winston in Fastify; log only safe request/response fields, redact PII and use opaque IDs, default production to INFO, use child loggers, and propagate tenant and correlation IDs on every log line.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1511", "guideline": "Use plain text only for clarity and consistency.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1512", "guideline": "Use Rust `tracing` event macros matching the intended level (`trace!`, `debug!`, `info!`, `warn!`, `error!`), and combine clear messages with structured fields such as byte counts, client addresses, and error details.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "For logging, we use `tracing`'s event macros which should look very similar to almost all other\nlogging libraries, with names that emulate the logging level being used i.e. `info!(\"A wild log has\nappeared.\");`.\n\nAll of tracing's event macros -- `trace!`, `debug!`, `info!`, `warn!`, and `error!` -- support the\nsame argument format, which allows logging in some common ways:\n\n```rust\n// Basic string literal message, no formatting:\ninfo!(\"Server has started.\");\n\n// A formatted message, with the same formatting support as `println!`/`format!`:\ndebug!(\"User connected: {}\", username);\n\n// Adding structured fields to the even, mixing and matching the message format:\ntrace!(bytes_sent = 22, \"Sent heartbeat packet to client.\")`\nerror!(client_addr = %conn.get_ref().peer_addr, \"Client actor received malformed packet: {}\", parse_err.to_string())\n```\n\nWhile this does not cover all the permutations of what the macros in `tracing` support, these\nexamples represent the preferred style of using the macros.", "repository": "deckhouse/3p-vector", "url": "https://github.com/deckhouse/3p-vector/blob/be9f229dd56b483b5223c3da57ac9f690ddc0a13/STYLE.md?plain=1", "original_guideline": "Use Rust `tracing` event macros matching the intended level (`trace!`, `debug!`, `info!`, `warn!`, `error!`), and combine clear messages with structured fields such as byte counts, client addresses, and error details."}]}, {"id": "CG-1513", "guideline": "Use scoped Signale loggers to attach one or more scope labels to related log entries.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "```js\nconst signale = require('signale');\n\nconst foo = signale.scope('foo'); \nconst fooBar = signale.scope('foo', 'bar');\n\nfoo.success('foo');\n//=> [foo] › ✔  success  foo\n\nfooBar.success('foo bar');\n//=> [foo] [bar] › ✔  success  foo bar\n```", "repository": "klaudiosinani/signale", "url": "https://github.com/klaudiosinani/signale/blob/a0119bb6b3b4d63b51318585c06d519c54897333/readme.md?plain=1", "original_guideline": "Use scoped Signale loggers to attach one or more scope labels to related log entries."}]}, {"id": "CG-1514", "guideline": "Use stable, explicit structured-field names: dot-separated namespaces, snake_case for multi-word fields, consistent prefixes such as `error.` and `k8s.`, no spaces or special characters, specific non-abbreviated names, and OpenTelemetry semantic conventions where available.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1515", "guideline": "Use structured contextual fields instead of interpolating contextual values into log-message strings.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "Always include structured context rather than string interpolation:\n\n```ts\n// Good\nlogger.info('Order processed', { orderId, duration, itemCount });\n\n// Bad\nlogger.info(`Order ${orderId} processed in ${duration}ms with ${itemCount} items`);\n```", "repository": "woojubb/robota", "url": "https://github.com/woojubb/robota/blob/040afd5d99d2a7c01bbb36335feaffa5f398ddf5/.agents/skills/logging-level-guide/SKILL.md?plain=1", "original_guideline": "Use structured contextual fields instead of interpolating contextual values into log-message strings."}]}, {"id": "CG-1516", "guideline": "Use structured JSON format - Easier to parse and analyze.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1517", "guideline": "Use structured JSON log entries with fields such as `brokerage-project-x-enable-logging`, `brokerage-project-x-log-level`.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "Enable verbose logging for troubleshooting:\n```json\n{\n  \"brokerage-project-x-enable-logging\": true,\n  \"brokerage-project-x-log-level\": \"Debug\"\n}\n```", "repository": "adammarquette/Lean.Brokerages.ProjectX", "url": "https://github.com/adammarquette/Lean.Brokerages.ProjectX/blob/250b39be897440a5c2fd57cd4f113e110821c93c/PRD.md?plain=1", "original_guideline": "Use structured JSON log entries with fields such as `brokerage-project-x-enable-logging`, `brokerage-project-x-log-level`."}]}, {"id": "CG-1518", "guideline": "Use structured JSON log entries with fields such as `brute_force`, `threshold`, `window`, `severity`, `privilege_escalation`, `data_exfiltration`, `alert_id`, `rule`, `event`, `timestamp`, `status`.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "### **Smart Alerting Implementation:**\n\n```python\nclass SecurityAlertManager:\n    def __init__(self):\n        self.alert_rules = {\n            \"brute_force\": {\n                \"threshold\": 5,\n                \"window\": 300,  # 5 minutes\n                \"severity\": \"HIGH\"\n            },\n            \"privilege_escalation\": {\n                \"threshold\": 1,\n                \"window\": 1,\n                \"severity\": \"CRITICAL\"\n            },\n            \"data_exfiltration\": {\n                \"threshold\": 1000,  # 1000 records\n                \"window\": 3600,     # 1 hour\n                \"severity\": \"CRITICAL\"\n            }\n        }\n    \n    def evaluate_event(self, event):\n        for rule_name, rule in self.alert_rules.items():\n            if self.matches_pattern(event, rule):\n                self.trigger_alert(rule_name, event, rule[\"severity\"])\n    \n    def trigger_alert(self, rule_name, event, severity):\n        alert = {\n            \"alert_id\": uuid.uuid4(),\n            \"rule\": rule_name,\n            \"severity\": severity,\n            \"event\": event,\n            \"timestamp\": datetime.utcnow(),\n            \"status\": \"NEW\"\n        }\n        \n        # Send to appropriate channels based on severity\n        if severity == \"CRITICAL\":\n            self.send_immediate_notification(alert)\n        elif severity == \"HIGH\":\n            self.send_priority_notification(alert)\n        \n        self.log_alert(alert)\n```", "repository": "chuckmccullough85/UMBCWebsec", "url": "https://github.com/chuckmccullough85/UMBCWebsec/blob/eeca670d060e8676713677a1e18006ad3290f47e/chapter9/chapter9_event_logging_slides.md?plain=1", "original_guideline": "Use structured JSON log entries with fields such as `brute_force`, `threshold`, `window`, `severity`, `privilege_escalation`, `data_exfiltration`, `alert_id`, `rule`, `event`, `timestamp`, `status`."}]}, {"id": "CG-1519", "guideline": "Use structured JSON log entries with fields such as `event`, `user_id`, `source_ip`, `reason`, `timestamp`, `password_attempted`, `ssn`, `credit_card`.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "### **Log Message Design Principles:**\n\n```python\n# ✅ GOOD: Informative but safe\n{\n    \"event\": \"login_failed\",\n    \"user_id\": \"user123\",\n    \"source_ip\": \"192.168.1.100\",\n    \"reason\": \"invalid_password\",\n    \"timestamp\": \"2024-07-26T10:30:15Z\"\n}\n\n# ❌ BAD: Contains sensitive information\n{\n    \"event\": \"login_failed\", \n    \"user_id\": \"user123\",\n    \"password_attempted\": \"mypassword123\",  # NEVER LOG THIS!\n    \"ssn\": \"123-45-6789\",                   # NEVER LOG THIS!\n    \"credit_card\": \"4111111111111111\"       # NEVER LOG THIS!\n}\n```", "repository": "chuckmccullough85/UMBCWebsec", "url": "https://github.com/chuckmccullough85/UMBCWebsec/blob/eeca670d060e8676713677a1e18006ad3290f47e/chapter9/chapter9_event_logging_slides.md?plain=1", "original_guideline": "Use structured JSON log entries with fields such as `event`, `user_id`, `source_ip`, `reason`, `timestamp`, `password_attempted`, `ssn`, `credit_card`."}]}, {"id": "CG-1520", "guideline": "Use structured JSON log entries with fields such as `eventId`, `timestamp`, `version`, `actor`, `id`, `type`, `email`, `ipAddress`, `mfaVerified`, `action`, `category`, `description`, `target`, `result`, and 6 more.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "```json\n{\n  \"eventId\": \"019536a4-8f2e-7c3b-9d5e-3b2c4d5e6f7a\",\n  \"timestamp\": \"2026-03-20T14:24:01.456Z\",\n  \"version\": \"1.0\",\n  \"actor\": {\n    \"id\": \"user-77\",\n    \"type\": \"user\",\n    \"email\": \"mallory@external.com\",\n    \"ipAddress\": \"198.51.100.99\",\n    \"mfaVerified\": false\n  },\n  \"action\": {\n    \"type\": \"read\",\n    \"category\": \"data_access\",\n    \"description\": \"Attempted to access payment records\"\n  },\n  \"target\": {\n    \"type\": \"payment_record\",\n    \"id\": \"pay-5001\"\n  },\n  \"result\": {\n    \"status\": \"denied\",\n    \"reason\": \"Insufficient permissions: requires role 'payment_admin'\"\n  },\n  \"context\": {\n    \"service\": \"payment-service\",\n    \"environment\": \"production\",\n    \"requestId\": \"req-def456\"\n  }\n}\n```", "repository": "ayush-jadaun/knowledge-vault", "url": "https://github.com/ayush-jadaun/knowledge-vault/blob/0131f844f9b77aba044bc84bb1103bd096bf8601/docs/security/compliance/audit-logging.md?plain=1", "original_guideline": "Use structured JSON log entries with fields such as `eventId`, `timestamp`, `version`, `actor`, `id`, `type`, `email`, `ipAddress`, `mfaVerified`, `action`, `category`, `description`, `target`, `result`, and 6 more."}]}, {"id": "CG-1521", "guideline": "Use structured JSON log entries with fields such as `eventId`, `timestamp`, `version`, `actor`, `id`, `type`, `email`, `ipAddress`, `userAgent`, `sessionId`, `mfaVerified`, `action`, `category`, `description`, and 13 more.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "```json\n{\n  \"eventId\": \"019536a4-7e3d-7b1a-8c4d-2a1b3c4d5e6f\",\n  \"timestamp\": \"2026-03-20T14:23:45.123Z\",\n  \"version\": \"1.0\",\n  \"actor\": {\n    \"id\": \"user-42\",\n    \"type\": \"user\",\n    \"email\": \"alice@company.com\",\n    \"ipAddress\": \"203.0.113.42\",\n    \"userAgent\": \"Mozilla/5.0...\",\n    \"sessionId\": \"sess-abc123\",\n    \"mfaVerified\": true\n  },\n  \"action\": {\n    \"type\": \"update\",\n    \"category\": \"data_modification\",\n    \"description\": \"Updated user profile\"\n  },\n  \"target\": {\n    \"type\": \"user_profile\",\n    \"id\": \"user-99\",\n    \"name\": \"Bob Williams\"\n  },\n  \"result\": {\n    \"status\": \"success\",\n    \"statusCode\": 200\n  },\n  \"context\": {\n    \"service\": \"user-service\",\n    \"environment\": \"production\",\n    \"requestId\": \"req-xyz789\"\n  },\n  \"changes\": {\n    \"before\": { \"role\": \"viewer\" },\n    \"after\": { \"role\": \"admin\" },\n    \"fields\": [\"role\"]\n  }\n}\n```", "repository": "ayush-jadaun/knowledge-vault", "url": "https://github.com/ayush-jadaun/knowledge-vault/blob/0131f844f9b77aba044bc84bb1103bd096bf8601/docs/security/compliance/audit-logging.md?plain=1", "original_guideline": "Use structured JSON log entries with fields such as `eventId`, `timestamp`, `version`, `actor`, `id`, `type`, `email`, `ipAddress`, `userAgent`, `sessionId`, `mfaVerified`, `action`, `category`, `description`, and 13 more."}]}, {"id": "CG-1522", "guideline": "Use structured JSON log entries with fields such as `source`, `timestamp`, `event_type`, `severity`, `user_id`, `source_ip`, `details`, `raw_log`.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "### **SIEM Integration Example:**\n\n```python\nclass SIEMIntegration:\n    def __init__(self, siem_endpoint, api_key):\n        self.siem_endpoint = siem_endpoint\n        self.api_key = api_key\n        \n    def send_security_event(self, event):\n        \"\"\"Send structured event to SIEM\"\"\"\n        siem_event = {\n            \"source\": \"webapp\",\n            \"timestamp\": event[\"timestamp\"],\n            \"event_type\": event[\"event_type\"],\n            \"severity\": self.map_severity(event[\"severity\"]),\n            \"user_id\": event.get(\"user_id\"),\n            \"source_ip\": event.get(\"source_ip\"),\n            \"details\": event.get(\"details\", {}),\n            \"raw_log\": json.dumps(event)\n        }\n        \n        try:\n            response = requests.post(\n                f\"{self.siem_endpoint}/events\",\n                headers={\"Authorization\": f\"Bearer {self.api_key}\"},\n                json=siem_event,\n                timeout=5\n            )\n            \n            if response.status_code != 200:\n                self.handle_siem_error(response, siem_event)\n                \n        except requests.RequestException as e:\n            # Fallback to local logging if SIEM unavailable\n            local_logger.error(f\"SIEM unavailable: {e}\")\n            self.log_locally(siem_event)\n```", "repository": "chuckmccullough85/UMBCWebsec", "url": "https://github.com/chuckmccullough85/UMBCWebsec/blob/eeca670d060e8676713677a1e18006ad3290f47e/chapter9/chapter9_event_logging_slides.md?plain=1", "original_guideline": "Use structured JSON log entries with fields such as `source`, `timestamp`, `event_type`, `severity`, `user_id`, `source_ip`, `details`, `raw_log`."}]}, {"id": "CG-1523", "guideline": "Use structured JSON log entries with fields such as `timestamp`, `detection_point`, `severity`, `user_id`, `source_ip`, `user_agent`, `request_data`, `response_actions`.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "### **Implementation Example:**\n\n```python\nclass AppSensorResponseManager:\n    def __init__(self):\n        self.response_rules = {\n            'IE1': ['ASR-A', 'ASR-D'],  # XSS: Log and block request\n            'IE2': ['ASR-A', 'ASR-D', 'ASR-E'],  # SQLi: Log, block, lock account\n            'AE1': ['ASR-A'],  # Failed password: Log only\n            'AE2': ['ASR-A', 'ASR-F'],  # Multiple failures: Log and block IP\n        }\n    \n    def execute_response(self, detection_point, event_data):\n        \"\"\"Execute appropriate response actions\"\"\"\n        responses = self.response_rules.get(detection_point, ['ASR-A'])\n        \n        for response in responses:\n            if response == 'ASR-A':\n                self.log_security_event(detection_point, event_data)\n            elif response == 'ASR-D':\n                self.block_request(event_data['request_id'])\n            elif response == 'ASR-E':\n                self.lock_user_account(event_data['user_id'])\n            elif response == 'ASR-F':\n                self.block_ip_address(event_data['source_ip'])\n    \n    def log_security_event(self, detection_point, event_data):\n        \"\"\"Log the security event with full context\"\"\"\n        security_event = {\n            \"timestamp\": datetime.utcnow().isoformat(),\n            \"detection_point\": detection_point,\n            \"severity\": self.get_severity(detection_point),\n            \"user_id\": event_data.get('user_id'),\n            \"source_ip\": event_data.get('source_ip'),\n            \"user_agent\": event_data.get('user_agent'),\n            \"request_data\": event_data.get('request_data'),\n            \"response_actions\": self.response_rules[detection_point]\n        }\n        \n        logger.warning(f\"AppSensor Detection: {json.dumps(security_event)}\")\n```", "repository": "chuckmccullough85/UMBCWebsec", "url": "https://github.com/chuckmccullough85/UMBCWebsec/blob/eeca670d060e8676713677a1e18006ad3290f47e/chapter9/chapter9_event_logging_slides.md?plain=1", "original_guideline": "Use structured JSON log entries with fields such as `timestamp`, `detection_point`, `severity`, `user_id`, `source_ip`, `user_agent`, `request_data`, `response_actions`."}]}, {"id": "CG-1524", "guideline": "Use structured JSON log entries with fields such as `timestamp`, `level`, `category`, `action`, `target`, `result`, `duration_ms`, `metadata`, `lines_read`, `file_size`.", "dimension":
