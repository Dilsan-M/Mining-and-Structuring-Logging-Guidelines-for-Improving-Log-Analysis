:48.836+09:00\",\"v\":0,\"msg\":\"Unexpected!\",\"err\":{\"name\":\"StandardError\",\"message\":\"fatal error\",\"stack\":\"main.rb:12:in `<main>'\"}}\n```", "repository": "tilfin/ougai", "url": "https://github.com/tilfin/ougai/blob/397d07713c93f92a125c7ef6915f23c07df7db63/README.md?plain=1", "original_guideline": "Use structured logging and include fields `rescue`."}, {"reason": "```ruby\nbegin\n  raise StandardError, 'some error'\nrescue => ex\n  logger.error(ex, error_id: 999)\nend\n```\n\n```json\n{\"name\":\"main\",\"hostname\":\"mint\",\"pid\":13962,\"level\":50,\"time\":\"2016-10-28T23:44:52.144+09:00\",\"v\":0,\"error_id\":999,\"err\":{\"name\":\"StandardError\",\"message\":\"some error\",\"stack\":\"main.rb:40:in `<main>'\"}}\n```", "repository": "tilfin/ougai", "url": "https://github.com/tilfin/ougai/blob/397d07713c93f92a125c7ef6915f23c07df7db63/README.md?plain=1", "original_guideline": "Use structured logging and include fields `rescue`."}]}, {"id": "CG-1535", "guideline": "Use structured logging and include fields `self.previous_hash`, `previousHash`, `sequence`, `event_bytes`, `current_hash`, `previous_hash`, `broken_links`, `index`, `eventId`, `expected_previous`, `actual_previous`, `stored_hash`, and 4 more.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "```python\n# Hash-chaining for tamper-evident audit logs\nimport hashlib\nimport json\n\nclass TamperEvidentAuditLog:\n    def __init__(self):\n        self.previous_hash = \"0\" * 64  # Genesis hash\n\n    def append_event(self, event: dict) -> dict:\n        \"\"\"Append an event with cryptographic chain linking.\"\"\"\n        # Include the previous hash in the event\n        event[\"_chain\"] = {\n            \"previousHash\": self.previous_hash,\n            \"sequence\": self._get_next_sequence(),\n        }\n\n        # Compute hash of this event (including the previous hash)\n        event_bytes = json.dumps(event, sort_keys=True).encode()\n        current_hash = hashlib.sha256(event_bytes).hexdigest()\n        event[\"_chain\"][\"hash\"] = current_hash\n\n        # Store the event\n        self._store(event)\n\n        # Update chain\n        self.previous_hash = current_hash\n\n        return event\n\n    def verify_chain(self, events: list[dict]) -> dict:\n        \"\"\"Verify the integrity of the audit log chain.\"\"\"\n        previous_hash = \"0\" * 64\n        broken_links = []\n\n        for i, event in enumerate(events):\n            # Check that the event references the correct previous hash\n            if event[\"_chain\"][\"previousHash\"] != previous_hash:\n                broken_links.append({\n                    \"index\": i,\n                    \"eventId\": event[\"eventId\"],\n                    \"expected_previous\": previous_hash,\n                    \"actual_previous\": event[\"_chain\"][\"previousHash\"],\n                })\n\n            # Verify this event's hash\n            stored_hash = event[\"_chain\"].pop(\"hash\")\n            computed_hash = hashlib.sha256(\n                json.dumps(event, sort_keys=True).encode()\n            ).hexdigest()\n            event[\"_chain\"][\"hash\"] = stored_hash\n\n            if computed_hash != stored_hash:\n                broken_links.append({\n                    \"index\": i,\n                    \"eventId\": event[\"eventId\"],\n                    \"issue\": \"Event content has been modified\",\n                })\n\n            previous_hash = stored_hash\n\n        return {\n            \"chain_valid\": len(broken_links) == 0,\n            \"events_checked\": len(events),\n            \"broken_links\": broken_links,\n        }\n```", "repository": "ayush-jadaun/knowledge-vault", "url": "https://github.com/ayush-jadaun/knowledge-vault/blob/0131f844f9b77aba044bc84bb1103bd096bf8601/docs/security/compliance/audit-logging.md?plain=1", "original_guideline": "Use structured logging and include fields `self.previous_hash`, `previousHash`, `sequence`, `event_bytes`, `current_hash`, `previous_hash`, `broken_links`, `index`, `eventId`, `expected_previous`, `actual_previous`, `stored_hash`, and 4 more."}]}, {"id": "CG-1536", "guideline": "Use structured logging and include fields `signals`, `interpolated_logs`, `DIFFDASH_INTERPOLATED_LOGS`.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "Control how interpolated logs are handled in dashboards:\n\n```yaml\nsignals:\n  interpolated_logs: exclude  # Options: include, warn, exclude\n```\n\n| Value | Behavior |\n|-------|----------|\n| `include` | Include all logs in dashboard (default) |\n| `warn` | Include all, but show CLI warning suggesting structured logging |\n| `exclude` | Exclude interpolated logs from dashboard |\n\n**Environment variable:** `DIFFDASH_INTERPOLATED_LOGS`\n\n```bash\n# Exclude interpolated logs via env var\nDIFFDASH_INTERPOLATED_LOGS=exclude diffdash grafana\n```", "repository": "rossme/diffdash", "url": "https://github.com/rossme/diffdash/blob/cdc89a3381495a786d3ac8afe0a3fb4c0bdb7beb/DOCS.md?plain=1", "original_guideline": "Use structured logging and include fields `signals`, `interpolated_logs`, `DIFFDASH_INTERPOLATED_LOGS`."}]}, {"id": "CG-1537", "guideline": "Use structured logging and include fields `tracing`, `user_id`, `operation`, `duration_ms`.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "**PII-safe structured logs:**\n```rust\n// ✅ No sensitive data, structured fields\ntracing::info!(\n    user_id = %user_id,\n    operation = \"create_user\", \n    duration_ms = duration.as_millis(),\n    \"User operation completed\"\n);\n```", "repository": "AIDEUSPRO/starscalendars", "url": "https://github.com/AIDEUSPRO/starscalendars/blob/da6c98e69967057afbda9bb2767ac6afd2640364/anti.md?plain=1", "original_guideline": "Use structured logging and include fields `tracing`, `user_id`, `operation`, `duration_ms`."}]}, {"id": "CG-1538", "guideline": "Use structured logging and include fields `tracing`.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "- println!/eprintln!/dbg!:\n```rust\n// ❌ println!(\"...\"), eprintln!(\"...\"), dbg!(x)\n// ✅ structured logs\ntracing::info!(event = \"...\", key = %value, \"message\");\ntracing::error!(error = ?err, \"failure\");\n```", "repository": "AIDEUSPRO/starscalendars", "url": "https://github.com/AIDEUSPRO/starscalendars/blob/da6c98e69967057afbda9bb2767ac6afd2640364/anti.md?plain=1", "original_guideline": "Use structured logging and include fields `tracing`."}]}, {"id": "CG-1539", "guideline": "Use structured logging fields to record variable arguments is REQUIRED (as opposed to using format strings).", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1540", "guideline": "Use structured logging for all trading operations. Include context like market IDs, order IDs, and amounts.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1541", "guideline": "Use structured logging with consistent fields.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1542", "guideline": "Use structured logging with Logrus so error details can be captured as structured fields instead of only formatted strings.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1543", "guideline": "Use structured logging with separate contextual fields instead of embedding values in plain-text log messages.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "```python\n# Plain text logging (not recommended)\nlogger.info(\"User 123 made a purchase of $59.99 for product XYZ\")\n\n# Structured logging (recommended)\nlogger.info(\"User made purchase\", {\n    \"userId\": \"123\",\n    \"amount\": 59.99,\n    \"productId\": \"XYZ\",\n    \"timestamp\": \"2023-05-15T14:22:31Z\"\n})\n```", "repository": "Compile-N-Run/Compile-N-Run", "url": "https://github.com/Compile-N-Run/Compile-N-Run/blob/f0fe327e13fe8f6a553e835512d3a25f12a155b3/docs/observability/loki/17-best-practices/0-logging-standards.mdx", "original_guideline": "Use structured logging with separate contextual fields instead of embedding values in plain-text log messages."}]}, {"id": "CG-1544", "guideline": "Use structured logging, preferably in JSON format.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "5", "examples": [{"reason": "**Logger**: `internal/platform/logger/` - structured logging (Debug, Info, Warn, Error)\n\n```go\nlgr.Info(\"Starting service\", logger.String(\"module\", \"auth\"))\nlgr.Error(\"Failed operation\", logger.Error(err), logger.String(\"user_id\", uid))\n```", "repository": "ertval/forum", "url": "https://github.com/ertval/forum/blob/a80b1ef0539b4dd569798e2b7be51ad28a20de42/docs/copilot-instructions.md?plain=1", "original_guideline": "Use structured logging, preferably in JSON format."}, {"reason": "Example:\n```json\n{\"timestamp\":\"2025-01-20T10:15:00Z\",\"level\":\"error\",\"service\":\"payments-api\",\"trace_id\":\"abc123\",\"message\":\"database timeout\"}\n```", "repository": "ShasidharReddy/Shasi-Linux", "url": "https://github.com/ShasidharReddy/Shasi-Linux/blob/6aaa3b72b7d2b75b7a55df73b8abcfd6e15adca1/11-DevOps/07-log-aggregation.md?plain=1", "original_guideline": "Use structured logging, preferably in JSON format."}]}, {"id": "CG-1545", "guideline": "Use the following logging configuration: `print()`: Unstructured text to stdout, No, No, Throwaway local debugging only; `logging.info(\"msg\")`: Formatted text to handlers, Partially (grep), No, Simple applications, scripts; `structlog.info(\"msg\", user=uid)`: Key-value pairs (JSON), Yes (field queries), Yes, Production services, anything that needs filtering.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1546", "guideline": "Use the following logging configuration: Log format: JSON (verbose, parseable), Logfmt (compact, less nested), JSON for consistency with OTel; Field contract: Strict schema enforcement, Loose convention, Strict for required fields, loose for optional; device_id in logs: Raw value (queryable), Hashed (privacy-safe), Raw in production (needed for support), hashed in shared/dev; Stack traces: Full trace, First 5 lines, Full trace, truncated at 5000 chars.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1547", "guideline": "Use the predefined `LogField*` constants from `baremetal/utils.go` for consistent field names.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "Use the predefined `LogField*` constants from `baremetal/utils.go` for\nconsistent field names:\n\n```go\nlog.V(baremetal.VerbosityLevelDebug).Info(\"Processing machine\",\n    baremetal.LogFieldMachine, machine.Name,\n    baremetal.LogFieldNamespace, machine.Namespace)\n```", "repository": "metal3-io/cluster-api-provider-metal3", "url": "https://github.com/metal3-io/cluster-api-provider-metal3/blob/a9d9e09267d2e53637c4242e90902331fc756b90/CONTRIBUTING.md?plain=1", "original_guideline": "Use the predefined `LogField*` constants from `baremetal/utils.go` for consistent field names."}]}, {"id": "CG-1548", "guideline": "Use UTC ISO 8601 timestamps with millisecond precision, such as `2023-05-15T14:22:31.123Z`.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1549", "guideline": "Validate message formats.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1550", "guideline": "When converting f-strings in log calls, replace with %-style templates and pass values as positional args to preserve static message templates.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1551", "guideline": "When using stdlib logging, wrap arbitrary application keyword arguments in `extra={...}` to avoid `TypeError` crashes.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "2", "examples": []}, {"id": "CG-1552", "guideline": "Will require anonymization of the natural key fields when reporting a referential integrity problem.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1553", "guideline": "Write logs in English, make messages understandable without code context, avoid logging inside loops unless necessary, and avoid log fields whose collection requires slow remote calls, database queries, or heavy computation unless the information is necessary.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1554", "guideline": "You can pass around a `context.Context` that contains a logger or a `logr.Logger` instance directly.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1555", "guideline": "~~Logging strategy: JSON lines to `~/.minutes/logs/`, 7-day rotation, `minutes logs` command.~~.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1556", "guideline": "📝 Pattern Guidelines When creating custom sensitive patterns: Use case-insensitive regex with `/i` flag for flexible matching Consider naming conventions: snake_case, kebab-case, camelCase Be specific enough to avoid false positives Test patterns with your actual attribute names Include common variations of your sensitive field names.", "dimension": "How to log", "theme": "Logging code composition", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "#### 📝 **Pattern Guidelines**\n\nWhen creating custom sensitive patterns:\n\n- **Use case-insensitive regex** with `/i` flag for flexible matching\n- **Consider naming conventions**: snake_case, kebab-case, camelCase\n- **Be specific enough** to avoid false positives\n- **Test patterns** with your actual attribute names\n- **Include common variations** of your sensitive field names\n\n```typescript\n// Examples of comprehensive patterns\nconst businessPatterns = [\n  // Customer data\n  /customer[_-]?(id|number|ref|reference)/i,\n  /client[_-]?(id|number|ref|reference)/i,\n\n  // Financial data\n  /account[_-]?(number|id|balance)/i,\n  /payment[_-]?(method|token|reference)/i,\n  /transaction[_-]?(id|ref|amount)/i,\n  /card[_-]?(number|token|cvv)/i,\n\n  // Internal references\n  /internal[_-]?(id|ref|key|token)/i,\n  /system[_-]?(id|key|reference)/i,\n  /tracking[_-]?(id|number|reference)/i,\n\n  // User data\n  /user[_-]?(data|info|details|profile)/i,\n  /profile[_-]?(data|info|details)/i,\n\n  // Regex for specific patterns\n  /\\b\\d{13,19}\\b/, // Credit card numbers (13-19 digits)\n  /\\b[A-Z]{2}\\d{2}[A-Z0-9]{4}\\d{7}([A-Z0-9]?){0,16}\\b/, // IBAN format\n  /\\b\\d{3}-\\d{2}-\\d{4}\\b/, // SSN format (US)\n];\n\naddSensitivePatterns(businessPatterns);\n```", "repository": "Paystack-MFB/nestjs-observability", "url": "https://github.com/Paystack-MFB/nestjs-observability/blob/87b280d79048785cb4cbf35ea3cb87b91d1b2f81/docs/best-practices.md?plain=1", "original_guideline": "📝 Pattern Guidelines When creating custom sensitive patterns: Use case-insensitive regex with `/i` flag for flexible matching Consider naming conventions: snake_case, kebab-case, camelCase Be specific enough to avoid false positives Test patterns with your actual attribute names Include common variations of your sensitive field names."}]}, {"id": "CG-1557", "guideline": "\"console.log detected. Use structured logger instead for production code.\".", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1558", "guideline": "\"Either log at throw site OR in error handler, not both\".", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1559", "guideline": "\"Use pino with async destination or log aggregation service\".", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1560", "guideline": "((org.apache.logging.log4j.core.Logger) LogManager.getLogger(\"FtpLoggingFilter\")).setLevel(Level.WARN);.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1561", "guideline": "(SLF4J only, no JUL, MDC required).", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1562", "guideline": "7.3.2 Java components MUST use SLF4J framework (see <http://www.slf4j.org>).", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1563", "guideline": "] [x] Observability & Distributed Tracing (Priority: P3, Effort: S/M): Leverage `System.Diagnostics.DiagnosticSource` and `Activity` to implement distributed tracing across the system.[.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1564", "guideline": "] [x] Standardize Logging Patterns (Priority: P3, Effort: S): Define logging standards and use Source Generators for high-performance logging.[.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1565", "guideline": "] Migrate Monitor `[DIAG]`/custom diagnostic output to `ILogger` with timestamped, structured logs so Monitor and Slim UI diagnostics use one consistent format.[.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1566", "guideline": "``pyxcp`` uses Python's standard ``logging`` module with a NullHandler by default to avoid interfering with your application's logging configuration. This follows Python's logging best practices for libraries: libraries should never configure logging, only applications should.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1567", "guideline": "`fast-logger` - High-performance multicore logging system `hslogger` - Logging library analogous to Python's `logging` library `monad-logger` - add logging with line numbers to your monad stack. Uses fast-logger under the hood. `katip` - Structured logging `log` - Logging system with ElasticSearch, PostgreSQL and stdout sinks. `co-log` - Composable contravariant comonadic logging library.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1568", "guideline": "`getLogger(\"my_app\")` does not use a prebuilt logger. It creates/reuses a logger with that name. Loggers are stored in a registry dictionary and reused (singleton style). Logger names form a hierarchy (`my_app.worker` → child of `my_app`). `name` is used so each module gets a unique logger tied to its import path.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1569", "guideline": "`logger.child(with_fields)` creates a child logger of self. Its argument `with_fields` add to all logs the child logger outputs. A child logger can also create its child logger. If you pass a block to this method, the child logger will be yielded to it.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "`logger.child(with_fields)` creates a child logger of self. Its argument `with_fields` add to all logs the child logger outputs. A child logger can also create its child logger. If you pass a block to this method, the child logger will be yielded to it.\n\n```ruby\nlogger = Ougai::Logger.new(STDOUT)\nlogger.with_fields = { app: 'yourapp', tags: ['service'], kind: 'main' }\n\nchild_logger = logger.child({ tags: ['user'], kind: 'logic' })\nlogger.info('Created child logger')\n\nchild_logger.info('Created a user', name: 'Mike')\n\ngc_logger = child_logger.child({ kind: 'detail' })\nchild_logger.info('Created grand child logger')\n\ngc_logger.debug('something detail', age: 34, weight: 72)\n\ngc_logger.child({ mode: 'processed' }) do |gcc_logger|\n  gcc_logger.info('Great-grandchild logger that will be cleaned up on block exit.')\n\n  :some_return_value\nend\n\nchild_logger.sev_threshold = :error # alias of level\nchild_logger.info('This is not outputted')\ngc_logger.info('This is not outputted')\nchild_logger.error('This is outputted')\ngc_logger.error('This is outputted')\n\nchild_logger.level = :debug # does not work because the level is below parent one\nchild_logger.debug('This is not outputted')\n```\n\n```json\n{\"name\":\"main\",\"hostname\":\"mint\",\"pid\":8342,\"level\":30,\"time\":\"2017-08-01T22:07:20.400+09:00\",\"v\":0,\"app\":\"yourapp\",\"tags\":[\"service\"],\"kind\":\"main\",\"msg\":\"Created child logger\"}\n{\"name\":\"Mike\",\"hostname\":\"mint\",\"pid\":8342,\"level\":30,\"time\":\"2017-08-01T22:07:20.400+09:00\",\"v\":0,\"app\":\"yourapp\",\"tags\":[\"service\",\"user\"],\"kind\":\"logic\",\"msg\":\"Created a user\"}\n{\"name\":\"main\",\"hostname\":\"mint\",\"pid\":8342,\"level\":30,\"time\":\"2017-08-01T22:07:20.400+09:00\",\"v\":0,\"app\":\"yourapp\",\"tags\":[\"service\",\"user\"],\"kind\":\"logic\",\"msg\":\"Created grand child logger\"}\n{\"name\":\"main\",\"hostname\":\"mint\",\"pid\":8342,\"level\":20,\"time\":\"2017-08-01T22:07:20.400+09:00\",\"v\":0,\"app\":\"yourapp\",\"tags\":[\"service\",\"user\"],\"kind\":\"detail\",\"age\":34,\"weight\":72,\"msg\":\"something detail\"}\n{\"name\":\"main\",\"hostname\":\"mint\",\"pid\":8342,\"level\":20,\"time\":\"2017-08-01T22:07:20.400+09:00\",\"v\":0,\"app\":\"yourapp\",\"tags\":[\"service\",\"user\"],\"kind\":\"detail\",\"mode\":\"processed\",\"msg\":\"Great-grandchild logger that will be cleaned up on block exit.\"}\n{\"name\":\"main\",\"hostname\":\"mint\",\"pid\":4894,\"level\":50,\"time\":\"2017-08-01T22:07:20.401+09:00\",\"v\":0,\"app\":\"yourapp\",\"tags\":[\"service\",\"user\"],\"kind\":\"logic\",\"msg\":\"This is outputed\"}\n{\"name\":\"main\",\"hostname\":\"mint\",\"pid\":4894,\"level\":50,\"time\":\"2017-08-01T22:07:20.401+09:00\",\"v\":0,\"app\":\"yourapp\",\"tags\":[\"service\",\"user\"],\"kind\":\"detail\",\"msg\":\"This is outputed\"}\n```", "repository": "tilfin/ougai", "url": "https://github.com/tilfin/ougai/blob/397d07713c93f92a125c7ef6915f23c07df7db63/README.md?plain=1", "original_guideline": "`logger.child(with_fields)` creates a child logger of self. Its argument `with_fields` add to all logs the child logger outputs. A child logger can also create its child logger. If you pass a block to this method, the child logger will be yielded to it."}]}, {"id": "CG-1570", "guideline": "`LogMessages.cs` - Extension methods for ILogger with structured logging support using the [LoggerMessage] attribute pattern.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1571", "guideline": "`true` or `false` Optional, but <FormatMessage\\>true<\/FormatMessage\\> is required for use with Loggly. This element lets you control the format of generated content prepended to the message. If set to true, the syslog message is prepended by a fixed number of characters, which lets you filter out that information from messages.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1572", "guideline": "A: Following Python best practices, libraries should not configure logging. Only applications should. This prevents pyxcp from interfering with your logging setup.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1573", "guideline": "Access logs is an optional feature of Elastic Load Balancing that is turned off by default. To enable access logs for load balancers, see Access logs for your Application Load Balancer .", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1574", "guideline": "Add a handler to a logger before setting propagate=False; otherwise keep propagation enabled.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1575", "guideline": "Add amazing_print to Gemfile and `bundle` Set *Ougai::Formatters::Readable* instance to `formatter` accessor.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "Add amazing_print to Gemfile and `bundle`\n\n```ruby\ngem 'amazing_print'\n```\n\nSet *Ougai::Formatters::Readable* instance to `formatter` accessor\n\n```ruby\nrequire 'ougai'\n\nlogger = Ougai::Logger.new(STDOUT)\nlogger.formatter = Ougai::Formatters::Readable.new\n```", "repository": "tilfin/ougai", "url": "https://github.com/tilfin/ougai/blob/397d07713c93f92a125c7ef6915f23c07df7db63/README.md?plain=1", "original_guideline": "Add amazing_print to Gemfile and `bundle` Set *Ougai::Formatters::Readable* instance to `formatter` accessor."}]}, {"id": "CG-1576", "guideline": "Add file handler specific to this module.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "Say you want **only `worker.py` logs** in a separate file:\nYou can add a **file handler** just to that logger.\n\nInside `worker.py`:\n\n```python\nimport logging\nfrom logging.handlers import RotatingFileHandler\n\nlogger = logging.getLogger(__name__)  # \"module.worker\"\nlogger.setLevel(logging.DEBUG)\n\n# Add file handler specific to this module\nfile_handler = RotatingFileHandler(\"worker.log\", maxBytes=2000, backupCount=2)\nformatter = logging.Formatter(\"%(asctime)s | %(name)s | %(levelname)s | %(message)s\")\nfile_handler.setFormatter(formatter)\nlogger.addHandler(file_handler)\n\ndef do_work():\n    logger.info(\"This goes to worker.log\")\n```\n\n👉 Now:\n\n* `main.py` logs go to `app.log`\n* `worker.py` logs go to both `app.log` (via root handlers) **and** `worker.log`", "repository": "pandey-g/various_notes", "url": "https://github.com/pandey-g/various_notes/blob/7b2514cd235f6af69599f34b57c750dca0c9d9f3/JWT.md?plain=1", "original_guideline": "Add file handler specific to this module."}]}, {"id": "CG-1577", "guideline": "Add logging for retry attempts if a handler is configured.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1578", "guideline": "Add OpenTelemetry tracing middleware when tracing is configured and enabled.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "2", "examples": [{"reason": "// Add OpenTelemetry tracing middleware if enabled\n\tif g.Logging != nil && g.Logging.OTel != nil && g.Logging.OTel.IsEnabled() {\n\t\tmux.Use(g.Logging.OTel.Middleware())\n\t}", "repository": "jimmitjoo/tjo", "url": "https://github.com/jimmitjoo/tjo/blob/3686f662220c537f43fa5f58913d1d497dcbb3a9/routes.go", "original_guideline": "Add OpenTelemetry tracing middleware when tracing is configured and enabled."}]}, {"id": "CG-1579", "guideline": "Add optional argument `logger.package.name` to `set.logging.functions()` to allow internal status printing of the active logging package (or custom functions).", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1580", "guideline": "Amazon Athena — You can directly query CloudTrail events stored in S3 with Athena using SQL commands, specifying the LOCATION of the log files. You would generally use this approach if you have advanced queries to run, and you don’t have a SIEM. To set up Athena to query logs, you can use this open-source solution from AWS.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1581", "guideline": "An engineering team is migrating from unstructured text logs to structured JSON logging for their Node.js microservices. Configure the logging setup to maximize CloudWatch Insights query efficiency and enable effective alerting on error conditions.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1582", "guideline": "Ask the author of that library to adjust their logging standards, as this fixes the problem at its source. Recommend your users to :doc:`configure the logging <\/server/spongineer/logs>` using a ``log4j2.xml`` config file. Provide users with the recommended configuration additions. Configure the logging in your plugin yourself.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1583", "guideline": "Build.log.output: Added arguments for incl.timestamp + incl.severity as option to suppress redundant output if a logging framework is used.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1584", "guideline": "By default, trails are multi-Region, so you don’t need to enable CloudTrail logs in each AWS Region.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1585", "guideline": "C.log = log.Logger.With().Str(\"Client\", \"RTPEngine\").Logger(),.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "c.log = log.Logger.With().Str(\"Client\", \"RTPEngine\").Logger(),", "repository": "SilvaMendes/go-rtpengine", "url": "https://github.com/SilvaMendes/go-rtpengine/blob/9b431cd1587fde69c9e3dcce6121927a562645d3/client.go", "original_guideline": "C.log = log.Logger.With().Str(\"Client\", \"RTPEngine\").Logger(),."}]}, {"id": "CG-1586", "guideline": "Centralized Configuration: All logging should use a centralized logger configuration.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1587", "guideline": "Check handler is configured: .. code-block:: python import logging pyxcp_logger = logging.getLogger(\"pyxcp\") print(f\"Handlers: {pyxcp_logger.handlers}\") # Should not be empty Check log level: .. code-block:: python import logging pyxcp_logger = logging.getLogger(\"pyxcp\") print(f\"Level: {logging.getLevelName(pyxcp_logger.level)}\") Check propagation: .. code-block:: python import logging pyxcp_logger = logging.getLogger(\"pyxcp\") print(f\"Propagate: {pyxcp_logger.propagate}\") # Should be True.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "1. **Check handler is configured**:\n\n   .. code-block:: python\n\n      import logging\n      pyxcp_logger = logging.getLogger(\"pyxcp\")\n      print(f\"Handlers: {pyxcp_logger.handlers}\")  # Should not be empty\n\n2. **Check log level**:\n\n   .. code-block:: python\n\n      import logging\n      pyxcp_logger = logging.getLogger(\"pyxcp\")\n      print(f\"Level: {logging.getLevelName(pyxcp_logger.level)}\")\n\n3. **Check propagation**:\n\n   .. code-block:: python\n\n      import logging\n      pyxcp_logger = logging.getLogger(\"pyxcp\")\n      print(f\"Propagate: {pyxcp_logger.propagate}\")  # Should be True", "repository": "christoph2/pyxcp", "url": "https://github.com/christoph2/pyxcp/blob/9a8a2f966ad173ebafb9ccf76a0be65403b1457a/docs/logging.rst", "original_guideline": "Check handler is configured: .. code-block:: python import logging pyxcp_logger = logging.getLogger(\"pyxcp\") print(f\"Handlers: {pyxcp_logger.handlers}\") # Should not be empty Check log level: .. code-block:: python import logging pyxcp_logger = logging.getLogger(\"pyxcp\") print(f\"Level: {logging.getLevelName(pyxcp_logger.level)}\") Check propagation: .. code-block:: python import logging pyxcp_logger = logging.getLogger(\"pyxcp\") print(f\"Propagate: {pyxcp_logger.propagate}\") # Should be True."}]}, {"id": "CG-1588", "guideline": "Clear existing handlers before reconfiguring: .. code-block:: python import logging pyxcp_logger = logging.getLogger(\"pyxcp\") Clear existing handlers for handler in pyxcp_logger.handlers[:]: pyxcp_logger.removeHandler(handler) Add your handler new_handler = logging.StreamHandler() pyxcp_logger.addHandler(new_handler).", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "Clear existing handlers before reconfiguring:\n\n.. code-block:: python\n\n   import logging\n\n   pyxcp_logger = logging.getLogger(\"pyxcp\")\n\n   # Clear existing handlers\n   for handler in pyxcp_logger.handlers[:]:\n       pyxcp_logger.removeHandler(handler)\n\n   # Add your handler\n   new_handler = logging.StreamHandler()\n   pyxcp_logger.addHandler(new_handler)", "repository": "christoph2/pyxcp", "url": "https://github.com/christoph2/pyxcp/blob/9a8a2f966ad173ebafb9ccf76a0be65403b1457a/docs/logging.rst", "original_guideline": "Clear existing handlers before reconfiguring: .. code-block:: python import logging pyxcp_logger = logging.getLogger(\"pyxcp\") Clear existing handlers for handler in pyxcp_logger.handlers[:]: pyxcp_logger.removeHandler(handler) Add your handler new_handler = logging.StreamHandler() pyxcp_logger.addHandler(new_handler)."}]}, {"id": "CG-1589", "guideline": "Clears the scope name of the logger.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1590", "guideline": "Close gracefully shuts down the logger.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1591", "guideline": "Cloud.gov sets an `X-Vcap-Request-Id` header on every request. Capture and propagate this ID across your services to enable end-to-end tracing through log analysis.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1592", "guideline": "Configure `basicConfig()` only once (usually in `main.py`).", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1593", "guideline": "Configure `structlog` with `ConsoleRenderer` for human-readable console logging.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "```python\nimport structlog\nstructlog.configure(processors=[structlog.dev.ConsoleRenderer()])\n```", "repository": "Tristan-Toye/SMTP-POP3-mailing-server", "url": "https://github.com/Tristan-Toye/SMTP-POP3-mailing-server/blob/6c08f58bb7bae20d879d929b6e045510401c8f68/docs.md?plain=1", "original_guideline": "Configure `structlog` with `ConsoleRenderer` for human-readable console logging."}]}, {"id": "CG-1594", "guideline": "Configure application logging.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1595", "guideline": "Configure appropriate CloudWatch Logs retention periods by log category.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1596", "guideline": "Configure Docker `json-file` log rotation per service or globally to prevent disk exhaustion; for example, cap files at 20 MB and retain 10 files. Per-service settings override daemon defaults, and daemon-level changes require a Docker restart.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "The Docker logging driver and container log management can cause logs to grow and fill disk space if left unconfigured. To avoid this, configure log rotation either per-service in docker-compose or globally in the Docker daemon.\n\nWhen using Docker, it's important to manage container logs to prevent them from consuming excessive disk space. By default, Docker uses the `json-file` logging driver, which can lead to very large log files if left unconfigured.\n\nTo avoid this, you can configure log rotation. This can be done for specific services in your `docker-compose.yml` file, or globally for the Docker daemon.\n\n**Per-service configuration**\n\nYou can configure the logging driver for your services in your `docker-compose.yml` file to automatically rotate the logs. Here is an example that keeps up to 10 log files of 20MB each:\n\n```yaml\nservices:\n  bunkerweb:\n    image: bunkerity/bunkerweb:1.6.11\n    logging:\n      driver: \"json-file\"\n      options:\n        max-size: \"20m\"\n        max-file: \"10\"\n    ...\n```\n\nThis configuration ensures that logs are rotated, preventing them from filling up your disk. You can apply this to any service in your Docker Compose setup.\n\n**Global settings (daemon.json)**\n\nIf you want to apply these logging settings to all containers on the host by default, you can configure the Docker daemon by editing (or creating) the `/etc/docker/daemon.json` file:\n\n```json\n{\n  \"log-driver\": \"json-file\",\n  \"log-opts\": {\n    \"max-size\": \"20m\",\n    \"max-file\": \"10\"\n  }\n}\n```\n\nAfter modifying `daemon.json`, you need to restart the Docker daemon for the changes to take effect:\n\n```shell\nsudo systemctl restart docker\n```\n\nThese global settings will be inherited by all containers. However, any logging configuration defined on a per-service basis in a `docker-compose.yml` file will override the global settings in `daemon.json`.", "repository": "bunkerity/bunkerweb", "url": "https://github.com/bunkerity/bunkerweb/blob/515efe94ab3982e6ab01768fb1ff46d3871c1b95/docs/advanced.md?plain=1", "original_guideline": "Configure Docker `json-file` log rotation per service or globally to prevent disk exhaustion; for example, cap files at 20 MB and retain 10 files. Per-service settings override daemon defaults, and daemon-level changes require a Docker restart."}]}, {"id": "CG-1597", "guideline": "Configure Logback with a console appender at INFO level and format entries with timestamp, severity, logger name, and message.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "Configure `logback.xml`:\n   ```xml\n   <configuration>\n       <appender name=\"CONSOLE\" class=\"ch.qos.logback.core.ConsoleAppender\">\n           <encoder>\n               <pattern>%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n<\/pattern>\n           <\/encoder>\n       <\/appender>\n       <root level=\"info\">\n           <appender-ref ref=\"CONSOLE\" />\n       <\/root>\n   <\/configuration>\n   ```", "repository": "athenaeum-brew/einfuehrung", "url": "https://github.com/athenaeum-brew/einfuehrung/blob/b52d5c1f20861fa0fd02ac96c5e9bd5b5b94e2db/17.md?plain=1", "original_guideline": "Configure Logback with a console appender at INFO level and format entries with timestamp, severity, logger name, and message."}]}, {"id": "CG-1598", "guideline": "Configure logging through environment variables.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1599", "guideline": "Configure logging to stdout Log messages.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "```python\nimport logging\nimport sys\n\n# Configure logging to stdout\nlogging.basicConfig(\n    level=logging.INFO,\n    format='%(asctime)s - %(name)s - %(levelname)s - %(message)s',\n    handlers=[logging.StreamHandler(sys.stdout)]\n)\n\nlogger = logging.getLogger(__name__)\n\n# Log messages\nlogger.info(\"Application started\")\nlogger.warning(\"Something might be wrong\")\nlogger.error(\"An error occurred\")\n```", "repository": "adhocteam/cloud-gov-instructions", "url": "https://github.com/adhocteam/cloud-gov-instructions/blob/64a6f40c7c07c5832faa4c9c9379df92b9ab311e/README.md?plain=1", "original_guideline": "Configure logging to stdout Log messages."}]}, {"id": "CG-1600", "guideline": "Configure logging with `configure_logging(level='INFO')`.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "2", "examples": []}, {"id": "CG-1601", "guideline": "Configure logs to be written to the required file destination.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "4", "examples": [{"reason": "```\n[22:50:43.277] [IDLE] Idle time notice enabled; threshold=4 min (240s)\n[22:50:43.277] [IDLE] Probing idle backend on linux...\n[22:50:43.287] [IDLE]   dbus_mutter: unavailable (DBusException: org.freedesktop.DBus.Error.ServiceUnknown: The name org.gnome.Mutter.IdleMonitor was not provided by any .service files)\n[22:50:43.287] [IDLE]   dbus_screensaver: unavailable (DBusException: org.freedesktop.DBus.Error.UnknownMethod: Unknown method GetSessionIdleTime or interface org.freedesktop.ScreenSaver.)\n[22:50:43.287] [IDLE]   ext_idle_notify: unavailable (no WAYLAND_DISPLAY (not a Wayland session))\n[22:50:43.287] [IDLE]   x11_mit_screensaver: OK\n[22:50:43.287] [IDLE] Selected backend: x11_mit_screensaver\n[22:50:43.287] [IDLE] Test query returned idle=0.01s\n```", "repository": "taskcoach/taskcoach", "url": "https://github.com/taskcoach/taskcoach/blob/5090727de82d3cb78fd7989a08aff1bd3784eb5d/docs/IDLE.md?plain=1", "original_guideline": "Configure logs to be written to the required file destination."}, {"reason": "```\n[16: 8958cba9c083bf78c29f3efdc0034b24d14/TOC.md?plain=1", "original_guideline": "Configure logs to be written to the required file destination."}]}, {"id": "CG-1602", "guideline": "Configure separate logger thresholds while sharing handlers: keep the application at INFO, reduce pyxcp to WARNING, and attach the common formatted handler through the application/root logging setup.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": ".. code-block:: python\n\n   import logging\n\n   # Application logger\n   app_logger = logging.getLogger(\"myapp\")\n   app_logger.setLevel(logging.INFO)\n\n   # pyxcp logger (child of root)\n   pyxcp_logger = logging.getLogger(\"pyxcp\")\n   pyxcp_logger.setLevel(logging.WARNING)  # Less verbose than app\n\n   # Shared handler\n   handler = logging.StreamHandler()\n   handler.setFormatter(logging.Formatter(\n       \"%(asctime)s [%(name)s] %(levelname)s: %(message)s\"\n   ))\n\n   # Add to both\n   app_logger.addHandler(handler)\n   # pyxcp inherits from root, so configure root too\n   logging.root.addHandler(handler)\n   logging.root.setLevel(logging.INFO)", "repository": "christoph2/pyxcp", "url": "https://github.com/christoph2/pyxcp/blob/9a8a2f966ad173ebafb9ccf76a0be65403b1457a/docs/logging.rst", "original_guideline": "Configure separate logger thresholds while sharing handlers: keep the application at INFO, reduce pyxcp to WARNING, and attach the common formatted handler through the application/root logging setup."}]}, {"id": "CG-1603", "guideline": "Configure Signale log output to display filename, timestamp, date.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "2", "examples": [{"reason": "```js\n// foo.js\nconst signale = require('signale');\n\nsignale.config({\n  displayFilename: true,\n  displayTimestamp: true,\n  displayDate: false\n});\n\nsignale.success('Hello from the Global scope');\n\nfunction foo() {\n  // `fooLogger` inherits the config of `signale`\n  const fooLogger = signale.scope('foo scope');\n\n  // Overrides both `signale` and `package.json` configs\n  fooLogger.config({\n    displayFilename: true,\n    displayTimestamp: false,\n    displayDate: true\n  });\n\n  fooLogger.success('Hello from the Local scope');\n}\n\nfoo();\n```", "repository": "klaudiosinani/signale", "url": "https://github.com/klaudiosinani/signale/blob/a0119bb6b3b4d63b51318585c06d519c54897333/readme.md?plain=1", "original_guideline": "Configure Signale log output to display filename, timestamp, date."}, {"reason": "```js\n// foo.js\nconst signale = require('signale');\n\nsignale.config({\n  displayFilename: true,\n  displayTimestamp: true,\n  displayDate: true\n});\n\nsignale.success('Successful operations');\n//=> [2018-5-15] [11:12:38] [foo.js] › ✔  success  Successful operations\n```", "repository": "klaudiosinani/signale", "url": "https://github.com/klaudiosinani/signale/blob/a0119bb6b3b4d63b51318585c06d519c54897333/readme.md?plain=1", "original_guideline": "Configure Signale log output to display filename, timestamp, date."}]}, {"id": "CG-1604", "guideline": "Configure Signale log output to display filename, timestamp.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "```js\n// foo.js\nconst signale = require('signale');\n\n// Overrides any existing `package.json` config\nsignale.config({\n  displayFilename: true,\n  displayTimestamp: true,\n  displayDate: false\n}); \n\nsignale.success('Hello from the Global scope');\n```", "repository": "klaudiosinani/signale", "url": "https://github.com/klaudiosinani/signale/blob/a0119bb6b3b4d63b51318585c06d519c54897333/readme.md?plain=1", "original_guideline": "Configure Signale log output to display filename, timestamp."}]}, {"id": "CG-1605", "guideline": "Configure the appropriate logging handlers for the required destinations.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "```go\npackage main\n\nimport (\n    \"context\"\n    \"log/slog\"\n    \"os\"\n\n    \"github.com/open-feature/go-sdk/openfeature\"\n    \"github.com/open-feature/go-sdk/openfeature/hooks\"\n    \"github.com/open-feature/go-sdk/openfeature/memprovider\"\n)\n\nfunc main() {\n    // Register an in-memory provider with no flags\n    openfeature.SetNamedProviderAndWait(\"example\", memprovider.NewInMemoryProvider(map[string]memprovider.InMemoryFlag{}))\n\n    // Configure slog\n    handler := slog.NewJSONHandler(os.Stderr, &slog.HandlerOptions{Level: slog.LevelDebug})\n    logger := slog.New(handler)\n\n    // Register a logging hook globally to run on all evaluations\n    loggingHook := hooks.NewLoggingHook(false, logger)\n    openfeature.AddHooks(loggingHook)\n\n    // Create a new client\n    client := openfeature.NewClient(\"example\")\n\n    // Attempt to evaluate a flag that doesn't exist\n    _ = client.Boolean(context.TODO(), \"not-exist\", true, openfeature.EvaluationContext{})\n}\n```", "repository": "open-feature/go-sdk", "url": "https://github.com/open-feature/go-sdk/blob/13224532ef1798f223672d2c107126d0e1633e45/README.md?plain=1", "original_guideline": "Configure the appropriate logging handlers for the required destinations."}]}, {"id": "CG-1606", "guideline": "Configure the default `slog` logger with a JSON handler that writes to standard output at INFO level.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "// Configure structured logging\n\tlogger := slog.New(slog.NewJSONHandler(os.Stdout, &slog.HandlerOptions{\n\t\tLevel: slog.LevelInfo,\n\t}))\n\tslog.SetDefault(logger)", "repository": "philjestin/Daedalus", "url": "https://github.com/philjestin/Daedalus/blob/af954176f91c463860c7f1012ac6ced4059f4145/app theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "```cs\npublic class Startup\n{\n  public IConfiguration Configuration { get; }\n  public IHostingEnvironment Environment { get; }\n  public LogProvider Logger { get; }\n\n  public Startup(IConfiguration config, IHostingEnvironment env)\n  {\n    Configuration = config;\n    Environment = env;\n    Logger = new LogProvider\n    {\n      LogDirectory = Configuration.GetValue<string>(\"LogDirectory\") ??\n        $@\"{Environment.WebRootPath}\\logs\"\n    };\n  }\n}\n```", "repository": "troykuhn/PatternsAndPractices", "url": "https://github.com/troykuhn/PatternsAndPractices/blob/9a2a34f798b217bc5168a9cf5ff374eeabd1d97f/toc.md?plain=1", "original_guideline": "Configure the log directory from the `LogDirectory` setting, defaulting to a `logs` directory under the web root when the setting is absent."}]}, {"id": "CG-1610", "guideline": "Configure the logging utility with an explicit log level, scope, output stream, and custom log types as required by the application.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "```js\nconst {Signale} = require('signale');\n\nconst options = {\n  disabled: false,\n  interactive: false,\n  logLevel: 'info',\n  scope: 'custom',\n  secrets: [],\n  stream: process.stdout,\n  types: {\n    remind: {\n      badge: '**',\n      color: 'yellow',\n      label: 'reminder',\n      logLevel: 'info'\n    },\n    santa: {\n      badge: '🎅',\n      color: 'red',\n      label: 'santa',\n      logLevel: 'info'\n    }\n  }\n};\n\nconst custom = new Signale(options);\ncustom.remind('Improve documentation.');\ncustom.santa('Hoho! You have an unused variable on L45.');\n```", "repository": "klaudiosinani/signale", "url": "https://github.com/klaudiosinani/signale/blob/a0119bb6b3b4d63b51318585c06d519c54897333/readme.md?plain=1", "original_guideline": "Configure the logging utility with an explicit log level, scope, output stream, and custom log types as required by the application."}]}, {"id": "CG-1611", "guideline": "Configure the logging utility with structured formatting, contextual metadata, appropriate transports, and severity-specific logging", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "```javascript\nconst winston = require('winston');\nconst LokiTransport = require('winston-loki');\n\n// Define a custom format for structured logging\nconst structuredFormat = winston.format.combine(\n  winston.format.timestamp({\n    format: 'YYYY-MM-DDTHH:mm:ss.SSSZ'\n  }),\n  winston.format.errors({ stack: true }),\n  winston.format.json()\n);\n\n// Create the logger with multiple transports\nconst logger = winston.createLogger({\n  level: process.env.LOG_LEVEL || 'info',\n  defaultMeta: { \n    service: 'user-service',\n    version: process.env.SERVICE_VERSION || '1.0.0',\n    environment: process.env.NODE_ENV || 'development'\n  },\n  transports: [\n    // Console output for local development\n    new winston.transports.Console({\n      format: winston.format.combine(\n        winston.format.colorize(),\n        winston.format.simple()\n      )\n    }),\n    // Loki transport for production\n    new LokiTransport({\n      host: process.env.LOKI_HOST || 'http://loki:3100',\n      labels: { job: 'user-service' },\n      format: structuredFormat,\n      replaceTimestamp: false,\n      batching: true,\n      interval: 5,\n      clearOnError: false\n    })\n  ]\n});\n\n// Usage example\nfunction processUserLogin(user, context) {\n  logger.debug('Processing login attempt', { \n    userId: user.id,\n    loginMethod: context.method,\n    requestId: context.requestId,\n    ipAddress: context.ip\n  });\n  \n  // Login logic here...\n  \n  if (loginSuccessful) {\n    logger.info('User logged in successfully', { \n      userId: user.id,\n      requestId: context.requestId\n    });\n  } else {\n    logger.warn('Login failed', { \n      userId: user.id,\n      reason: 'Invalid credentials',\n      attemptCount: user.failedLoginAttempts,\n      requestId: context.requestId\n    });\n  }\n}\n```", "repository": "Compile-N-Run/Compile-N-Run", "url": "https://github.com/Compile-N-Run/Compile-N-Run/blob/f0fe327e13fe8f6a553e835512d3a25f12a155b3/docs/observability/loki/17-best-practices/0-logging-standards.mdx", "original_guideline": "Configure the logging utility with structured formatting, contextual metadata, appropriate transports, and severity-specific logging"}]}, {"id": "CG-1612", "guideline": "Configure using Python's standard logging: .. code-block:: python import logging Configure root logger for your application logging.basicConfig( level=logging.INFO, format=\"%(asctime)s [%(name)s] %(levelname)s: %(message)s\" ) pyxcp logs will now appear with 'pyxcp.*' names from pyxcp.cmdline import ArgumentParser ap = ArgumentParser(description=\"Standard logging\") with ap.run() as xcp: xcp.connect() xcp.disconnect().", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "Configure using Python's standard logging:\n\n.. code-block:: python\n\n   import logging\n\n   # Configure root logger for your application\n   logging.basicConfig(\n       level=logging.INFO,\n       format=\"%(asctime)s [%(name)s] %(levelname)s: %(message)s\"\n   )\n\n   # pyxcp logs will now appear with 'pyxcp.*' names\n   from pyxcp.cmdline import ArgumentParser\n   ap = ArgumentParser(description=\"Standard logging\")\n   with ap.run() as xcp:\n       xcp.connect()\n       xcp.disconnect()", "repository": "christoph2/pyxcp", "url": "https://github.com/christoph2/pyxcp/blob/9a8a2f966ad173ebafb9ccf76a0be65403b1457a/docs/logging.rst", "original_guideline": "Configure using Python's standard logging: .. code-block:: python import logging Configure root logger for your application logging.basicConfig( level=logging.INFO, format=\"%(asctime)s [%(name)s] %(levelname)s: %(message)s\" ) pyxcp logs will now appear with 'pyxcp.*' names from pyxcp.cmdline import ArgumentParser ap = ArgumentParser(description=\"Standard logging\") with ap.run() as xcp: xcp.connect() xcp.disconnect()."}]}, {"id": "CG-1613", "guideline": "Configure your logging framework to output ISO 8601 timestamps.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1614", "guideline": "Consequently, top-level controllers or reconciliation workers MUST inject a logger into its `Context` using `klog.NewContext` before passing it to any nested calls. The injected logger MUST have the following values: `controller`: indicating the name of the controller `object`: indicating the qualified name of the object being reconciled `ftc` (if applicable): indicating the name of the controller's corresponding ftc.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1615", "guideline": "Console.log in Production: Debug statements left in code Instead: Use structured logging library (pino, winston).", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1616", "guideline": "Create `src/index.ts` to bootstrap the Express server with CORS, JSON parsing, and request logging via `pino-http`.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1617", "guideline": "Create a logger to log the max errors condition.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1618", "guideline": "Create a logging style guide - Document your standards ility/blob/87b280d79048785cb4cbf35ea3cb87b91d1b2f81/docs/best-practices.md?plain=1", "original_guideline": "Enable HTTP Request/Response Logging."}]}, {"id": "CG-1633", "guideline": "Enable log rotation with size limits.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1634", "guideline": "Enable relevant linting rules (G, T201, LOG) and ignore G002 for stdlib-only projects.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1635", "guideline": "Enable sensitive data logging only in development.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "// Enable sensitive data logging only in development", "repository": "jeastham1993/developer-prompts", "url": "https://github.com/jeastham1993/developer-prompts/blob/4c425502ecda97e28ac0ed823b9dcd7fa15de48e/dotnet.md?plain=1", "original_guideline": "Enable sensitive data logging only in development."}]}, {"id": "CG-1636", "guideline": "Enable sensitive-data logging only in development or staging database contexts, and leave it disabled in production.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "```cs\npublic void ConfigureServices(IServiceCollection services)\n{\n  services\n    .AddMvc()\n    .SetCompatibilityVersion(CompatibilityVersion.Version_2_2)\n    .AddJsonOptions(options =>\n    {\n      options.SerializerSettings.ReferenceLoopHandling = ReferenceLoopHandling.Ignore;\n      options.SerializerSettings.ContractResolver = new CamelCasePropertyNamesContractResolver();\n    });\n\n  services.AddDbContext<AppDbContext>(options =>\n  {\n    if (Environment.IsDevelopment())\n    {\n      options.UseSqlServer(Configuration.GetConnectionString(\"Dev\"));\n      options.EnableSensitiveDataLogging();\n    }\n    else if (Environment.IsStaging())\n    {\n      options.UseSqlServer(Configuration.GetConnectionString(\"Test\"));\n      options.EnableSensitiveDataLogging();\n    }\n    else\n    {\n      options.UseSqlServer(Configuration.GetConnectionString(\"Project\"));\n    }\n  });\n\n  services.AddSpaStaticFiles(configuration =>\n  {\n    configuration.RootPath = \"ClientApp/dist\";\n  });\n}\n```", "repository": "troykuhn/PatternsAndPractices", "url": "https://github.com/troykuhn/PatternsAndPractices/blob/9a2a34f798b217bc5168a9cf5ff374eeabd1d97f/toc.md?plain=1", "original_guideline": "Enable sensitive-data logging only in development or staging database contexts, and leave it disabled in production."}]}, {"id": "CG-1637", "guideline": "Enable structured logging.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1638", "guideline": "Enable the `imtcp` input module and listen for TCP syslog messages on port 514.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1639", "guideline": "Ensure logger is typed to its own class: `LoggerFactory.getLogger(MyClass.class)`.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1640", "guideline": "Ensure proper shutdown order: .. code-block:: python import logging Your logging setup file_handler = logging.FileHandler(\"myapp.log\") logger = logging.getLogger(\"myapp\") logger.addHandler(file_handler) Use pyxcp from pyxcp.cmdline import ArgumentParser with ap.run() as xcp: xcp.connect() xcp.disconnect() Close file handler AFTER pyxcp is done file_handler.close() logger.removeHandler(file_handler).", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "Ensure proper shutdown order:\n\n.. code-block:: python\n\n   import logging\n\n   # Your logging setup\n   file_handler = logging.FileHandler(\"myapp.log\")\n   logger = logging.getLogger(\"myapp\")\n   logger.addHandler(file_handler)\n\n   # Use pyxcp\n   from pyxcp.cmdline import ArgumentParser\n   with ap.run() as xcp:\n       xcp.connect()\n       xcp.disconnect()\n\n   # Close file handler AFTER pyxcp is done\n   file_handler.close()\n   logger.removeHandler(file_handler)", "repository": "christoph2/pyxcp", "url": "https://github.com/christoph2/pyxcp/blob/9a8a2f966ad173ebafb9ccf76a0be65403b1457a/docs/logging.rst", "original_guideline": "Ensure proper shutdown order: .. code-block:: python import logging Your logging setup file_handler = logging.FileHandler(\"myapp.log\") logger = logging.getLogger(\"myapp\") logger.addHandler(file_handler) Use pyxcp from pyxcp.cmdline import ArgumentParser with ap.run() as xcp: xcp.connect() xcp.disconnect() Close file handler AFTER pyxcp is done file_handler.close() logger.removeHandler(file_handler)."}]}, {"id": "CG-1641", "guideline": "Every collector _must_ accept a `*slog.Logger` in the constructor.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1642", "guideline": "Every provider _must_ accept a `*slog.Logger` in the constructor.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1643", "guideline": "Extend `LogFormat` enum in `crates/tracing-otel/src/logs/logger.rs` Implement the format layer in `init_subscriber_*` functions Add environment variable mapping if using `env` feature.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1644", "guideline": "Filter by `actor` to trace user activity.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1645", "guideline": "Format Log4j2 entries with an ISO 8601 timestamp, thread, severity level, logger name, and message.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "```java\n// Java example with Log4j2\nConfiguration configuration = ConfigurationFactory.newConfigurationBuilder()\n    .setProperty(\"pattern\", \"%d{ISO8601} [%t] %-5level %logger{36} - %msg%n\")\n    .build();\n```", "repository": "Compile-N-Run/Compile-N-Run", "url": "https://github.com/Compile-N-Run/Compile-N-Run/blob/f0fe327e13fe8f6a553e835512d3a25f12a155b3/docs/observability/loki/17-best-practices/0-logging-standards.mdx", "original_guideline": "Format Log4j2 entries with an ISO 8601 timestamp, thread, severity level, logger name, and message."}]}, {"id": "CG-1646", "guideline": "Fortunately, there is already solutions like MCAP and Foxglove, that combined with ProtoBuf allows us to make smaller sized logs with better traceability.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1647", "guideline": "GetLogger().info(\"String\"); getLogger().debug(\"String\"); getLogger().warn(\"String\"); getLogger().error(\"String\");.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1648", "guideline": "Guard expensive INFO-message computations with `logger.isEnabled(Level.INFO)` so they run only when INFO logging is enabled.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "2. Use checks like:\n    ```java\n    if (logger.isEnabled(Level.INFO)) {\n        logger.info(String.format(\"The result is %d.\", superExpensiveMethod()));\n    }\n    ```", "repository": "hoverla-team-2023/HoverlaBring", "url": "https://github.com/hoverla-team-2023/HoverlaBring/blob/56a0ca65ad83c1501b014ee339b362f8ee03ff68/dev.md?plain=1", "original_guideline": "Guard expensive INFO-message computations with `logger.isEnabled(Level.INFO)` so they run only when INFO logging is enabled."}]}, {"id": "CG-1649", "guideline": "I will not disable, bypass, or weaken logging mechanisms.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1650", "guideline": "If setting propagate=False, ensure a handler is added to that logger first; otherwise keep propagate=True.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1651", "guideline": "If you have a multi-subject deployment and need an Art. 30 record, enable audit logs and route them to a tamper-resistant store (journald with `Storage=persistent`, an external syslog server, or an immutable object store).", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1652", "guideline": "If you have identified a user who has been compromised, or that you suspect has been compromised, you might want to know the API calls that they made over a specific time period. Understanding the activity of a user can help you understand the scope of impact during an incident, as well as the reach of user permissions when you design your access management strategy.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1653", "guideline": "Implementation Considerations: Network security - encrypted transport (TLS) Authentication - verify log source identity Storage security - append-only, immutable logs Access controls - role-based log access Retention policies - compliance and storage management.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1654", "guideline": "Import Signale and use its default logger types for application log output.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1655", "guideline": "Important Notes: This feature is disabled by default to prevent unexpected log volume. Services must explicitly opt-in by setting the environment variable. This setting is evaluated at application startup. To enable or disable request/response logging, you must restart the application. When disabled, the request logging interceptor is not registered, providing zero runtime overhead.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1656", "guideline": "In client applications: Enable debug logging Monitor network traffic Track message exchanges Record error states.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1657", "guideline": "In order to do it, i have used Log4j2 to log every interactions with the backend.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1658", "guideline": "In other words, we explicitly don't use `klog` global logging calls.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1659", "guideline": "In the AWS Cloud, you can log network activity by creating a proxy that logs network traffic or by using Traffic Mirroring to send a copy of network traffic to a logging server.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1660", "guideline": "Include a `log_type` tag (`plan`, `reflection`, `debug`, etc.) to filter by entry purpose.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1661", "guideline": "Initialize tracing/log formatting with an environment-controlled filter.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1662", "guideline": "Inject and use an SLF4J `Logger` rather than constructing an ad hoc logger.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "import com.google.inject.Inject;\n    import org.slf4j.Logger;\n\n    @Inject\n    private Logger logger;", "repository": "whimxiqal/SpongeDocs", "url": "https://github.com/whimxiqal/SpongeDocs/blob/92fcc2e69f3f7df99741256120c1f1772b01b5aa/source/plugin/logging.rst", "original_guideline": "Inject and use an SLF4J `Logger` rather than constructing an ad hoc logger."}]}, {"id": "CG-1663", "guideline": "Install bunyan or pino via npm Pipe a log file to command If you use *Ougai::Formatters::Pino*, you can use command pino as well as bunyan.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "Install [bunyan](https://github.com/trentm/node-bunyan) or [pino](https://github.com/pinojs/pino) via npm\n\n```\n$ npm install -g bunyan\n```\n\nPipe a log file to command\n\n```\n$ cat output.log | bunyan\n[2016-10-16T22:26:48.835+09:00]  INFO: main/14607 on mint: Info message!\n[2016-10-16T22:26:48.836+09:00] DEBUG: main/14607 on mint: Debugging (data_id=1, data_flag=true)\n[2016-10-16T22:26:48.836+09:00] DEBUG: main/14607 on mint: Debug!\n    custom_data: {\n      \"id\": 1,\n      \"name\": \"something\"\n    }\n[2016-10-16T22:26:48.836+09:00] FATAL: main/14607 on mint: Unexpected!\n    main.rb:12:in `<main>'\n[2016-10-16T22:26:48.836+09:00] ERROR: main/14607 on mint: Caught error (reason=\"z\n    main.rb:18:in `/'\n      main.rb:18:in `<main>'\n```\n\nIf you use *Ougai::Formatters::Pino*, you can use command [pino](https://github.com/pinojs/pino) as well as [bunyan](https://github.com/trentm/node-bunyan).", "repository": "tilfin/ougai", "url": "https://github.com/tilfin/ougai/blob/397d07713c93f92a125c7ef6915f23c07df7db63/README.md?plain=1", "original_guideline": "Install bunyan or pino via npm Pipe a log file to command If you use *Ougai::Formatters::Pino*, you can use command pino as well as bunyan."}]}, {"id": "CG-1664", "guideline": "Integrated Log4j2 for logging various levels of information.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1665", "guideline": "La classe `LoggerHandler` se charge d'enregistrer le message de l'exception dans un journal d'erreurs grâce à une implémentation de « *logger* » de la bibliothèque Open-Source Monolog.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1666", "guideline": "Let pyxcp inherit the application's existing logging configuration so its records use the same level, format, file handler, and console handler.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "If your application already has logging configured, pyxcp will inherit it:\n\n.. code-block:: python\n\n   import logging\n\n   # Your application's logging setup\n   logging.basicConfig(\n       level=logging.INFO,\n       format=\"[%(levelname)s] %(name)s: %(message)s\",\n       handlers=[\n           logging.FileHandler(\"app.log\"),\n           logging.StreamHandler()\n       ]\n   )\n\n   # pyxcp logs will automatically use your configuration\n   from pyxcp.cmdline import ArgumentParser\n   ap = ArgumentParser(description=\"Integrated logging\")\n   with ap.run() as xcp:\n       xcp.connect()  # Logs to app.log and console\n       xcp.disconnect()", "repository": "christoph2/pyxcp", "url": "https://github.com/christoph2/pyxcp/blob/9a8a2f966ad173ebafb9ccf76a0be65403b1457a/docs/logging.rst", "original_guideline": "Let pyxcp inherit the application's existing logging configuration so its records use the same level, format, file handler, and console handler."}]}, {"id": "CG-1667", "guideline": "Log GetLogger().warn(\"This is a warning!\");.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1668", "guideline": "Log INFO for `Connected` with `operation`, `transport`, `extra`.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "```python\nimport logging\nfrom actian_vectorai.telemetry import configure_structured_logging\n\nlogger = configure_structured_logging(level=logging.DEBUG)\nlogger.info(\"Connected\", extra={\"operation\": \"connect\", \"transport\": \"grpc\"})\n# Output: {\"ts\": \"2026-03-12T...\", \"level\": \"INFO\", \"logger\": \"actian_vectorai\",\n#          \"msg\": \"Connected\", \"operation\": \"connect\", \"transport\": \"grpc\"}\n```\n\n`StructuredJsonFormatter` extracts these extra fields when present:\n`operation`, `collection`, `duration_ms`, `request_id`, `status`, `transport`.", "repository": "hackmamba-io/actian-vectorAI-db-beta", "url": "https://github.com/hackmamba-io/actian-vectorAI-db-beta/blob/569af685f86be5f992535e70596a9bd84172fe91/docs/api.md?plain=1", "original_guideline": "Log INFO for `Connected` with `operation`, `transport`, `extra`."}]}, {"id": "CG-1669", "guideline": "Logger names form a dot-separated hierarchy. Example: * `my_app.worker` is a child of `my_app`. By default, children propagate their log messages to parents, unless you disable it: So if you log from `my_app.worker`, it can bubble up to `my_app`’s handlers (and then to root).", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "Logger names form a **dot-separated hierarchy**.\nExample:\n\n```python\nmain_logger   = logging.getLogger(\"my_app\")\nworker_logger = logging.getLogger(\"my_app.worker\")\ndb_logger     = logging.getLogger(\"my_app.worker.db\")\n```\n\n* `my_app.worker` is a **child** of `my_app`.\n* By default, children **propagate** their log messages to parents, unless you disable it:\n\n  ```python\n  worker_logger.propagate = False\n  ```\n\nSo if you log from `my_app.worker`, it can bubble up to `my_app`’s handlers (and then to root).", "repository": "pandey-g/various_notes", "url": "https://github.com/pandey-g/various_notes/blob/7b2514cd235f6af69599f34b57c750dca0c9d9f3/JWT.md?plain=1", "original_guideline": "Logger names form a dot-separated hierarchy. Example: * `my_app.worker` is a child of `my_app`. By default, children propagate their log messages to parents, unless you disable it: So if you log from `my_app.worker`, it can bubble up to `my_app`’s handlers (and then to root)."}]}, {"id": "CG-1670", "guideline": "Logger.fine(\"Attempting to write to data file: \" + filePath);.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1671", "guideline": "Logging best practices with Logback.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1672", "guideline": "Logging Libraries: Winston, Pino, Morgan.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1673", "guideline": "Logging policy: new code should use structlog.get_logger() instead of logging.getLogger(). Existing logging.getLogger() calls will be converted opportunistically. The LOG rule set is enabled above to catch common logging anti-patterns (e.g. LOG001: direct use of logging.WARN).", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1674", "guideline": "Logging shapes that don't compose with structured logging: `android.util.Log.v/d/i/w/e` calls (flat global logger; prefer Timber or `androidx.tracing`) and `System.out.println` on Android (untagged logcat output).", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1675", "guideline": "Logging sink failures do not crash orchestration.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1676", "guideline": "Logging: Use a logger to record important events and errors, which helps with debugging.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1677", "guideline": "Logging: Uses `structlog` with structured JSON output.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1678", "guideline": "Logs must ensure the security of the logging framework and handle sensitive information. Use mature, production-validated logging libraries, not custom solutions.", "dimension": "How to log", "theme": "Logging utility integration", "theme_basis": "Deductive",
