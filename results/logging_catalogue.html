ured JSON log entries with fields such as `timestamp`, `severity`, `service.name`, `service.version`, `environment`, `region`, `trace_id`, `span_id`, `operation`, `correlation_id`, `causation_id`, `event_id`, `event_type`, `tenant_id`, and 7 more."}]}, {"id": "CG-0587", "guideline": "Use structured JSON log entries with fields such as `timestamp`, `severity`, `service.name`, `service.version`, `environment`, `region`, `trace_id`, `span_id`, `operation`, `correlation_id`, `event_type`, `tenant_id`, `device_id`, `message`, and 6 more.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "```json\n{\n  \"timestamp\": \"2024-01-15T10:31:00.000Z\",\n  \"severity\": \"WARN\",\n  \"service.name\": \"notification-service\",\n  \"service.version\": \"3.1.0\",\n  \"environment\": \"production\",\n  \"region\": \"us-east-1\",\n  \"trace_id\": \"ccf92f3577b34da6a3ce929d0e0ebbbb\",\n  \"span_id\": \"22f067aa0ba902d9\",\n  \"operation\": \"sendAlertNotification\",\n  \"correlation_id\": \"corr-alert-789\",\n  \"event_type\": \"device.alert.notification_sent\",\n  \"tenant_id\": \"HOSP-789\",\n  \"device_id\": \"DEV-PM100-0042\",\n  \"message\": \"Notification sent after retry\",\n  \"outcome\": \"success\",\n  \"notification.channel\": \"sms\",\n  \"notification.recipient_count\": 3,\n  \"retry.count\": 1,\n  \"retry.max\": 3,\n  \"duration_ms\": 2500\n}\n```", "repository": "senapatisantosh/DistributedLog", "url": "https://github.com/senapatisantosh/DistributedLog/blob/188389e74106aa74155a74af14d036a7d7aaab07/docs/structured-logging-strategy.md?plain=1", "original_guideline": "Use structured JSON log entries with fields such as `timestamp`, `severity`, `service.name`, `service.version`, `environment`, `region`, `trace_id`, `span_id`, `operation`, `correlation_id`, `event_type`, `tenant_id`, `device_id`, `message`, and 6 more."}]}, {"id": "CG-0588", "guideline": "Use structured JSON log entries with fields such as `timestamp`, `severity`, `service.name`, `service.version`, `environment`, `region`, `trace_id`, `span_id`, `operation`, `correlation_id`, `tenant_id`, `device_id`, `message`, `outcome`, and 4 more.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "```json\n{\n  \"timestamp\": \"2024-01-15T10:30:45.123Z\",\n  \"severity\": \"INFO\",\n  \"service.name\": \"ingestion-api\",\n  \"service.version\": \"2.4.1\",\n  \"environment\": \"production\",\n  \"region\": \"us-east-1\",\n  \"trace_id\": \"4bf92f3577b34da6a3ce929d0e0e4736\",\n  \"span_id\": \"00f067aa0ba902b7\",\n  \"operation\": \"POST /api/v2/device-events\",\n  \"correlation_id\": \"corr-alert-789\",\n  \"tenant_id\": \"HOSP-789\",\n  \"device_id\": \"DEV-PM100-0042\",\n  \"message\": \"Device event received\",\n  \"outcome\": \"success\",\n  \"http.method\": \"POST\",\n  \"http.status_code\": 202,\n  \"http.path\": \"/api/v2/device-events\",\n  \"duration_ms\": 23\n}\n```", "repository": "senapatisantosh/DistributedLog", "url": "https://github.com/senapatisantosh/DistributedLog/blob/188389e74106aa74155a74af14d036a7d7aaab07/docs/structured-logging-strategy.md?plain=1", "original_guideline": "Use structured JSON log entries with fields such as `timestamp`, `severity`, `service.name`, `service.version`, `environment`, `region`, `trace_id`, `span_id`, `operation`, `correlation_id`, `tenant_id`, `device_id`, `message`, `outcome`, and 4 more."}]}, {"id": "CG-0589", "guideline": "Use structured log fields for ISO 8601 timestamp, severity, service, machine-readable action, human-readable message, hostname/container ID, and request correlation ID; ERROR logs should additionally carry structured error message and stack trace data.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0590", "guideline": "Use structured logging instead of print statements.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0591", "guideline": "Use the following logging configuration: `duration_ms`: integer, Operation duration, `45`; `retry.count`: integer, Current retry attempt, `2`; `retry.max`: integer, Maximum retries, `3`; `queue.depth`: integer, Queue depth at time of processing, `1500`.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0592", "guideline": "Use the following logging configuration: `error.code`: string, Machine-readable error code, `SCHEMA_MISMATCH`; `error.message`: string, Error detail, `Expected int, got string`; `error.type`: string, Exception class, `ValidationException`; `error.stacktrace`: string, Stack trace (truncated), `...`.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0593", "guideline": "Use the following logging configuration: `region`: string, Cloud region, `us-east-1`; `trace_id`: string, W3C trace ID, `4bf92f3577b34da6...`; `span_id`: string, W3C span ID, `00f067aa0ba902b7`; `operation`: string, Operation/function name, `validateDeviceEvent`; `outcome`: string (enum), Result of operation, `success`, `failure`, `partial`, `skipped`.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0594", "guideline": "Use the following logging configuration: `timestamp`: ISO 8601 datetime, When the log was emitted, `2024-01-15T10:30:45.123Z`; `severity`: string (enum), Log level, `DEBUG`, `INFO`, `WARN`, `ERROR`, `FATAL`; `service.name`: string, Name of the emitting service, `ingestion-service`; `service.version`: string, Deployed version, `2.4.1`; `environment`: string, Deployment environment, `production`, `staging`, `dev`; `message`: string, Human-readable log message, `Device event received`.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0595", "guideline": "Use the following logging configuration: duration_ms: number, How long it took; metadata: object, Additional context; error: string, Error message if failed; stack_trace: string, Stack trace if error; agent_id: string, Which agent logged this.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0596", "guideline": "Use the following logging configuration: timestamp: ISO8601 string, When the action occurred; level: string, Log level (DEBUG, INFO, WARN, ERROR); category: string, Category of operation; action: string, What was done; target: string, What was acted upon; result: string, success, failure, skipped.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0597", "guideline": "Use uuid4() only for NEW operations NEVER generate new trace_id when processing existing events ALWAYS extract and propagate existing trace_id.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "```python\n# Use uuid4() only for NEW operations\nnew_trace_id = str(uuid.uuid4())\n\n# NEVER generate new trace_id when processing existing events\n# ALWAYS extract and propagate existing trace_id\nincoming_trace_id = event_data.get(\"trace_id\")\n```", "repository": "SamuelMatthew95/trading-control", "url": "https://github.com/SamuelMatthew95/trading-control/blob/23f31d9205555629194fde09c11c7c87e34dcd6e/.claude/rules/memory-logging.md?plain=1", "original_guideline": "Use uuid4() only for NEW operations NEVER generate new trace_id when processing existing events ALWAYS extract and propagate existing trace_id."}]}, {"id": "CG-0598", "guideline": "What to Log: Connection state changes Order submissions and status changes Data subscription events Error conditions and exceptions Performance metrics Configuration changes.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0599", "guideline": "When a `task` envelope includes `requires.decision_evidence`, the responding agent SHOULD include a `decision_evidence` object in the `result` payload.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0600", "guideline": "When a log event includes an `httpCode` value, the enum will be decorated with `[HttpStatusCode]`, which can be used for API documentation and response type specification.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0601", "guideline": "When vendor API integrations fail, log or expose an anonymized representation of the failed payload that preserves its structure for diagnosis without revealing detailed sensitive content.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0602", "guideline": "Whenever LiteRun catches or wraps a critical exception, it generates a normalized dictionary payload. This payload is injected into the standard Python `logging` module under the `extra={\"literun_error\": ...}` parameter.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0603", "guideline": "Write examples for timing and performance logging patterns.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0604", "guideline": "Writing a lambda expression for this argument allows us to use the `HandleError` extension method written in {Project}.Core\\\\Extensions\\\\LogExtensions.cs and provide our `LogProvider` instance to the method.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0605", "guideline": "You need to make the call which one to use. Passing a `context.Context` is more standard, on the other hand you then need to call `log.FromContext` everywhere.", "dimension": "What to log", "theme": "State dump", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0606", "guideline": "\"Log the error before handling or rethrowing\".", "dimension": "Where to log", "theme": "Exception logging", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0607", "guideline": "Avoid catching errors without logging them.", "dimension": "Where to log", "theme": "Exception logging", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0608", "guideline": "Avoid logging right before raise; either re-raise or wrap with useful context before raising.", "dimension": "Where to log", "theme": "Exception logging", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0609", "guideline": "Background Tasks: Exception where error logging is required since there's no caller to return to.", "dimension": "Where to log", "theme": "Exception logging", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0610", "guideline": "Catching an exception doesn't mean it is an error or warning. Assign categories based on the rules above.", "dimension": "Where to log", "theme": "Exception logging", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0611", "guideline": "Catching errors and reporting them to monitoring (Sentry/Datadog) before handling.", "dimension": "Where to log", "theme": "Exception logging", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0612", "guideline": "Do not log re-thrown exceptions. If this is done, chances are that this exception is logged twice (making diagnosis harder). All not handled exceptions are logged at entry points (main or request handlers), there is no need to log them in every catch, or where they are thrown.", "dimension": "Where to log", "theme": "Exception logging", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0613", "guideline": "Error Logging: Only at the top of the call stack where errors are actually handled.", "dimension": "Where to log", "theme": "Exception logging", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0614", "guideline": "Exception handlers should preserve original exception.", "dimension": "Where to log", "theme": "Exception logging", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0615", "guideline": "Exceptions should be logged or rethrown — not both.", "dimension": "Where to log", "theme": "Exception logging", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0616", "guideline": "Generic catch-all handlers: Hiding real issues.", "dimension": "Where to log", "theme": "Exception logging", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0617", "guideline": "Implement structured logging, request ID tracking, and global exception filters in the API for better monitoring and debugging.", "dimension": "Where to log", "theme": "Exception logging", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-0618", "guideline": "Log the start of prompt sending and log caught exceptions with failure context around the asynchronous operation.", "dimension": "Where to log", "theme": "Exception logging", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "private async void BtnSendPrompt_Click(object sender, RoutedEventArgs e)\n{\n    try\n    {\n        FileLog.Write(\"[MainWindow] Sending prompt\");\n        await SendPromptAsync();  // No try-catch inside\n    }\n    catch (Exception ex)\n    {\n        FileLog.Write($\"[MainWindow] Send prompt FAILED: {ex}\");\n        ShowError(\"Failed to send prompt. Please try again.\");\n    }\n}", "repository": "thefrederiksen/cc-director", "url": "https://github.com/thefrederiksen/cc-director/blob/6ecea6e34dce31cc19ae1ace331dee120fc0308d/docs/CodingStyle.md?plain=1", "original_guideline": "Log the start of prompt sending and log caught exceptions with failure context around the asynchronous operation."}]}, {"id": "CG-0619", "guideline": "Trace payment authorization operations with an activity span, attach payment, customer, HTTP-status, and authorization-result tags, and log caught exceptions at ERROR level before rethrowing them.", "dimension": "Where to log", "theme": "Exception logging", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "// Good - Activity and tracing for distributed systems\npublic class PaymentGatewayService : IPaymentGatewayService\n{\n    private static readonly ActivitySource ActivitySource = new(\"PaymentGateway\");\n    private readonly HttpClient _httpClient;\n    private readonly ILogger<PaymentGatewayService> _logger;\n\n    public async Task<AuthorizationResult> AuthorizePaymentAsync(\n        AuthorizationRequest request,\n        CancellationToken cancellationToken = default)\n    {\n        using var activity = ActivitySource.StartActivity(\"payment.authorize\");\n        activity?.SetTag(\"payment.amount\", request.Amount.ToString());\n        activity?.SetTag(\"payment.currency\", request.Currency);\n        activity?.SetTag(\"customer.id\", request.CustomerId.ToString());\n\n        try\n        {\n            var httpRequest = new HttpRequestMessage(HttpMethod.Post, \"/authorize\")\n            {\n                Content = JsonContent.Create(request)\n            };\n\n            var response = await _httpClient.SendAsync(httpRequest, cancellationToken);\n            \n            activity?.SetTag(\"http.status_code\", (int)response.StatusCode);\n            \n            if (response.IsSuccessStatusCode)\n            {\n                var result = await response.Content.ReadFromJsonAsync<AuthorizationResult>(cancellationToken: cancellationToken);\n                activity?.SetTag(\"authorization.result\", \"success\");\n                return result!;\n            }\n\n            activity?.SetTag(\"authorization.result\", \"failed\");\n            activity?.SetStatus(ActivityStatusCode.Error, \"Authorization failed\");\n            \n            return AuthorizationResult.Failed(\"Gateway authorization failed\");\n        }\n        catch (Exception ex)\n        {\n            activity?.SetStatus(ActivityStatusCode.Error, ex.Message);\n            _logger.LogError(ex, \"Payment authorization failed\");\n            throw;\n        }\n    }\n}", "repository": "jeastham1993/developer-prompts", "url": "https://github.com/jeastham1993/developer-prompts/blob/4c425502ecda97e28ac0ed823b9dcd7fa15de48e/dotnet.md?plain=1", "original_guideline": "Trace payment authorization operations with an activity span, attach payment, customer, HTTP-status, and authorization-result tags, and log caught exceptions at ERROR level before rethrowing them."}]}, {"id": "CG-0620", "guideline": "When catching `LiteRunError`, log the error with structured context including the LiteRun error code and context, the application user ID, and the trace ID.", "dimension": "Where to log", "theme": "Exception logging", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "```python\nimport logging\nfrom fastapi import APIRouter, HTTPException\nfrom literun.errors import LiteRunError\n\nrouter = APIRouter()\nlogger = logging.getLogger(\"my_app_logger\")\n\n@router.post(\"/chat\")\nasync def chat_endpoint(request: ChatRequest):\n    try:\n        result = await agent.arun(request.prompt)\n        return {\"response\": result.output}\n        \n    except LiteRunError as exc:\n        # Extract LiteRun's structured context\n        log_payload = {\n            \"literun_code\": exc.error_code.value,\n            \"literun_context\": exc.context,\n            \"user_id\": request.user_id, # Your application's context\n            \"trace_id\": request.trace_id\n        }\n        \n        logger.error(f\"Agent execution failed: {exc}\", extra=log_payload)\n        \n        if exc.retryable_error:\n            raise HTTPException(status_code=503, detail=\"Service temporarily unavailable.\")\n        raise HTTPException(status_code=400, detail=\"Unable to process request.\")\n```", "repository": "kaustubh-tr/literun", "url": "https://github.com/kaustubh-tr/literun/blob/a263e556cc0cd1199e21369860518dcf96ab95cf/DOCS.md?plain=1", "original_guideline": "When catching `LiteRunError`, log the error with structured context including the LiteRun error code and context, the application user ID, and the trace ID."}]}, {"id": "CG-0621", "guideline": "\"--log-directory\", \"/var/log/sharptools/\",.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0622", "guideline": "(This should also be logged to syslog).", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0623", "guideline": ".. code-block:: python import logging from logging.handlers import RotatingFileHandler Rotating file handler (10 MB max, 5 backups) handler = RotatingFileHandler( \"pyxcp.log\", maxBytes=10*1024*1024, backupCount=5 ) formatter = logging.Formatter( \"%(asctime)s [%(name)s] %(levelname)s: %(message)s\" ) handler.setFormatter(formatter) pyxcp_logger = logging.getLogger(\"pyxcp\") pyxcp_logger.addHandler(handler) pyxcp_logger.setLevel(logging.WARNING) # Production: warnings only.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": [{"reason": ".. code-block:: python\n\n   import logging\n   from logging.handlers import RotatingFileHandler\n\n   # Rotating file handler (10 MB max, 5 backups)\n   handler = RotatingFileHandler(\n       \"pyxcp.log\",\n       maxBytes=10*1024*1024,\n       backupCount=5\n   )\n   formatter = logging.Formatter(\n       \"%(asctime)s [%(name)s] %(levelname)s: %(message)s\"\n   )\n   handler.setFormatter(formatter)\n\n   pyxcp_logger = logging.getLogger(\"pyxcp\")\n   pyxcp_logger.addHandler(handler)\n   pyxcp_logger.setLevel(logging.WARNING)  # Production: warnings only", "repository": "christoph2/pyxcp", "url": "https://github.com/christoph2/pyxcp/blob/9a8a2f966ad173ebafb9ccf76a0be65403b1457a/docs/logging.rst", "original_guideline": ".. code-block:: python import logging from logging.handlers import RotatingFileHandler Rotating file handler (10 MB max, 5 backups) handler = RotatingFileHandler( \"pyxcp.log\", maxBytes=10*1024*1024, backupCount=5 ) formatter = logging.Formatter( \"%(asctime)s [%(name)s] %(levelname)s: %(message)s\" ) handler.setFormatter(formatter) pyxcp_logger = logging.getLogger(\"pyxcp\") pyxcp_logger.addHandler(handler) pyxcp_logger.setLevel(logging.WARNING) # Production: warnings only."}]}, {"id": "CG-0624", "guideline": "10514: Receives logs from Datadog Agent.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0625", "guideline": "7.3.1 Application Logging MUST be organized using standard tools in a way that allows the application administrator to define and modify the logs output (at least the file, database, syslogd), logging levels, and logging format.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0626", "guideline": "] Replace ad-hoc `Debug.WriteLine`/`Console.WriteLine` diagnostics with `ILogger` (structured levels, timestamped output, centralized configuration).[.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0627", "guideline": "`--log-directory <path>` - Directory for log files.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0628", "guideline": "`logs/` directory is gitignored - avoid committing log files.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0629", "guideline": "`Ougai::Logger.broadcast` can be used to like `ActiveSupport::Logger.broadcast`. An example Original `logger` outputs STDOUT and `error_logger` outputs `./error.log`. Every calling for `logger` is propagated to `error_logger`. ##### STDOUT ##### error.log.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": [{"reason": "`Ougai::Logger.broadcast` can be used to like `ActiveSupport::Logger.broadcast`.\n\n#### An example\n\nOriginal `logger` outputs STDOUT and `error_logger` outputs `./error.log`.\nEvery calling for `logger` is propagated to `error_logger`.\n\n```ruby\nlogger = Ougai::Logger.new(STDOUT)\nlogger.level = Logger::INFO\n\nerror_logger = Ougai::Logger.new('./error.log')\nerror_logger.level = Logger::ERROR\nlogger.extend Ougai::Logger.broadcast(error_logger)\n\nlogger.info('Hello!')\n\nlogger.error('Failed to do something.')\n\nlogger.level = Logger::WARN # error_logger level is also set WARN by propagation\nlogger.warn('Ignored something.')\n```\n\n##### STDOUT\n\n```json\n{\"name\":\"main\",\"hostname\":\"mint\",\"pid\":24915,\"level\":30,\"time\":\"2017-08-16T17:23:42.415+09:00\",\"v\":0,\"msg\":\"Hello!\"}\n{\"name\":\"main\",\"hostname\":\"mint\",\"pid\":24915,\"level\":50,\"time\":\"2017-08-16T17:23:42.416+09:00\",\"v\":0,\"msg\":\"Failed to do something.\"}\n{\"name\":\"main\",\"hostname\":\"mint\",\"pid\":24915,\"level\":40,\"time\":\"2017-08-16T17:23:42.416+09:00\",\"v\":0,\"msg\":\"Ignored something.\"}\n```\n\n##### error.log\n\n```json\n{\"name\":\"main\",\"hostname\":\"mint\",\"pid\":24915,\"level\":50,\"time\":\"2017-08-16T17:23:42.415+09:00\",\"v\":0,\"msg\":\"Failed to do something.\"}\n{\"name\":\"main\",\"hostname\":\"mint\",\"pid\":24915,\"level\":40,\"time\":\"2017-08-16T17:23:42.416+09:00\",\"v\":0,\"msg\":\"Ignored something.\"}\n```", "repository": "tilfin/ougai", "url": "https://github.com/tilfin/ougai/blob/397d07713c93f92a125c7ef6915f23c07df7db63/README.md?plain=1", "original_guideline": "`Ougai::Logger.broadcast` can be used to like `ActiveSupport::Logger.broadcast`. An example Original `logger` outputs STDOUT and `error_logger` outputs `./error.log`. Every calling for `logger` is propagated to `error_logger`. ##### STDOUT ##### error.log."}]}, {"id": "CG-0630", "guideline": "`SSE server: Console + optional file via `--log-file``.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0631", "guideline": "`Stdio server: Console (stderr) + optional directory via `--log-directory``.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0632", "guideline": "A central S3 bucket in a dedicated security account is the AWS Well-Architected best practice for log centralization. S3 in the security account is isolated from production workloads, supports S3 Object Lock for tamper-proof audit logs, integrates with Athena for SQL querying, and costs significantly less than CloudWatch Logs for long-term storage.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0633", "guideline": "A company runs workloads across 5 AWS accounts (dev, staging, prod, security, shared-services). The security team needs centralized access to all logs from all accounts for compliance monitoring. Currently each account's logs are isolated in its own CloudWatch Log Groups with no cross-account access.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0634", "guideline": "A Splunk forwarder is pre-installed and all indexes are pre-created. Technology add-ons are also preconfigured.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0635", "guideline": "All logs go to the console and a log file with the name pattern `logs/bring-yyyy-MM-dd.log`.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0636", "guideline": "All services must implement structured logging in JSON format and write to `stdout`.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0637", "guideline": "Always log to stdout/stderr - Never write to files.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0638", "guideline": "Always update ai.log with commands run and results.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0639", "guideline": "App -->|\"logs (stdout)\"| Agent.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0640", "guideline": "Architect the log aggregation pipeline (Scaleway Cockpit for SaaS · self-hosted Grafana Loki for self-hosted NPO deployments).", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0641", "guideline": "As noted earlier in this post, you must configure data events on a trail created in CloudTrail. During configuration, you will need to specify the function from which logs will be captured by your trail, and the destination S3 bucket where they will be stored.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0642", "guideline": "Avoid Duplication: Since Cobra prints returned errors to stderr, logging them in commands creates duplicate output.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0643", "guideline": "Avoid storing audit events only in log files.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0644", "guideline": "AWS CloudTrail Lake — Either from the console, or programmatically, you can query stored events in your configured CloudTrail Lake from the time of its configuration, up until the maximum storage duration of 2,557 days (7 years) from the time that you make your query. This approach allows for SQL-based queries, and it is ideal for when you need to make more complex queries against events, but don’t require the additional features of a SIEM solution.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0645", "guideline": "AWS Lambda automatically monitors Lambda functions on your behalf and sends logs to CloudWatch. Your Lambda function comes with a CloudWatch Logs log group and a log stream for each instance of your function. The Lambda runtime environment sends details about each invocation to the log stream, and relays logs and other output from your function’s code.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0646", "guideline": "Bare Console Logs: Usage of `console.log` instead of structured loggers.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0647", "guideline": "Be strategic with Loki labels.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0648", "guideline": "By default, all signale instances log their messages to the `process.stdout` stream. This can be modified, to match your own preference, through the `stream` property, where you can define a single or multiple valid Writable streams, which will be used by all logger types to log your data. Additionally, it is possible to define one or more Writable streams exclusively for a specific logger type, thus write data independently from the rest logger types.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0649", "guideline": "CC Director uses `FileLog` for structured logging. Logs are written to: `%LOCALAPPDATA%/CcDirector/logs/director-YYYY-MM-DD-PID.log`.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0650", "guideline": "Central S3 bucket in security account with CloudWatch Logs subscription filters streaming to it.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0651", "guideline": "Centralize logs with journald/journalctl.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "2", "examples": []}, {"id": "CG-0652", "guideline": "Centralized logging across all containerized services.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0653", "guideline": "Centralized Logging — Collect logs from all pipeline stages for debugging.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0654", "guideline": "Centralized Logging: Single point of analysis Tamper resistance Consistent formatting Automated processing Better security controls.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0655", "guideline": "Check ai.log first to understand current project state.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0656", "guideline": "CloudTrail Event History — Either from the console, or programmatically, you can query CloudTrail management events from the last 90-day period. This is ideal for when you have simple queries to make within the last 90 days, and you don’t need stored logs or more complex queries.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0657", "guideline": "CloudWatch Logs subscription filters streaming in real-time via Kinesis Data Firehose.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0658", "guideline": "CloudWatch Logs subscription filters with Kinesis Data Firehose provide near-real-time log delivery (seconds of latency) without polling. Daily batch exports mean the security team is always looking at yesterday's data during active incidents — unacceptable for compliance monitoring and incident response.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0659", "guideline": "Configure the Kibana log output endpoint, API key, index pattern, and output selection through environment variables.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": [{"reason": "```bash\nexport DIFFDASH_KIBANA_URL=https://my-deployment.kb.region.aws.elastic.cloud\nexport DIFFDASH_KIBANA_API_KEY=your-api-key\nexport DIFFDASH_KIBANA_INDEX_PATTERN=logs-myapp-default\nexport DIFFDASH_OUTPUTS=kibana\n```", "repository": "rossme/diffdash", "url": "https://github.com/rossme/diffdash/blob/cdc89a3381495a786d3ac8afe0a3fb4c0bdb7beb/DOCS.md?plain=1", "original_guideline": "Configure the Kibana log output endpoint, API key, index pattern, and output selection through environment variables."}]}, {"id": "CG-0660", "guideline": "Consider using `RotatingFileHandler` in production to avoid huge log files.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0661", "guideline": "Console and file logging with different formats.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0662", "guideline": "Console output for inspection structkit generate config.yaml --output console.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0663", "guideline": "Console.log(): Simple logging (remove in production).", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0664", "guideline": "Create a TLS syslog log drain, bind it to the application, and restage the application so logs are forwarded to the drain.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": [{"reason": "```bash\ncf cups my-log-drain -l syslog-tls://logs.example.com:6514\ncf bind-service my-app my-log-drain\ncf restage my-app\n```", "repository": "adhocteam/cloud-gov-instructions", "url": "https://github.com/adhocteam/cloud-gov-instructions/blob/64a6f40c7c07c5832faa4c9c9379df92b9ab311e/README.md?plain=1", "original_guideline": "Create a TLS syslog log drain, bind it to the application, and restage the application so logs are forwarded to the drain."}]}, {"id": "CG-0665", "guideline": "Data Transformation: Enrich, redact, or modify telemetry before sending to Datadog.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0666", "guideline": "Default behavior: `LOG_TYPES=\"stderr\"`. Logs are visible via `docker logs`. Example (Adapted from the quickstart guide): Keep `docker logs` (stderr) AND send to a central syslog container (needed for Web UI and CrowdSec).", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": [{"reason": "**Default behavior**: `LOG_TYPES=\"stderr\"`. Logs are visible via `docker logs`.\n\n    **Example (Adapted from the quickstart guide)**: Keep `docker logs` (stderr) AND send to a central syslog container (needed for Web UI and CrowdSec).\n\n    ```yaml\n    x-bw-env: &bw-env\n      # We use an anchor to avoid repeating the same settings for both services\n      API_WHITELIST_IP: \"127.0.0.0/8 10.20.30.0/24\" # Make sure to set the correct IP range so the scheduler can send the configuration to the instance\n      # Optional: set an API token and mirror it in both containers\n      API_TOKEN: \"\"\n      DATABASE_URI: \"mariadb+pymysql://bunkerweb:changeme@bw-db:3306/db\" # Remember to set a stronger password for the database\n      # Service Logs\n      LOG_TYPES: \"stderr syslog\"\n      LOG_SYSLOG_ADDRESS: \"udp://bw-syslog:514\"\n      # LOG_SYSLOG_TAG will be automatically set per service (override per-service if needed)\n      # NGINX Logs: Send to Syslog (bunkerweb only)\n      ACCESS_LOG_1: \"syslog:server=bw-syslog:514,tag=bunkerweb_access\"\n      ERROR_LOG_1: \"syslog:server=bw-syslog:514,tag=bunkerweb\"\n\n    services:\n      bunkerweb:\n        # This is the name that will be used to identify the instance in the Scheduler\n        image: bunkerity/bunkerweb:1.6.11\n        ports:\n          - \"80:8080/tcp\"\n          - \"443:8443/tcp\"\n          - \"443:8443/udp\" # For QUIC / HTTP3 support\n        environment:\n          <<: *bw-env # We use the anchor to avoid repeating the same settings for all services\n        restart: \"unless-stopped\"\n        networks:\n          - bw-universe\n          - bw-services\n\n      bw-scheduler:\n        image: bunkerity/bunkerweb-scheduler:1.6.11\n        environment:\n          <<: *bw-env\n          BUNKERWEB_INSTANCES: \"bunkerweb\" # Make sure to set the correct instance name\n          SERVER_NAME: \"\"\n          MULTISITE: \"yes\"\n          UI_HOST: \"http://bw-ui:7000\" # Change it if needed\n          USE_REDIS: \"yes\"\n          REDIS_HOST: \"redis\"\n        volumes:\n          - bw-storage:/data # This is used to persist the cache and other data like the backups\n        restart: \"unless-stopped\"\n        networks:\n          - bw-universe\n          - bw-db\n\n      bw-ui:\n        image: bunkerity/bunkerweb-ui:1.6.11\n        environment:\n          <<: *bw-env\n        volumes:\n          - bw-logs:/var/log/bunkerweb # This is used to read the syslog logs from the Web UI\n        restart: \"unless-stopped\"\n        networks:\n          - bw-universe\n          - bw-db\n\n      bw-db:\n        image: mariadb:11\n        # We set the max allowed packet size to avoid issues with large queries\n        command: --max-allowed-packet=67108864\n        environment:\n          MYSQL_RANDOM_ROOT_PASSWORD: \"yes\"\n          MYSQL_DATABASE: \"db\"\n          MYSQL_USER: \"bunkerweb\"\n          MYSQL_PASSWORD: \"changeme\" # Remember to set a stronger password for the database\n        volumes:\n          - bw-data:/var/lib/mysql\n        restart: \"unless-stopped\"\n        networks:\n          - bw-db\n\n      redis: # Redis service for the persistence of reports/bans/stats\n        image: redis:8-alpine\n        command: >\n          redis-server\n          --maxmemory 256mb\n          --maxmemory-policy volatile-lru\n          --save 60 1000\n          --appendonly yes\n        volumes:\n          - redis-data:/data\n        restart: \"unless-stopped\"\n        networks:\n          - bw-universe\n\n      bw-syslog:\n        image: balabit/syslog-ng:4.10.2\n        cap_add:\n          - NET_BIND_SERVICE  # Bind to low ports\n          - NET_BROADCAST  # Send broadcasts\n          - NET_RAW  # Use raw sockets\n          - DAC_READ_SEARCH  # Read files bypassing permissions\n          - DAC_OVERRIDE  # Override file permissions\n          - CHOWN  # Change ownership\n          - SYSLOG  # Write to system logs\n        volumes:\n          - bw-logs:/var/log/bunkerweb # This is the volume used to store the logs\n          - ./syslog-ng.conf:/etc/syslog-ng/syslog-ng.conf # This is the syslog-ng configuration file\n        restart: \"unless-stopped\"\n        networks:\n          - bw-universe\n\n    volumes:\n      bw-data:\n      bw-storage:\n      redis-data:\n      bw-logs:\n\n    networks:\n      bw-universe:\n        name: bw-universe\n        ipam:\n          driver: default\n          config:\n            - subnet: 10.20.30.0/24 # Make sure to set the correct IP range so the scheduler can send the configuration to the instance\n      bw-services:\n        name: bw-services\n      bw-db:\n        name: bw-db\n    ```", "repository": "bunkerity/bunkerweb", "url": "https://github.com/bunkerity/bunkerweb/blob/515efe94ab3982e6ab01768fb1ff46d3871c1b95/docs/advanced.md?plain=1", "original_guideline": "Default behavior: `LOG_TYPES=\"stderr\"`. Logs are visible via `docker logs`. Example (Adapted from the quickstart guide): Keep `docker logs` (stderr) AND send to a central syslog container (needed for Web UI and CrowdSec)."}]}, {"id": "CG-0667", "guideline": "Default behavior: Logs are written to `stderr` and visible via `kubectl logs`. Example: Enable the built-in syslog sidecar in the Helm chart to collect logs for the Web UI (requires BunkerWeb 1.6.7+). See the full logging.yaml example in the bunkerity/bunkerweb-helm repository.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": [{"reason": "**Default behavior**: Logs are written to `stderr` and visible via `kubectl logs`.\n\n    **Example**: Enable the built-in syslog sidecar in the Helm chart to collect logs for the Web UI (requires BunkerWeb 1.6.7+).\n\n    ```yaml\n    ui:\n      logs:\n        # Enable log collection sidecar\n        enabled: true\n\n        # Syslog address for log forwarding\n        # Automatically set to Sidecar service if empty\n        syslogAddress: \"\"\n\n        # Syslog-ng container for log collection\n        repository: docker.io/balabit/syslog-ng\n        pullPolicy: Always\n        tag: 4.8.0\n\n        # Persistent storage for logs\n        persistence:\n          size: 5Gi\n          storageClass: \"\"\n    ```\n\n    See the full [logging.yaml example](https://github.com/bunkerity/bunkerweb-helm/blob/dev/examples/logging.yaml) in the [bunkerity/bunkerweb-helm repository](https://github.com/bunkerity/bunkerweb-helm).", "repository": "bunkerity/bunkerweb", "url": "https://github.com/bunkerity/bunkerweb/blob/515efe94ab3982e6ab01768fb1ff46d3871c1b95/docs/advanced.md?plain=1", "original_guideline": "Default behavior: Logs are written to `stderr` and visible via `kubectl logs`. Example: Enable the built-in syslog sidecar in the Helm chart to collect logs for the Web UI (requires BunkerWeb 1.6.7+). See the full logging.yaml example in the bunkerity/bunkerweb-helm repository."}]}, {"id": "CG-0668", "guideline": "Design a centralized log aggregation pipeline for multi-account environments.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0669", "guideline": "Do not attempt protocol JSON parsing on stderr.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0670", "guideline": "Do not use `console.xxx` functions directly. Instead, use `GraphAILogger` to manage user-facing logs and control output based on verbosity flags.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0671", "guideline": "Document significant findings in ai.log.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0672", "guideline": "Emits structured runtime logs to one or more configured sinks.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0673", "guideline": "Example: * When `app.log` > 5 KB: `app.log.1`, `app.log.2`, `app.log.3` are created Oldest gets deleted when limit is exceeded again This avoids disk bloat (especially in production servers where logs run 24/7).", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": [{"reason": "👉 Example:\n\n```python\nfrom logging.handlers import RotatingFileHandler\n\nhandler = RotatingFileHandler(\"app.log\", maxBytes=5000, backupCount=3)\n```\n\n* When `app.log` > 5 KB:\n\n  * `app.log.1`, `app.log.2`, `app.log.3` are created\n  * Oldest gets deleted when limit is exceeded again\n\nThis avoids disk bloat (especially in production servers where logs run 24/7).", "repository": "pandey-g/various_notes", "url": "https://github.com/pandey-g/various_notes/blob/7b2514cd235f6af69599f34b57c750dca0c9d9f3/JWT.md?plain=1", "original_guideline": "Example: * When `app.log` > 5 KB: `app.log.1`, `app.log.2`, `app.log.3` are created Oldest gets deleted when limit is exceeded again This avoids disk bloat (especially in production servers where logs run 24/7)."}]}, {"id": "CG-0674", "guideline": "File (`app.log`) → everything `INFO+`, including from `worker.py`.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": [{"reason": "2. **File (`app.log`)** → everything `INFO+`, including from `worker.py`.\n\n   ```\n   2025-09-03 07:10:00,320 | my_app | INFO | Application started successfully\n   2025-09-03 07:10:00,321 | my_app | WARNING | Low disk space!\n   2025-09-03 07:10:00,322 | worker | DEBUG | Starting work...\n   2025-09-03 07:10:00,323 | my_app | ERROR | Something went wrong during work execution\n   Traceback (most recent call last):\n     ...\n   ZeroDivisionError: division by zero\n   ```", "repository": "pandey-g/various_notes", "url": "https://github.com/pandey-g/various_notes/blob/7b2514cd235f6af69599f34b57c750dca0c9d9f3/JWT.md?plain=1", "original_guideline": "File (`app.log`) → everything `INFO+`, including from `worker.py`."}]}, {"id": "CG-0675", "guideline": "Fluent Bit is lighter weight and ideal for node-level collection.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0676", "guideline": "Follow the latest 20 log lines in real time with `tail -F` for `~/Library/Logs/Claude/mcp*.log`.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": [{"reason": "```bash\n# Follow logs in real-time\ntail -n 20 -F ~/Library/Logs/Claude/mcp*.log\n```", "repository": "aakarsh-sasi/memory-bank-mcp", "url": "https://github.com/aakarsh-sasi/memory-bank-mcp/blob/0813435550c7d9c3c81208d3c9f57946e16ae7e6/docs/requirements.md?plain=1", "original_guideline": "Follow the latest 20 log lines in real time with `tail -F` for `~/Library/Logs/Claude/mcp*.log`."}]}, {"id": "CG-0677", "guideline": "For multi-account log centralization, stream logs to S3 in a dedicated security account via Kinesis Firehose — not cross-account CloudWatch replication.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0678", "guideline": "Forward all syslog messages to the central log server over TCP on port 514.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0679", "guideline": "GlyphOS uses slog and has two drains for logs: syslog and terminal;.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0680", "guideline": "Here is an example of a `syslog-ng.conf` file that you can use to forward the logs to a file.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": [{"reason": "Here is an example of a `syslog-ng.conf` file that you can use to forward the logs to a file:\n\n```conf\n@version: 4.10\n\n# Source configuration to receive logs sent by BunkerWeb services (ACCESS_LOG / ERROR_LOG and LOG_TYPES=syslog)\nsource s_net {\n  udp(\n    ip(\"0.0.0.0\")\n  );\n};\n\n# Template to format log messages\ntemplate t_imp {\n  template(\"$MSG\\n\");\n  template_escape(no);\n};\n\n# Destination configuration to write logs to dynamically named files\ndestination d_dyna_file {\n  file(\n    \"/var/log/bunkerweb/${PROGRAM}.log\"\n    template(t_imp)\n    owner(\"101\")\n    group(\"101\")\n    dir_owner(\"root\")\n    dir_group(\"101\")\n    perm(0440)\n    dir_perm(0770)\n    create_dirs(yes)\n    logrotate(\n      enable(yes),\n      size(100MB),\n      rotations(7)\n    )\n  );\n};\n\n# Log path to direct logs to dynamically named files\nlog {\n  source(s_net);\n  destination(d_dyna_file);\n};\n```", "repository": "bunkerity/bunkerweb", "url": "https://github.com/bunkerity/bunkerweb/blob/515efe94ab3982e6ab01768fb1ff46d3871c1b95/docs/advanced.md?plain=1", "original_guideline": "Here is an example of a `syslog-ng.conf` file that you can use to forward the logs to a file."}]}, {"id": "CG-0681", "guideline": "IAM role in security account with cross-account assume-role access to read S3 centralized logs.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0682", "guideline": "In addition to writing well-structured logs we also want to be able to parse them easily in order to get to the source of any issue faster. For example, if a particular user is known for sending bad queries to a gateway we can quickly grep our log file and see their activity.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0683", "guideline": "Integration with log aggregation tools (syslog, ELK, etc.).", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0684", "guideline": "It is a special file handler that prevents your log file from growing endlessly. You set a maximum size (maxBytes), and when the file exceeds it, it “rotates”: The current file is renamed (e.g., `app.log.1`) A fresh `app.log` is created Keeps up to `backupCount` old files.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0685", "guideline": "It should log an error message to the terminal and syslog.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0686", "guideline": "Keep separate log files per package.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0687", "guideline": "Log `failed to initialize Sentry` at ERROR level with structured field `error`.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": [{"reason": "// Initialize Sentry for crash reporting\n\tif dsn := os.Getenv(\"SENTRY_DSN\"); dsn != \"\" {\n\t\tif err := sentry.Init(sentry.ClientOptions{\n\t\t\tDsn:              dsn,\n\t\t\tRelease:          version.Version,\n\t\t\tEnvironment:      getEnv(\"ENVIRONMENT\", \"development\"),\n\t\t\tTracesSampleRate: 0.2,\n\t\t}); err != nil {\n\t\t\tslog.Error(\"failed to initialize Sentry\", \"error\", err)\n\t\t} else {\n\t\t\tslog.Info(\"Sentry initialized\", \"environment\", getEnv(\"ENVIRONMENT\", \"development\"))\n\t\t}\n\t}", "repository": "philjestin/Daedalus", "url": "https://github.com/philjestin/Daedalus/blob/af954176f91c463860c7f1012ac6ced4059f4145/app.go", "original_guideline": "Log `failed to initialize Sentry` at ERROR level with structured field `error`."}]}, {"id": "CG-0688", "guideline": "Log aggregation.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0689", "guideline": "Log Custom CloudWatch metrics for key operations.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0690", "guideline": "Log Error Tracking: Sentry, Rollbar.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0691", "guideline": "Log errors using the defined error-handling behavior.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": [{"reason": "2. **Keep messages concise and descriptive**:\n   ```javascript\n   // Good\n   console.error('Streaming error:', error.message);\n   \n   // Avoid\n   console.error('An error occurred');\n   ```", "repository": "sveneisenschmidt/n8n-openai-bridge", "url": "https://github.com/sveneisenschmidt/n8n-openai-bridge/blob/98976fe041d5ca6ce4dc01cfc63a60ba3012350e/docs/LOGGING.md?plain=1", "original_guideline": "Log errors using the defined error-handling behavior."}]}, {"id": "CG-0692", "guideline": "Log event consumed (DEBUG or INFO based on volume) Log event processed with outcome (INFO) Include kafka.topic, kafka.partition, kafka.offset Include correlation_id, causation_id from event envelope Log to event journal (separate from diagnostic).", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0693", "guideline": "Log files are recreated daily, keeping logs for the last 10 days. Older files are deleted.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0694", "guideline": "Log INFO for `This goes to app.log`.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": [{"reason": "```python\nlogging.basicConfig(\n    filename=\"app.log\",\n    filemode=\"a\",   # 'w' for overwrite, 'a' for append\n    level=logging.INFO,\n    format=\"%(asctime)s - %(name)s - %(levelname)s - %(message)s\"\n)\n\nlogging.info(\"This goes to app.log\")\n```", "repository": "pandey-g/various_notes", "url": "https://github.com/pandey-g/various_notes/blob/7b2514cd235f6af69599f34b57c750dca0c9d9f3/JWT.md?plain=1", "original_guideline": "Log INFO for `This goes to app.log`."}]}, {"id": "CG-0695", "guideline": "Log Integrate with Sentry for error tracking.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0696", "guideline": "Log messages are output through the console and to a `.log` file.", "dime uctive", "original_count": "1", "examples": [{"reason": "Send logs to multiple destinations:\n\n.. code-block:: python\n\n   import logging\n\n   pyxcp_logger = logging.getLogger(\"pyxcp\")\n   pyxcp_logger.setLevel(logging.DEBUG)\n\n   # Console handler (INFO and above)\n   console = logging.StreamHandler()\n   console.setLevel(logging.INFO)\n   console.setFormatter(logging.Formatter(\"%(levelname)s: %(message)s\"))\n   pyxcp_logger.addHandler(console)\n\n   # File handler (DEBUG and above)\n   file_handler = logging.FileHandler(\"pyxcp_debug.log\")\n   file_handler.setLevel(logging.DEBUG)\n   file_handler.setFormatter(logging.Formatter(\n       \"%(asctime)s [%(name)s] %(levelname)s: %(message)s\"\n   ))\n   pyxcp_logger.addHandler(file_handler)\n\n   # INFO+ to console, DEBUG+ to file", "repository": "christoph2/pyxcp", "url": "https://github.com/christoph2/pyxcp/blob/9a8a2f966ad173ebafb9ccf76a0be65403b1457a/docs/logging.rst", "original_guideline": "Send the same logger to multiple handlers with independent thresholds: write DEBUG-and-above records to a detailed file and INFO-and-above records to the console."}]}, {"id": "CG-0719", "guideline": "Send to centralized service (Sentry, LogRocket, DataDog).", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0720", "guideline": "Set the Datadog Logs intake URL through `DD_LOGS_CONFIG_LOGS_DD_URL`.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0721", "guideline": "Set the logger level to INFO.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": [{"reason": "```ruby\nrequire 'logger'\n\nlogger = Logger.new(STDOUT)\nlogger.level = Logger::INFO\n\nlogger.info(\"Application started\")\nlogger.warn(\"Something might be wrong\")\nlogger.error(\"An error occurred\")\n```", "repository": "adhocteam/cloud-gov-instructions", "url": "https://github.com/adhocteam/cloud-gov-instructions/blob/64a6f40c7c07c5832faa4c9c9379df92b9ab311e/README.md?plain=1", "original_guideline": "Set the logger level to INFO."}]}, {"id": "CG-0722", "guideline": "Set up Promtail to extract labels from your structured logs.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0723", "guideline": "Ship file logs to Loki with Promtail; configure the Loki client endpoint and authentication, set identifying labels such as application and environment, and point the scrape path at the log files.", "dimension": "Where to log", "theme": "Log destination", "theme_basis": "Inductive", "original_count": "1", "examples": [{"reason": "1. **Install Promtail** for log shipping:\n\n```bash\ndocker run -d \\\n  --name promtail \\\n  -v $(pwd)/log:/host/log \\\n  -v $(pwd)/promtail.yml:/etc/promtail/config.yml \\\n  grafana/promtail:2.9.0 \\\n  -config.file=/etc/promtail/config.yml\n```\n\n2. **Create `promtail.yml`**:\n\n```yaml\nserver:\n  http_listen_port: 9080\n  grpc_listen_port: 0\n\npositions:\n  filename: /tmp/positions.yaml\n\nclients:\n  - url: https://logs-prod-xxx.grafana.net/loki/api/v1/push\n    basic_auth:\n      username: <your-user-id>\n      password: <your-api-key>\n\nscrape_configs:\n  - job_name: myapp\n    static_configs:\n      - targets: [localhost]\n        labels:\n          app: myapp\n          env: local\n          __path__: /host/log/*.log\n```", "repository": "rossme/diffdash", "url": "https://github.com/rossme/diffdash/blob/cdc89a3381495a786d3ac8afe0a3fb4c0bdb7beb/DOCS.md?plain=1", "original_guideline": "Ship file logs to Loki with Promtail; configure the Loki client endpoint and authentication, set identifying labels such as application and environment, and point the scrape path at the log files."}]}, {"id": "CG-0724", "guideline": "Standard Console API: All logging uses Node luetooth`, `airpods`, `config`, and `system` for UI, device, configuration, lifecycle, persistence, telemetry, and diagnostic activity.", "dimension": "Where to log", "theme": "Logging scope", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0823", "guideline": "Check the `.log` file for error stacktraces and warnings.", "dimension": "Where to log", "theme": "Logging scope", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0824", "guideline": "Checks whether the logging functionality of a specific instance is enabled.", "dimension": "Where to log", "theme": "Logging scope", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0825", "guideline": "Choose between log storage tiers based on access patterns and cost.", "dimension": "Where to log", "theme": "Logging scope", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0826", "guideline": "Configure a `FileHandler` for the `pyxcp` logger when file-only logging is required, apply a timestamp/logger/level/message formatter, and set the logger to DEBUG to capture all pyxcp activity in the file.", "dimension": "Where to log", "theme": "Logging scope", "theme_basis": "Inductive", "original_count": "1", "examples": [{"reason": "Log to file instead of console:\n\n.. code-block:: python\n\n   import logging\n\n   # Create file handler\n   handler = logging.FileHandler(\"pyxcp_session.log\", mode=\"w\")\n   formatter = logging.Formatter(\n       \"[%(asctime)s] [%(name)s] %(levelname)s: %(message)s\"\n   )\n   handler.setFormatter(formatter)\n\n   # Configure pyxcp logger\n   pyxcp_logger = logging.getLogger(\"pyxcp\")\n   pyxcp_logger.addHandler(handler)\n   pyxcp_logger.setLevel(logging.DEBUG)\n\n   # All pyxcp activity logged to file\n   from pyxcp.cmdline import ArgumentParser\n   ap = ArgumentParser(description=\"File logging\")\n   with ap.run() as xcp:\n       xcp.connect()\n       xcp.disconnect()", "repository": "christoph2/pyxcp", "url": "https://github.com/christoph2/pyxcp/blob/9a8a2f966ad173ebafb9ccf76a0be65403b1457a/docs/logging.rst", "original_guideline": "Configure a `FileHandler` for the `pyxcp` logger when file-only logging is required, apply a timestamp/logger/level/message formatter, and set the logger to DEBUG to capture all pyxcp activity in the file."}]}, {"id": "CG-0827", "guideline": "Configure BunkerWeb NGINX access and error log destinations with `ACCESS_LOG` and `ERROR_LOG`, set error verbosity with `LOG_LEVEL`, and use numbered suffixes for multiple destinations; on Linux, file logs are rotated daily, retained for 7 days, and compressed.", "dimension": "Where to log", "theme": "Logging scope", "theme_basis": "Inductive", "original_count": "1", "examples": [{"reason": "These are standard NGINX logs, configured via **the `bunkerweb` service only**. They support multiple destinations by suffixing the setting name (e.g., `ACCESS_LOG`, `ACCESS_LOG_1` and matching `LOG_FORMAT`, `LOG_FORMAT_1` or `ERROR_LOG`, `ERROR_LOG_1` and their respective `LOG_LEVEL`, `LOG_LEVEL_1`).\n\n- `ACCESS_LOG`: Destination for access logs (default: `/var/log/bunkerweb/access.log`). Accepts file path, `syslog:server=host[:port][,param=value]`, shared buffer `memory:name:size`, or `off` to disable. See [NGINX access_log documentation](https://nginx.org/en/docs/http/ngx_http_log_module.html#access_log) for details.\n- `ERROR_LOG`: Destination for error logs (default: `/var/log/bunkerweb/error.log`). Accepts file path, `stderr`, `syslog:server=host[:port][,param=value]`, or shared buffer `memory:size`. See [NGINX error_log documentation](https://nginx.org/en/docs/ngx_core_module.html#error_log) for details.\n- `LOG_LEVEL`: Verbosity of error logs (default: `notice`).\n\nThese settings accept standard NGINX values, including file paths, `stderr`, `syslog:server=...` (see [NGINX syslog documentation](https://nginx.org/en/docs/syslog.html)), or shared memory buffers. They support multiple destinations via numbered suffixes (see the [multiple settings convention](features.md#multiple-settings)). Other services (Scheduler, UI, Autoconf, etc.) rely solely on `LOG_TYPES`/`LOG_FILE_PATH`/`LOG_SYSLOG_*`.\n\n**Example with multiple access/error logs (bunkerweb only, numbered suffixes):**\n\n```conf\nACCESS_LOG=/var/log/bunkerweb/access.log\nACCESS_LOG_1=syslog:server=unix:/dev/log,tag=bunkerweb\nLOG_FORMAT=$host $remote_addr - $request_id $remote_user [$time_local] \"$request\" $status $body_bytes_sent \"$http_referer\" \"$http_user_agent\"\nLOG_FORMAT_1=$remote_addr - $remote_user [$time_local] \"$request\" $status $body_bytes_sent\nERROR_LOG=/var/log/bunkerweb/error.log\nERROR_LOG_1=syslog:server=unix:/dev/log,tag=bunkerweb\nLOG_LEVEL=notice\nLOG_LEVEL_1=error\n```\n\n### Integration Defaults & Examples\n\n=== \"Linux\"\n\n    **Default behavior**: `LOG_TYPES=\"file\"`. Logs are written to `/var/log/bunkerweb/*.log`. Rotation is handled by the system `logrotate` config installed at `/etc/logrotate.d/bunkerweb` (daily, 7-day retention, compressed via `copytruncate`).", "repository": "bunkerity/bunkerweb", "url": "https://github.com/bunkerity/bunkerweb/blob/515efe94ab3982e6ab01768fb1ff46d3871c1b95/docs/advanced.md?plain=1", "original_guideline": "Configure BunkerWeb NGINX access and error log destinations with `ACCESS_LOG` and `ERROR_LOG`, set error verbosity with `LOG_LEVEL`, and use numbered suffixes for multiple destinations; on Linux, file logs are rotated daily, retained for 7 days, and compressed."}]}, {"id": "CG-0828", "guideline": "Configure the appropriate logging handlers for the required destinations.", "dimension": "Where to log", "theme": "Logging scope", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0829", "guideline": "Configure the logging host with a valid DNS name or IP address.", "dimension": "Where to log", "theme": "Logging scope", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0830", "guideline": "Create the default logger to write to standard output with standard timestamp flags and the configured severity level.", "dimension": "Where to log", "theme": "Logging scope", "theme_basis": "Inductive", "original_count": "2", "examples": [{"reason": "// DefaultLogger is the standard implementation of the Logger interface\ntype DefaultLogger struct {\n\tlevel  LogLevel\n\tmu     sync.Mutex\n\tlogger *log.Logger\n}\n\n// NewLogger creates a new logger instance\nfunc NewLogger(level LogLevel) *DefaultLogger {\n\treturn &DefaultLogger{\n\t\tlevel:  level,\n\t\tlogger: log.New(os.Stdout, \"\", log.LstdFlags),\n\t}\n}", "repository": "noelukwa/localbase", "url": "https://github.com/noelukwa/localbase/blob/566f3289289ba87abd9864d831f63bd82217814e/util.go", "original_guideline": "Create the default logger to write to standard output with standard timestamp flags and the configured severity level."}, {"reason": "// GetLogger extracts the logger from a context.\n// It returns a new empty logger if ctx doesn't contain a logger.\nfunc GetLogger(ctx context.Context) *Logger {\n\tif ctx == nil {\n\t\treturn NewLogger(os.Stdout, nil)\n\t}\n\n\tl, ok := ctx.Value(loggerKey).(*Logger)\n\tif !ok {\n\t\treturn NewLogger(os.Stdout, nil)\n\t}\n\n\treturn l\n}", "repository": "fiskaly/golog", "url": "https://github.com/fiskaly/golog/blob/8f9568c0d5c6e53372eed3e9f7ef13ea48b24329/golog.go", "original_guideline": "Create the default logger to write to standard output with standard timestamp flags and the configured severity level."}]}, {"id": "CG-0831", "guideline": "Creates a (hopefully) unique dump file name incl. milliseconds and the process id in the file name, eg.: `dump_2019-03-13_at_15-39-33.086_PID_15270.rda`.", "dimension": "Where to log", "theme": "Logging scope", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0832", "guideline": "Debug output is organized into logical categories aligned with the application's architecture.", "dimension": "Where to log", "theme": "Logging scope", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0833", "guideline": "Define and enforce structured logging standards across all packages (`api`, `worker`, `shared`, `migrate`).", "dimension": "Where to log", "theme": "Logging scope", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0834", "guideline": "Design the security audit log schema and events catalog.", "dimension": "Where to log", "theme": "Logging scope", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0835", "guideline": "Detect — `AUDIT_LOG_ENABLED=true` plus reverse-proxy access logs are the minimum useful signal source.", "dimension": "Where to log", "theme": "Logging scope", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0836", "guideline": "Developers can enable debug output for specific categories via command-line flags.", "dimension": "Where to log", "theme": "Logging scope", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0837", "guideline": "Developers can enable one or more categories as needed for targeted diagnostics.", "dimension": "Where to log", "theme": "Logging scope", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0838", "guideline": "Disable logging for all loggers belonging to a specific instance.", "dimension": "Where to log", "theme": "Logging scope", "theme_basis": "Inductive", "original_count": "2", "examples": []}, {"id": "CG-0839", "guideline": "Do not use Performance Monitoring: No visibility into app performance Instead: Add monitoring (Vercel Analytics, Google Analytics).", "dimension": "Where to log", "theme": "Logging scope", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0840", "guideline": "DO: Exclude Health Checks and Internal Endpoints When HTTP request/response logging is enabled, you should exclude high-frequency endpoints like health checks to reduce log volume.", "dimension": "Where to log", "theme": "Logging scope", "theme_basis": "Inductive", "original_count": "1", "examples": [{"reason": "#### ✅ **DO: Exclude Health Checks and Internal Endpoints**\n\nWhen HTTP request/response logging is enabled, you should exclude high-frequency endpoints like health checks to reduce log volume.\n\n```typescript\nimport { Controller, Get } from '@nestjs/common';\nimport { NoLog, NoLogClass } from '@paystackhq/nestjs-observability';\n\n// Exclude entire controller from logging (e.g., health checks)\n@Controller('health')\n@NoLogClass() // Disables logs for the whole class\nexport class HealthController {\n  @Get()\n  getHealth() {\n    // This endpoint won't generate request/response logs (even when OTEL_LOG_HTTP_REQUESTS=true)\n    return { status: 'ok', timestamp: Date.now() };\n  }\n\n  @Get('/ready')\n  getReadiness() {\n    // This endpoint also won't be logged\n    return { ready: true };\n  }\n}\n\n// Log most endpoints, but exclude specific ones\n@Controller('users')\nexport class UserController {\n  @Get()\n  getUsers() {\n    // Logged with masked sensitive fields (when OTEL_LOG_HTTP_REQUESTS=true)\n    return this.userService.findAll();\n  }\n\n  @Post()\n  createUser(@Body() userData: CreateUserDto) {\n    // Request/response logged with automatic masking of sensitive fields (when enabled)\n    return this.userService.create(userData);\n  }\n\n  @NoLog() // Exclude specific endpoint from logging\n  @Get('/internal')\n  getInternalData() {\n    // This endpoint won't generate request/response logs (even when OTEL_LOG_HTTP_REQUESTS=true)\n    return this.internalService.getData();\n  }\n}\n```", "repository": "Paystack-MFB/nestjs-observability", "url": "https://github.com/Paystack-MFB/nestjs-observability/blob/87b280d79048785cb4cbf35ea3cb87b91d1b2f81/docs/best-practices.md?plain=1", "original_guideline": "DO: Exclude Health Checks and Internal Endpoints When HTTP request/response logging is enabled, you should exclude high-frequency endpoints like health checks to reduce log volume."}]}, {"id": "CG-0841", "guideline": "DO: Use @NoLog for Sensitive Operations Even when HTTP request/response logging is enabled, you can exclude specific endpoints from being logged.", "dimension": "Where to log", "theme": "Logging scope", "theme_basis": "Inductive", "original_count": "1", "examples": [{"reason": "#### ✅ **DO: Use @NoLog for Sensitive Operations**\n\nEven when HTTP request/response logging is enabled, you can exclude specific endpoints from being logged:\n\n```typescript\n@Controller('auth')\nexport class AuthController {\n  @Post('/login')\n  @NoLog() // Don't log this endpoint at all (even when OTEL_LOG_HTTP_REQUESTS=true)\n  async login(@Body() credentials: LoginDto) {\n    // Authentication logic - not logged for security\n    return this.authService.login(credentials);\n  }\n\n  @Get('/profile')\n  async getProfile() {\n    // Regular endpoints will be logged with masked sensitive fields (when OTEL_LOG_HTTP_REQUESTS=true)\n    return this.authService.getProfile();\n  }\n}\n```", "repository": "Paystack-MFB/nestjs-observability", "url": "https://github.com/Paystack-MFB/nestjs-observability/blob/87b280d79048785cb4cbf35ea3cb87b91d1b2f81/docs/best-practices.md?plain=1", "original_guideline": "DO: Use @NoLog for Sensitive Operations Even when HTTP request/response logging is enabled, you can exclude specific endpoints from being logged."}]}, {"id": "CG-0842", "guideline": "Enables the logging functionality of all loggers belonging to a specific instance.", "dimension": "Where to log", "theme": "Logging scope", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0843", "guideline": "Every service injects Datadog's Unified Service Tagging environment variables for correlated observability:.", "dimension": "Where to log", "theme": "Logging scope", "theme_basis": "Inductive", "original_count": "1", "examples": [{"reason": "Every service injects Datadog's [Unified Service Tagging](https://docs.datadoghq.com/getting_started/tagging/unified_service_tagging/) environment variables for correlated observability:\n\n```yaml\nenv:\n  - name: DD_SERVICE\n    value: \"estatewise-backend\"    # per-service identity\n  - name: DD_ENV\n    valueFrom:\n      fieldRef:\n        fieldPath: metadata.labels['tags.datadoghq.com/env']\n  - name: DD_VERSION\n    value: \"1.0.0\"                 # tracks deployed version\n  - name: DD_AGENT_HOST\n    valueFrom:\n      fieldRef:\n        fieldPath: status.hostIP\n  - name: DD_LOGS_INJECTION\n    value: \"true\"                  # correlate logs ↔ traces\n```", "repository": "hoangsonww/EstateWise-Chapel-Hill-Chatbot", "url": "https://github.com/hoangsonww/EstateWise-Chapel-Hill-Chatbot/blob/c56396596afd8f712fd98305f6cbefe991db7c1d/DEVOPS.md?plain=1", "original_guideline": "Every service injects Datadog's Unified Service Tagging environment variables for correlated observability:."}]}, {"id": "CG-0844", "guideline": "Fan out each message emitted through a logging base to every initialized logger attached to that base.", "dimension": "Where to log", "theme": "Logging scope", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0845", "guideline": "Full‑stack logging is active at all times (frontend, backend, API, engine/state).", "dimension": "Where to log", "theme": "Logging scope", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0846", "guideline": "Handle LOG_FILE.", "dimension": "Where to log", "theme": "Logging scope", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0847", "guideline": "In Prod: strukturiert (JSON) ohne Bodies bei sensiblen Endpoints.", "dimension": "Where to log", "theme": "Logging scope", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0848", "guideline": "In the refactored example no errors are logged in the `divide` or `calculate` functions. Instead, an error is created with fields labeled as \"divisor\" and \"dividend\" with those fields set to the values to which they relate. The error is also created with a brief, but sufficient, message, describing the issue.", "dimension": "Where to log", "theme": "Logging scope", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0849", "guideline": "Include `logging/` in the log record to capture Structured JSON logging.", "dimension": "Where to log", "theme": "Logging scope", "theme_basis": "Inductive", "original_count": "1", "examples": []}, {"id": "CG-0850", "guideline": "Include `rustpods --debug-airpods` in the log record to capture AirPods debug output enabled.", "dimension": "Where to log", "theme": "Logging scope", "theme_basis": "Inductive", "original_count": "1", "examples": [{"reason": "`rustpods --debug-airpods`: AirPods debug output enabled.", "repository": "Jay1/RustPods", "url": "https://github.com/Jay1/RustPods/blob/9bd9c17976b2409b4624bf1b958d3cc113223948/docs/index.md?plain=1", "original_guideline": "Include `rustpods --debug-airpods` in the log record to capture AirPods debug output enabled."}]}, {"id": "CG-0851", "guideline": "Include `rustpods --debug-bluetooth` in the log record to capture Bluetooth debug output enabled.", "dimension": "Where to log", "theme": "Logging scope", "theme_basis": "Inductive", "original_count": "1", "examples": [{"reason": "`rustpods --debug-bluetooth`: Bluetooth debug output enabled.", "repository": "Jay1/RustPods", "url": "https://github.com/Jay1/RustPods/blob/9bd9c17976b2409b4624bf1b958d3cc113223948/docs/index.md?plain=1", "original_guideline": "Include `rustpods --debug-bluetooth` in the log record to capture Bluetooth debug output enabled."}]}, {"id": "CG-0852", "guideline": "Include `rustpods --debug-config` in the log record to capture Config debug output enabled.", "dimension": "Where to log", "theme": "Logging scope", "t
