"Deductive", "original_count": "1", "examples": []}, {"id": "CG-1869", "guideline": "INFO is for lifecycle milestones, not per-item events.", "dimension": "Log verbosity", "theme": "INFO", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1870", "guideline": "Log `agent started` at INFO level with structured fields `agent`.", "dimension": "Log verbosity", "theme": "INFO", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "```python\n# INFO: Normal operation flow\nlog_structured(\"info\", \"agent started\", agent=self.agent_id)\n\n# WARNING: Recoverable issues\nlog_structured(\"warning\", \"retry attempt\", \n              attempt=3, \n              max_attempts=5,\n              trace_id=trace_id)\n\n# ERROR: Failures requiring attention\nlog_structured(\"error\", \"api call failed\", \n              service=\"alpaca\",\n              exc_info=True)  # ALWAYS use exc_info=True\n```", "repository": "SamuelMatthew95/trading-control", "url": "https://github.com/SamuelMatthew95/trading-control/blob/23f31d9205555629194fde09c11c7c87e34dcd6e/.claude/rules/memory-logging.md?plain=1", "original_guideline": "Log `agent started` at INFO level with structured fields `agent`."}]}, {"id": "CG-1871", "guideline": "Log `Starting payment processing` at INFO level.", "dimension": "Log verbosity", "theme": "INFO", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "// Good - Structured logging with correlation IDs and context\npublic class PaymentService : IPaymentService\n{\n    private readonly IPaymentRepository _paymentRepository;\n    private readonly ILogger<PaymentService> _logger;\n\n    public async Task<Result<Payment>> ProcessPaymentAsync(\n        PaymentRequest request, \n        CancellationToken cancellationToken = default)\n    {\n        using var scope = _logger.BeginScope(new Dictionary<string, object>\n        {\n            [\"PaymentId\"] = PaymentId.New(),\n            [\"CustomerId\"] = request.CustomerId,\n            [\"Amount\"] = request.Amount,\n            [\"Currency\"] = request.Currency\n        });\n\n        _logger.LogInformation(\"Starting payment processing\");\n\n        try\n        {\n            var validationResult = await ValidatePaymentAsync(request, cancellationToken);\n            if (!validationResult.IsValid)\n            {\n                _logger.LogWarning(\"Payment validation failed: {ValidationErrors}\", \n                    string.Join(\", \", validationResult.Errors));\n                return Result<Payment>.Failure(\"Validation failed\");\n            }\n\n            var payment = await CreatePaymentAsync(request, cancellationToken);\n            \n            _logger.LogInformation(\"Payment {PaymentId} processed successfully\", payment.Id);\n            return Result<Payment>.Success(payment);\n        }\n        catch (Exception ex)\n        {\n            _logger.LogError(ex, \"Payment processing failed\");\n            return Result<Payment>.Failure(\"Payment processing failed\");\n        }\n    }\n}", "repository": "jeastham1993/developer-prompts", "url": "https://github.com/jeastham1993/developer-prompts/blob/4c425502ecda97e28ac0ed823b9dcd7fa15de48e/dotnet.md?plain=1", "original_guideline": "Log `Starting payment processing` at INFO level."}]}, {"id": "CG-1872", "guideline": "Log informational messages at INFO level.", "dimension": "Log verbosity", "theme": "INFO", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "```ruby\nlogger.info('Information!')\n```\n\n```json\n{\"name\":\"main\",\"hostname\":\"mint\",\"pid\":14607,\"level\":30,\"time\":\"2016-10-16T22:26:48.835+09:00\",\"v\":0,\"msg\":\"Information!\"}\n```", "repository": "tilfin/ougai", "url": "https://github.com/tilfin/ougai/blob/397d07713c93f92a125c7ef6915f23c07df7db63/README.md?plain=1", "original_guideline": "Log informational messages at INFO level."}]}, {"id": "CG-1873", "guideline": "Log messages intended for users at INFO level.", "dimension": "Log verbosity", "theme": "INFO", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1874", "guideline": "Log method start and completion at INFO level and per-item processing details at DEBUG level.", "dimension": "Log verbosity", "theme": "INFO", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "```kotlin\nprivate val logger = logger()\n\nfun someMethod() {\n    logger.info { \"Starting method execution\" }\n    // Method implementation\n    logger.debug { \"Processed item: $item\" }\n    // More implementation\n    logger.info { \"Method execution completed\" }\n}\n```", "repository": "lemline/lemline", "url": "https://github.com/lemline/lemline/blob/434a695bd360025410cb452cc4c5b47d90aacfa2/docs/AGENTS.md?plain=1", "original_guideline": "Log method start and completion at INFO level and per-item processing details at DEBUG level."}]}, {"id": "CG-1875", "guideline": "Log4j is configured with level INFO. Change the value for the ROOT_LOGGER_LEVEL property in the config file to adjust the level.", "dimension": "Log verbosity", "theme": "INFO", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1876", "guideline": "Never log PHI at DEBUG/TRACE level (it's tempting to dump payloads for debugging) INFO should be the default production level for diagnostic logs Event journal entries are always INFO or higher — they should never be filtered WARN is not an error — it means \"this is unusual but the system handled it\" ERROR means something failed — if you're logging ERROR, there should be an actionable response FATAL means the process is about to exit — use sparingly.", "dimension": "Log verbosity", "theme": "INFO", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1877", "guideline": "Production level: `info`. Never ship `debug` or `trace` — they generate enormous volume and may leak PII.", "dimension": "Log verbosity", "theme": "INFO", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1878", "guideline": "Send an INFO logging notification to clients when the server starts successfully.", "dimension": "Log verbosity", "theme": "INFO", "theme_basis": "Deductive", "original_count": "3", "examples": [{"reason": "<Tabs>\n  <Tab title=\"Python\">\n    ```python\n    server.request_context.session.send_log_message(\n      level=\"info\",\n      data=\"Server started successfully\",\n    )\n    ```\n  <\/Tab>\n\n  <Tab title=\"TypeScript\">\n    ```typescript\n    server.sendLoggingMessage({\n      level: \"info\",\n      data: \"Server started successfully\",\n    });\n    ```\n  <\/Tab>\n<\/Tabs>", "repository": "aakarsh-sasi/memory-bank-mcp", "url": "https://github.com/aakarsh-sasi/memory-bank-mcp/blob/0813435550c7d9c3c81208d3c9f57946e16ae7e6/docs/requirements.md?plain=1", "original_guideline": "Send an INFO logging notification to clients when the server starts successfully."}, {"reason": "```python\n    server.request_context.session.send_log_message(\n      level=\"info\",\n      data=\"Server started successfully\",\n    )\n    ```", "repository": "wang-junjian/ragflow-mcp-server", "url": "https://github.com/wang-junjian/ragflow-mcp-server/blob/57b3e67dadd50d8e4e7efd74db3dc397f47a5f15/docs/mcp-llms-full.txt", "original_guideline": "Send an INFO logging notification to clients when the server starts successfully."}, {"reason": "```typescript\n    server.sendLoggingMessage({\n      level: \"info\",\n      data: \"Server started successfully\",\n    });\n    ```", "repository": "wang-junjian/ragflow-mcp-server", "url": "https://github.com/wang-junjian/ragflow-mcp-server/blob/57b3e67dadd50d8e4e7efd74db3dc397f47a5f15/docs/mcp-llms-full.txt", "original_guideline": "Send an INFO logging notification to clients when the server starts successfully."}]}, {"id": "CG-1879", "guideline": "Set the logging level to INFO.", "dimension": "Log verbosity", "theme": "INFO", "theme_basis": "Deductive", "original_count": "11", "examples": [{"reason": "```bash\nLOG_SERVICE_NAME=my-service\nLOG_FORMAT=json              # compact, pretty, json\nLOG_LEVEL=info\nLOG_SAMPLE_RATIO=0.1\nLOG_ANSI=false\nLOG_CONSOLE_ENABLED=true\nLOG_FILE_ENABLE=true\nLOG_FILE_DIR=/var/log\nLOG_FILE_PREFIX=myapp\nLOG_FILE_ROTATION=daily      # daily, hourly, minutely, never\n```", "repository": "nivek-ph/tracing-otel-extra", "url": "https://github.com/nivek-ph/tracing-otel-extra/blob/b9a926d44cb056a4f70658e0553638018d69cdb7/AGENTS.md?plain=1", "original_guideline": "Set the logging level to INFO."}, {"reason": "```yaml\napplications:\n  - name: my-app\n    env:\n      LOG_LEVEL: INFO  # or DEBUG, WARNING, ERROR\n```", "repository": "adhocteam/cloud-gov-instructions", "url": "https://github.com/adhocteam/cloud-gov-instructions/blob/64a6f40c7c07c5832faa4c9c9379df92b9ab311e/README.md?plain=1", "original_guideline": "Set the logging level to INFO."}, {"reason": "Setup logging before using strategies:\n\n```python\nfrom schwab_app.utils import setup_logging\n\nsetup_logging(\n    log_level=\"INFO\",  # DEBUG, INFO, WARNING, ERROR, CRITICAL\n    log_file=\"schwab_app.log\"  # Optional\n)\n```", "repository": "hdylizardeIdP/verbose-palm-tree", "url": "https://github.com/hdylizardeIdP/verbose-palm-tree/blob/66a66b496fe89c3f11b85f9fd7afe1dca63274e5/API.md?plain=1", "original_guideline": "Set the logging level to INFO."}, {"reason": "```env\nLOG_LEVEL=info\nLOG_TO_FILE=true\nLOG_FILE_PATH=logs/test-automation.log\nLOG_MAX_FILES=14\nLOG_MAX_SIZE=20m\n```", "repository": "omerakben/Playwright-Automation", "url": "https://github.com/omerakben/Playwright-Automation/blob/d61d9b43da038f58aa1501ac53d1cacfa59df290/Guide.md?plain=1", "original_guideline": "Set the logging level to INFO."}]}, {"id": "CG-1880", "guideline": "Set the right level. `DEBUG` for development noise, `INFO` for normal operations, `WARNING` for recoverable issues, `ERROR` for failures.", "dimension": "Log verbosity", "theme": "INFO", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1881", "guideline": "Use `GraphAILogger.info` for messages intended to be shown to users.", "dimension": "Log verbosity", "theme": "INFO", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1882", "guideline": "Use INFO as the default production log level and capture 100% of ERROR events without sampling.", "dimension": "Log verbosity", "theme": "INFO", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "id: \"log-level-production\",\n          label: \"Default Log Level in Production\",\n          detail: \"The minimum severity level to write to CloudWatch Logs in production.\",\n          currentState: \"DEBUG\",\n          correctState: \"INFO\",\n          states: [\"TRACE\", \"DEBUG\", \"INFO\", \"WARN\", \"ERROR\"],\n          rationaleId: \"r-log-level\",\n        },\n        {\n          id: \"sampling-errors\",\n          label: \"Error Log Sampling\",\n          detail: \"Whether to apply sampling to ERROR-level log events.\",\n          currentState: \"Sample at 10% (log 1 in 10 errors)\",\n          correctState: \"Log 100% of ERROR events (no sampling)\",\n          states: [\n            \"Sample at 1% (log 1 in 100 errors)\",\n            \"Sample at 10% (log 1 in 10 errors)\",\n            \"Sample at 50% (log 1 in 2 errors)\",\n            \"Log 100% of ERROR events (no sampling)\",\n          ],\n          rationaleId: \"r-error-sampling\",\n        },\n      ],", "repository": "kconlandci/CloudForge", "url": "https://github.com/kconlandci/CloudForge/blob/96c59c124ae4c96b7f2998c5961b50f8604f8f74/src/data/labs/log-aggregation-strategy.ts", "original_guideline": "Use INFO as the default production log level and capture 100% of ERROR events without sampling."}]}, {"id": "CG-1883", "guideline": "Use INFO for normal application flow, WARNING for invalid input or potentially problematic conditions, and reserve SEVERE for serious failures; add DEBUG/FINER only when more granular tracing is needed for complex logic.", "dimension": "Log verbosity", "theme": "INFO", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1884", "guideline": "Use INFO logging for the configured informational event.", "dimension": "Log verbosity", "theme": "INFO", "theme_basis": "Deductive", "original_count": "2", "examples": [{"reason": "```rust\nTraceLayer::new_for_http()\n    .make_span_with(AxumOtelSpanCreator::new().level(Level::INFO))\n    .on_response(AxumOtelOnResponse::new())\n    .on_failure(AxumOtelOnFailure::new())\n```", "repository": "nivek-ph/tracing-otel-extra", "url": "https://github.com/nivek-ph/tracing-otel-extra/blob/b9a926d44cb056a4f70658e0553638018d69cdb7/AGENTS.md?plain=1", "original_guideline": "Use INFO logging for the configured informational event."}]}, {"id": "CG-1885", "guideline": "Use severity-specific logging: INFO for `inference.started` with `prompt_id`, `prompt_length`; INFO for `inference.completed` with `prompt_id`, `response_length`.", "dimension": "Log verbosity", "theme": "INFO", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "```python\nimport hashlib\n\ndef hash_prompt(prompt: str) -> str:\n    return hashlib.sha256(prompt.encode()).hexdigest()[:16]\n\n# Log metadata, not content\nprompt_id = hash_prompt(user_prompt)\nlogger.info(\"inference.started\",\n           prompt_id=prompt_id,\n           prompt_length=len(user_prompt))\n\nresponse = llm(user_prompt)\n\nlogger.info(\"inference.completed\",\n           prompt_id=prompt_id,\n           response_length=len(response),\n           duration_ms=duration)\n```", "repository": "Probably-Group/Dev-AID", "url": "https://github.com/Probably-Group/Dev-AID/blob/f6b8cd262de49893f2245791f1d7e94fc0c4da12/.dev-aid/skills/expert/llm-integration/references/anti-patterns.md?plain=1", "original_guideline": "Use severity-specific logging: INFO for `inference.started` with `prompt_id`, `prompt_length`; INFO for `inference.completed` with `prompt_id`, `response_length`."}]}, {"id": "CG-1886", "guideline": "Use severity-specific logging: INFO for `User #{user.id} logged in`; INFO for `user_logged_in`.", "dimension": "Log verbosity", "theme": "INFO", "theme_basis": "Deductive", "original_count": "3", "examples": [{"reason": "Logs with string interpolation are harder to query:\n\n```ruby\n# ⚠️ Interpolated - hard to match in Loki/Kibana\nlogger.info(\"User #{user.id} logged in\")\n# Matches on: \"User \" and \" logged in\"\n\n# ✅ Structured - exact match\nlogger.info(\"user_logged_in\", user_id: user.id)\n# Matches on: \"user_logged_in\"\n```", "repository": "rossme/diffdash", "url": "https://github.com/rossme/diffdash/blob/cdc89a3381495a786d3ac8afe0a3fb4c0bdb7beb/DOCS.md?plain=1", "original_guideline": "Use severity-specific logging: INFO for `User #{user.id} logged in`; INFO for `user_logged_in`."}, {"reason": "Logs with interpolation are detected but harder to query:\n\n```ruby\n# ⚠️ Interpolated - harder to match\nlogger.info(\"User #{user.id} logged in\")\n\n# ✅ Structured - exact match\nlogger.info(\"user_logged_in\", user_id: user.id)\n```\n\nRun `diffdash lint --verbose` to see all interpolated logs.", "repository": "rossme/diffdash", "url": "https://github.com/rossme/diffdash/blob/cdc89a3381495a786d3ac8afe0a3fb4c0bdb7beb/DOCS.md?plain=1", "original_guideline": "Use severity-specific logging: INFO for `User #{user.id} logged in`; INFO for `user_logged_in`."}]}, {"id": "CG-1887", "guideline": "Use severity-specific logging: INFO for `user_created`; INFO for `Loaded widget #{id}`.", "dimension": "Log verbosity", "theme": "INFO", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "**Plain strings/symbols** — exact match:\n```ruby\nlogger.info(\"user_created\")\n# Grafana: |= \"user_created\"\n# Kibana: message:\"user_created\"\n```\n\n**Interpolated strings** — static parts extracted:\n```ruby\nlogger.info(\"Loaded widget #{id}\")\n# Grafana: |= \"Loaded widget \"\n# Kibana: message:\"Loaded widget \"\n```", "repository": "rossme/diffdash", "url": "https://github.com/rossme/diffdash/blob/cdc89a3381495a786d3ac8afe0a3fb4c0bdb7beb/DOCS.md?plain=1", "original_guideline": "Use severity-specific logging: INFO for `user_created`; INFO for `Loaded widget #{id}`."}]}, {"id": "CG-1888", "guideline": "Use V(0)/INFO logging for one-time startup information that is useful for debugging.", "dimension": "Log verbosity", "theme": "INFO", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1889", "guideline": "Using `info` for high-frequency events that flood production logs.", "dimension": "Log verbosity", "theme": "INFO", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1890", "guideline": "Within workflow context, log workflow execution start and completion at INFO level so workflow ID, name, version, and node position are attached.", "dimension": "Log verbosity", "theme": "INFO", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "```kotlin\nprivate val logger = logger()\n\nsuspend fun run() {\n    withWorkflowContext(\n        workflowId = id,\n        workflowName = name,\n        workflowVersion = version,\n        nodePosition = position.toString()\n    ) {\n        logger.info { \"Starting workflow execution\" }\n        // Workflow execution\n        logger.info { \"Workflow execution completed\" }\n    }\n}\n```", "repository": "lemline/lemline", "url": "https://github.com/lemline/lemline/blob/434a695bd360025410cb452cc4c5b47d90aacfa2/docs/AGENTS.md?plain=1", "original_guideline": "Within workflow context, log workflow execution start and completion at INFO level so workflow ID, name, version, and node position are attached."}]}, {"id": "CG-1891", "guideline": "| INFO | Interesting runtime events | Workflow started/completed, service startup |.", "dimension": "Log verbosity", "theme": "INFO", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1892", "guideline": "\"404 Not Found logged as error. This is normal operation, use info or warn.\".", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1893", "guideline": "\"Default to 'info': process.env.LOG_LEVEL || 'info'\".", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1894", "guideline": "\"Log level for structured logging (debug, info, warn, error).\".", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1895", "guideline": "\"Use logger.error() or logger.warn() for error conditions\".", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1896", "guideline": "`--log-level <level>` - Minimum log level (Verbose, Debug, Information, Warning, Error, Fatal).", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1897", "guideline": "`ERROR` - means the operator should take action `WARN` - means the operator should pay attention.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1898", "guideline": "`klog.InfoS` Logging at the `V(0)` verbosity level is generally welcome here as this is only logged once at startup, and provides useful info for debugging.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1899", "guideline": "`Log levels: Verbose, Debug, Information, Warning, Error, Fatal`.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1900", "guideline": "`LOG_REQUESTS` - Enable detailed request/response logging (default: `false`) `true` - Log request headers, body, query params, session details `false` - Only log request method and path.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1901", "guideline": "`RUBRIK_POLARIS_LOGLEVEL` - Overrides the log level of the provider. Valid log levels are: `FATAL`, `ERROR`, `WARN`, `INFO`, `DEBUG`, `TRACE` and `OFF`. The default log level of the provider is `WARN`.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1902", "guideline": "`TF_LOG_PROVIDER_POLARIS_API` - Controls the log level specifically for API calls made by the provider to the Polaris service. This allows you to separately control the verbosity of API-related logging.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1903", "guideline": "`TF_LOG_PROVIDER_POLARIS` - Controls the log level for the Terraform provider itself. Valid log levels are: `TRACE`, `DEBUG`, `INFO`, `WARN`, `ERROR`, and `OFF`. This variable follows Terraform's standard logging conventions.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1904", "guideline": "`tryCatchLog` and `tryCatch` now have two additional arguments named `include.full.call.stack` and `include.compact.call.stack` which can also be configured globally via options.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1905", "guideline": "`V(VERBOSE)` and above: use best judgement.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "2", "examples": []}, {"id": "CG-1906", "guideline": "Ability to define a log level and runtime that limits the logs emitted.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1907", "guideline": "Add option `tryCatchLog.max.lines.per.call` to change the maximum number of source code rows printed in the full call stack per call.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1908", "guideline": "Added: Parameter `silent.messages` to `tryCatchLog` and `tryLog`.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1909", "guideline": "Allow the client's logging level to be adjusted at runtime using valid `zerolog` levels such as DEBUG, INFO, WARN, and ERROR.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1910", "guideline": "Apply these logging thresholds: API request duration — warn at 300 ms (NFR threshold per doc-02), error at 1 000 ms; Database query duration — warn at 500 ms, error at 2 000 ms; BullMQ job duration — warn at 30 000 ms, error at 120 000 ms; Queue backlog (waiting jobs) — warn at 1 000, error at 5 000; Failed jobs count — warn at 100, error at 500.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1911", "guideline": "As `logger.V` calls are cummulative, i.e. `logger.V(2).V(3)` results in `logger.V(5)`, a logger should be passed around with no verbosity level set so that `logger.V(DEFAULT)` actually uses `DEFAULT` verbosity level.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1912", "guideline": "Assign severity by impact and frequency: ERROR when processing cannot continue correctly, WARN for ignored failures that may matter later, INFO for infrequent useful information, DEBUG for troubleshooting details, and TRACE for very frequent low-level library diagnostics.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1913", "guideline": "At LOGINFO, log a single entry summarizing their disposition.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1914", "guideline": "Before logging, we need to determine the log level. Log levels help prioritize log information, reduce noise, and prevent alert fatigue. They also aid in filtering logs during searches.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1915", "guideline": "C.log = c.log.Level(zerolog.InfoLevel).", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "c.log = c.log.Level(zerolog.InfoLevel)", "repository": "SilvaMendes/go-rtpengine", "url": "https://github.com/SilvaMendes/go-rtpengine/blob/9b431cd1587fde69c9e3dcce6121927a562645d3/client.go", "original_guideline": "C.log = c.log.Level(zerolog.InfoLevel)."}]}, {"id": "CG-1916", "guideline": "Check log level isn't too restrictive.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1917", "guideline": "Check minimum level before sending to channel to avoid unnecessary work.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1918", "guideline": "Check performance instrumentation — verify slow thresholds, duration tracking, OTel spans.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1919", "guideline": "Choose severity by operational significance and cost: TRACE for deep debugging but avoid hot paths, DEBUG for useful diagnostics that are not per-event, INFO for normal high-level lifecycle or successful actions, WARN for recoverable unexpected conditions, and ERROR for data loss or failures requiring operator intervention.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1920", "guideline": "Clients can control the minimum logging level they receive through the `mcpClient.setLoggingLevel(level)` request. Messages below the set level will be filtered out. Supported logging levels (in order of increasing severity): DEBUG (0), INFO (1), NOTICE (2), WARNING (3), ERROR (4), CRITICAL (5), ALERT (6), EMERGENCY (7).", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1921", "guideline": "Configure via environment - LOG_LEVEL in manifest.yml.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1922", "guideline": "Cost Optimization: Filter or aggregate data to reduce ingestion costs.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1923", "guideline": "Created comprehensive `Logger.swift` with: Multiple log levels (verbose, debug, info, warning, error, critical) Category-based logging OS Log integration File logging support Performance measurement utilities.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1924", "guideline": "Current time and future scheduled times.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1925", "guideline": "Current workaround is to double the line count on the configuration.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1926", "guideline": "Debug detailed information on the flow through the system (REST request/response, TCP packets). Require no action from the support team.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1927", "guideline": "Debug logs are not excessive (would not flood logs if accidentally enabled).", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1928", "guideline": "Debug messages are suppressed unless explicitly enabled.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1929", "guideline": "Debug mode shows job timestamps.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1930", "guideline": "Debug This level is mostly used for development to provide more granular, diagnostic information. Here you will provide more detail than you’d generally want in production. Highly detailed tracing that can be used for development and for fellow developers. These should generally be removed from the production application.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1931", "guideline": "Debug!(\"Authentication check passed\");.", "dimension": " tatus: {}\", response.status());.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "debug!(\"Successfully proxied request, status: {}\", response.status());", "repository": "MikeTeddyOmondi/locci-lb", "url": "https://github.com/MikeTeddyOmondi/locci-lb/blob/1bbf86109c57813825a5498b70ab98d40365adf0/DOCS.md?plain=1", "original_guideline": "Debug!(\"Successfully proxied request, status: {}\", response.status());."}]}, {"id": "CG-1936", "guideline": "Debug/Info Logging: Can occur at any level for progress tracking and debugging.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1937", "guideline": "Default log level in the reconcilers.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "2", "examples": []}, {"id": "CG-1938", "guideline": "Define performance logging thresholds (slow queries, slow requests, slow jobs).", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1939", "guideline": "Deliver your verdict via session completion — this auto-announces back to the Orchestrator. Also post the verdict to #review-verdicts. Route to the appropriate severity channel per the notification matrix: INFO → #review-verdicts only WARN → #review-verdicts + #status-updates BLOCKED → #review-verdicts + #status-updates + #severity-alerts CRITICAL → #review-verdicts + #status-updates + #severity-alerts + #human-oversight (via Orchestrator).", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1940", "guideline": "Development (`ENVIRONMENT=development`): All logs (INFO, DEBUG, etc.) are shown.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1941", "guideline": "Development (verbose logging):.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "**Development (verbose logging):**\n```bash\nLOG_REQUESTS=true\n```", "repository": "sveneisenschmidt/n8n-openai-bridge", "url": "https://github.com/sveneisenschmidt/n8n-openai-bridge/blob/98976fe041d5ca6ce4dc01cfc63a60ba3012350e/docs/LOGGING.md?plain=1", "original_guideline": "Development (verbose logging):."}]}, {"id": "CG-1942", "guideline": "Different log levels for different audiences.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "2", "examples": []}, {"id": "CG-1943", "guideline": "Different log levels: error, warn, info, debug.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1944", "guideline": "Display a logger's messages only when the message level is greater than or equal to the Signale instance's configured general `logLevel` threshold.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1945", "guideline": "Document environment variable setup and log level configuration.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1946", "guideline": "Each log statement has an appropriate level per the definitions above.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1947", "guideline": "Emit a log message only when its severity is at or above the logger's configured minimum level.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "func (l *DefaultLogger) shouldLog(level LogLevel) bool {\n\treturn level >= l.level\n}", "repository": "noelukwa/localbase", "url": "https://github.com/noelukwa/localbase/blob/566f3289289ba87abd9864d831f63bd82217814e/util.go", "original_guideline": "Emit a log message only when its severity is at or above the logger's configured minimum level."}]}, {"id": "CG-1948", "guideline": "Enable DEBUG logging for the provider, including API calls Enable TRACE logging for API calls only Enable both provider and API logging at different levels Direct provider logs to a specific file.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "```shell\n# Enable DEBUG logging for the provider, including API calls\nexport TF_LOG_PROVIDER_POLARIS=DEBUG\n\n# Enable TRACE logging for API calls only\nexport TF_LOG_PROVIDER_POLARIS_API=TRACE\n\n# Enable both provider and API logging at different levels\nexport TF_LOG_PROVIDER_POLARIS=INFO\nexport TF_LOG_PROVIDER_POLARIS_API=DEBUG\n\n# Direct provider logs to a specific file\nexport TF_LOG_PROVIDER_PATH=./polaris-provider.log\n```", "repository": "rubrikinc/terraform-provider-polaris", "url": "https://github.com/rubrikinc/terraform-provider-polaris/blob/3fabc363c64e032169b6bc90ee4f44b4d0310822/docs/index.md?plain=1", "original_guideline": "Enable DEBUG logging for the provider, including API calls Enable TRACE logging for API calls only Enable both provider and API logging at different levels Direct provider logs to a specific file."}]}, {"id": "CG-1949", "guideline": "Ensure that log messages are appropriate in content and severity.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1950", "guideline": "Error represents a failure occurring within the application. Here we could have something like a connection going down or a file missing, that will typically require attention from someone sooner or later. Unlike Fatal, an error does not usually lead to the application going down but rather the application operating suboptimally until remedial action is taken.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1951", "guideline": "Error runtime error fatal to the operation but not to service/application (cant open a required file, missing data). Require urgent intervention from a sysadmin or developer.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1952", "guideline": "Errors should never be sampled. Sampling at 10% means 90% of error events are silently dropped — a systematic error affecting every request would appear as only 10% of its true volume, making alert thresholds unreliable. Sample high-volume INFO/DEBUG logs; always capture 100% of errors.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1953", "guideline": "Every `odo` command takes an optional flag `-v` that must be used with an integer log level in the range from 0-9. Any INFO severity log statement that is logged at a level lesser than or equal to the one passed with the command alongside `-v` flag will be logged to STDOUT. All ERROR severity level log messages will always be logged regardless of the passed `v` level.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1954", "guideline": "Excessive debug in prod: Cost and noise.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1955", "guideline": "Excessive logging: Same message flooding logs.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1956", "guideline": "Fail Fast, Fail Loud - Validate early, throw specific exceptions, log everything.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1957", "guideline": "Fatal critical/severe error forcing a shutdown of service/application, risk of data loss/corruption (db connection error). Require immediate action from a sysadmin or developer.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1958", "guideline": "For information about requests made to a distribution in real time, use real-time logs that are delivered within seconds of receiving the requests. You should use real-time logs to monitor, analyze, and take action based on content delivery performance.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1959", "guideline": "Handle LOG_LEVEL.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1960", "guideline": "Hard limits prevent noisy dashboards: Excess signals are truncated with a warning: Logs: 10; Metrics: 10; Total Panels: 12.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1961", "guideline": "Hook output should be truncated in logs.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1962", "guideline": "If loglevel is a whole number, then all log activity in the plugin is logged at that level, regardless of the level the plugin author selected. This can be easily understood with a couple examples.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1963", "guideline": "If you aren't processing the logs, you can save some disk I/O by reducing the loglevel, so that the only messages logged are ones that indicate a human should be taking some corrective action.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1964", "guideline": "Implement feature request #62: Optional logging of conditions via the new `logged.conditions` argument (https://github.com/aryoda/tryCatchLog/issues/62). Conditions are now no longer logged by default to avoid flooding the log output.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1965", "guideline": "Implement log-level filtering so DEBUG includes all messages, INFO includes informational and more severe messages, ERROR includes error and fatal messages, and FATAL includes fatal messages only.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "// LogLevel represents the logging level\ntype LogLevel int\n\nconst (\n\t// DebugLevel logs all messages\n\tDebugLevel LogLevel = iota\n\t// InfoLevel logs info, error, and fatal messages\n\tInfoLevel\n\t// ErrorLevel logs error and fatal messages\n\tErrorLevel\n\t// FatalLevel logs only fatal messages\n\tFatalLevel\n)", "repository": "noelukwa/localbase", "url": "https://github.com/noelukwa/localbase/blob/566f3289289ba87abd9864d831f63bd82217814e/util.go", "original_guideline": "Implement log-level filtering so DEBUG includes all messages, INFO includes informational and more severe messages, ERROR includes error and fatal messages, and FATAL includes fatal messages only."}]}, {"id": "CG-1966", "guideline": "Implemented feature request #44: Support configurable suppression of compact and full stack trace (https://github.com/aryoda/tryCatchLog/issues/44).", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1967", "guideline": "In client applications: Enable debug logging Monitor network traffic Track message exchanges Record error states.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1968", "guideline": "Include `LOG_LEVEL` in the log record to capture Controls logging verbosity.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1969", "guideline": "Include `LOG_LEVEL` in the log record to capture Logging level (INFO, DEBUG, ERROR).", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1970", "guideline": "Include `rustpods --quiet` in the log record to capture Errors only.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "`rustpods --quiet`: Errors only.", "repository": "Jay1/RustPods", "url": "https://github.com/Jay1/RustPods/blob/9bd9c17976b2409b4624bf1b958d3cc113223948/docs/index.md?plain=1", "original_guideline": "Include `rustpods --quiet` in the log record to capture Errors only."}]}, {"id": "CG-1971", "guideline": "Include criteria for evaluating appropriate log levels and debug output.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1972", "guideline": "Inconsistent level choices across similar operations in the same service.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1973", "guideline": "Inconsistent logging: Different levels for similar issues.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1974", "guideline": "Incorporated DEBUG, INFO, WARN, and ERROR levels. Example: In `TutorialController.java`, DEBUG logs entry into methods, INFO logs successful operations, WARN logs when tutorials are not found, and ERROR logs exceptions.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1975", "guideline": "Incorrect Log Levels Problem: Using wrong log levels makes filtering difficult.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": [{"reason": "### Incorrect Log Levels\n\n**Problem**: Using wrong log levels makes filtering difficult.\n\n```csharp\n// BAD: Using Information for errors\nlogger.LogInformation(\"Failed to connect to database: {Error}\", ex.Message);\n\n// BAD: Using Error for normal operations\nlogger.LogError(\"Request completed successfully\");\n\n// BAD: Using Debug for critical failures\nlogger.LogDebug(\"Payment processing failed: {Error}\", ex.Message);\n\n// GOOD: Match level to severity\nlogger.LogDebug(\"Entering method {MethodName}\", nameof(ProcessAsync));\nlogger.LogInformation(\"Order {OrderId} processed successfully\", orderId);\nlogger.LogWarning(\"Retry attempt {Attempt} of {MaxAttempts}\", attempt, max);\nlogger.LogError(ex, \"Payment {PaymentId} failed\", paymentId);\nlogger.LogCritical(\"Database connection pool exhausted\");\n```", "repository": "Postpartum-genushyacinthus29/dotnet-skills", "url": "https://github.com/Postpartum-genushyacinthus29/dotnet-skills/blob/0220509679e131ca2957d79157fa5ee93a439cd0/skills/dotnet-microsoft-extensions/references/anti-patterns.md?plain=1", "original_guideline": "Incorrect Log Levels Problem: Using wrong log levels makes filtering difficult."}]}, {"id": "CG-1976", "guideline": "Increasing log levels to \"Debug\" in production (cost/noise implications).", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1977", "guideline": "Individual job scheduling details.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1978", "guideline": "Info important/useful runtime events (service start/stop, configuration details, event causing spinoff processes, scheduled execution, requests sent to external API). Require no action from the support team.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1979", "guideline": "INFO: Normal operations and user actions ERROR: Error conditions and exceptions DEBUG: Detailed protocol information.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1980", "guideline": "Keep log entries brief and factual.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1981", "guideline": "Keep logs concise, consistent, and aligned with assertions.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1982", "guideline": "Level 6, LOGINFO, is the level at which most servers should start logging. At level 6, each plugin should log one and occasionally two entries that summarize their activity. Here's a few sample lines.", "dimension": "Log verbosity", "theme": "Log level selection", "theme_basis": "Deductive", "original_count": "1", "examples": []}, {"id": "CG-1983", "guideline
